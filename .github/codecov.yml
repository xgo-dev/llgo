ignore:
  - "benchmark"
  - "cmd/chore"
  - "cmd/llgo"
  - "cmd/internal"
  - "cmd/cl/cltest"
  - "cmd/compiler/llgen"
  - "cmd/compiler/mockable"
  - "cmd/compiler/packages"
  - "cmd/compiler/typepatch"
  - "cmd/compiler/github"
  - "cmd/compiler/firmware"
  - "cmd/compiler/flash"
  - "cmd/compiler/monitor"
  - "cmd/xtool"

# test/ is measured only by LLGo. The host Go workflow filters those records
# before uploading; a global ignore would also discard the LLGo coverage.
flags:
  go-tests:
    carryforward: false
  llgo-tests:
    paths:
      - "test/"
    carryforward: false
