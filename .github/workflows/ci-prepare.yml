name: Prepare CI

on:
  workflow_call:
    outputs:
      run_code_ci:
        description: Run compiler, runtime, install, release and benchmark checks
        value: ${{ jobs.prepare.outputs.run_code_ci }}
      run_doc_checks:
        description: Run the existing README link and embedded-source checks
        value: ${{ jobs.prepare.outputs.run_doc_checks }}
      pr_head_sha:
        description: PR head from the triggering event
        value: ${{ jobs.prepare.outputs.pr_head_sha }}
      pr_merge_base:
        description: Merge base of the triggering PR base and head
        value: ${{ jobs.prepare.outputs.pr_merge_base }}
      linux_runner:
        description: JSON runner labels for ordinary Linux jobs
        value: ${{ jobs.prepare.outputs.linux_runner }}
      linux_large_runner:
        description: JSON runner labels for heavy Linux jobs
        value: ${{ jobs.prepare.outputs.linux_large_runner }}
      windows_2022_runner:
        description: JSON runner labels for Windows 2022 jobs
        value: ${{ jobs.prepare.outputs.windows_2022_runner }}
      windows_2025_runner:
        description: JSON runner labels for Windows 2025 jobs
        value: ${{ jobs.prepare.outputs.windows_2025_runner }}

permissions:
  contents: read

# Do not use the caller's concurrency group here: it would cancel the caller.
jobs:
  prepare:
    # Bootstrap cannot consume its own outputs. Forks keep a hosted runner.
    runs-on: ${{ fromJSON(github.repository_owner == 'xgo-dev' && '["qiniu", "ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    outputs:
      run_code_ci: ${{ steps.policy.outputs.run_code_ci }}
      run_doc_checks: ${{ steps.policy.outputs.run_doc_checks }}
      pr_head_sha: ${{ steps.policy.outputs.pr_head_sha }}
      pr_merge_base: ${{ steps.policy.outputs.pr_merge_base }}
      linux_runner: ${{ steps.policy.outputs.linux_runner }}
      linux_large_runner: ${{ steps.policy.outputs.linux_large_runner }}
      windows_2022_runner: ${{ steps.policy.outputs.windows_2022_runner }}
      windows_2025_runner: ${{ steps.policy.outputs.windows_2025_runner }}
    steps:
      - uses: actions/checkout@v7
        env:
          # Let fetch retries run before the five-minute job timeout.
          GIT_HTTP_LOW_SPEED_LIMIT: '1'
          GIT_HTTP_LOW_SPEED_TIME: '60'
        with:
          # Keep the PR commit graph, fetching historical blobs only on demand.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: blob:none
          persist-credentials: false
      - name: Resolve CI policy and changed paths
        id: policy
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # PR policy runs from the base, which may not yet expose Windows runners.
          if [[ "$GITHUB_REPOSITORY_OWNER" == "xgo-dev" ]]; then
            echo 'windows_2022_runner=["qiniu", "windows-11"]' >> "$GITHUB_OUTPUT"
            echo 'windows_2025_runner=["qiniu", "windows-11"]' >> "$GITHUB_OUTPUT"
          else
            echo 'windows_2022_runner=["windows-2022"]' >> "$GITHUB_OUTPUT"
            echo 'windows_2025_runner=["windows-2025"]' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            # Main, tags and manual runs execute the checked-out trusted code.
            python3 .github/scripts/ci_policy.py
            exit 0
          fi

          # The checkout is the PR merge commit. Load the policy modules from
          # the base so PR edits to those modules cannot suppress code checks.
          policy_dir="$RUNNER_TEMP/llgo-ci-policy"
          mkdir -p "$policy_dir"
          if [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             git show "$PR_BASE_SHA:.github/scripts/ci_policy.py" > "$policy_dir/ci_policy.py" &&
             git show "$PR_BASE_SHA:.github/scripts/ci_changes.py" > "$policy_dir/ci_changes.py"; then
            python3 "$policy_dir/ci_policy.py"
            exit 0
          fi

          # Before this workflow lands on main, the base has no policy modules.
          # A missing base commit or module must also enable every suite.
          echo "::warning::Base CI policy unavailable; all checks enabled"
          pr_head_sha=""
          pr_merge_base=""
          if [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            pr_head_sha="$PR_HEAD_SHA"
            pr_merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")" || pr_merge_base=""
          fi
          {
            echo "run_code_ci=true"
            echo "run_doc_checks=true"
            echo "pr_head_sha=$pr_head_sha"
            echo "pr_merge_base=$pr_merge_base"
            if [[ "$GITHUB_REPOSITORY_OWNER" == "xgo-dev" ]]; then
              echo 'linux_runner=["qiniu", "ubuntu-24.04"]'
              echo 'linux_large_runner=["qiniu", "ubuntu-24.04-large"]'
            else
              echo 'linux_runner=["ubuntu-24.04"]'
              echo 'linux_large_runner=["ubuntu-24.04"]'
            fi
          } >> "$GITHUB_OUTPUT"
          echo "Base CI policy unavailable; all checks enabled." >> "$GITHUB_STEP_SUMMARY"
