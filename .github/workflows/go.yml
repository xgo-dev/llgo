# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The known-good #172 Windows coverage run took about 56 minutes. Leave
    # room for runner variance and the additional shared-matrix checks without
    # changing the established Linux/macOS budget.
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            llvm: 19
            go: "1.26.7"
          - os: macos-latest
            llvm: 19
            go: "1.27.0"
          - os: ubuntu-latest
            llvm: 19
            go: "1.26.7"
          - os: ubuntu-latest
            llvm: 19
            go: "1.27.0"
          - os: windows-2022
            llvm: 19
            go: "1.26.7"
          - os: windows-2022
            llvm: 19
            go: "1.27.0"
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Install embedded dependencies
        uses: ./.github/actions/setup-embed-deps

      - name: Clang information
        shell: bash
        run: |
          echo $PATH
          which clang
          clang --version

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go }}

      - name: Install further optional dependencies for demos
        uses: ./.github/actions/setup-demo-deps

      - name: Set LLGO_ROOT
        shell: bash
        run: echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          go build -v ./...

      - name: Validate Windows host-only integration
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          # Keep the concurrency stress from the former dedicated workflow;
          # one ordinary package run does not prove mutual exclusion.
          go test -count=20 -timeout=10m -run 'Lock' ./internal/crosscompile

          # The runtime is a nested module and is therefore outside ./....
          # These host-side FFI tests still need native Windows coverage.
          (
            cd runtime
            go test -count=1 -timeout=10m \
              ./internal/ffi ./internal/clite/ffi ./internal/lib/reflect
            for arch in 386 arm64; do
              CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go test -c \
                -o "$RUNNER_TEMP/llgo-ffi-$arch.test.exe" ./internal/ffi
            done
          )

          ffi_include="$(pkg-config --variable=includedir libffi)"
          clang -target x86_64-pc-windows-msvc -I"$ffi_include" -c \
            runtime/internal/clite/ffi/_wrap/libffi.c \
            -o "$RUNNER_TEMP/llgo-libffi-amd64.obj"
          llvm-readobj --file-headers "$RUNNER_TEMP/llgo-libffi-amd64.obj"

      # Every host uploads coverage: OS-specific ELF, Mach-O, and COFF paths
      # plus per-OS runtime shims are otherwise invisible to codecov/patch.
      - name: Test with coverage
        # 45m: the caller-info acceptance suite (test/go) legitimately grew
        # the covered run past the old 30m budget on macOS runners.
        shell: bash
        run: |
          set -euo pipefail

          go_test=(go test)
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Go's internal linker cannot consume every GNU COFF import
            # archive used by the race runtime and LLVM. Use the configured
            # Clang driver for the host test binaries instead of excluding
            # those packages from the shared suite.
            go_test+=("-ldflags=-linkmode=external -extldflags=-lsynchronization")
            export LLGO_REQUIRE_MSVC=1
            export LLGO_STDIO_NOBUF=1
          fi

          # test/go intentionally contains compiler edge cases that make the
          # Go 1.26 printf analyzer panic. Keep the normal go test vet gate
          # for every other package, and disable vet only for that package.
          go list ./... \
            | grep -v '^github.com/xgo-dev/llgo/test/go$' \
            | xargs "${go_test[@]}" -timeout 45m -coverprofile="coverage-main.txt" -covermode=atomic \
                -bench '^BenchmarkGo126' -benchtime=1x
          "${go_test[@]}" -timeout 45m -vet=off \
            -coverprofile="coverage-test-go.txt" -covermode=atomic ./test/go

          head -n 1 coverage-main.txt > coverage.txt
          tail -n +2 coverage-main.txt >> coverage.txt
          tail -n +2 coverage-test-go.txt >> coverage.txt

      - name: Test with embedded emulator env
        env:
          LLGO_EMBED_TESTS: "1"
        run: go test -v -timeout 60m ./cl -run '^TestRunEmbedEmulator$'

      - name: Check std symbol coverage
        shell: bash
        run: bash doc/_readme/scripts/check_std_cover.sh

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}

  dev-lto-globaldce:
    name: Dev LTO GlobalDCE
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 19

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Setup demo dependencies
        uses: ./.github/actions/setup-demo-deps

      - name: Set LLGO_ROOT
        run: echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Build llgo with dev tag
        run: go install -tags=dev ./cmd/llgo

      - name: Build LTO plugin
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          llvm_config="$(command -v llvm-config || command -v llvm-config-19)"
          cmake -S ltoplugin -B ltoplugin/build \
            -DLLVM_DIR="$("${llvm_config}" --cmakedir)" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ltoplugin/build --config Release

          echo "LLGO_LTO_PLUGIN=$GITHUB_WORKSPACE/ltoplugin/build/LLGOLTOPlugin.so" >> "$GITHUB_ENV"

      - name: Run dev LTO GlobalDCE tests and demos with coverage
        run: |
          set -euo pipefail

          go test -tags=dev -timeout 30m -covermode=atomic \
            -coverprofile=coverage-dev-globaldce-unit.txt \
            -run '^TestDevLTOGlobalDCE' \
            ./ssa ./internal/build ./internal/crosscompile ./cmd/internal/flags ./internal/cabi
          go tool cover -func=coverage-dev-globaldce-unit.txt

          go test -tags=dev -timeout 30m -covermode=atomic \
            -coverpkg=github.com/xgo-dev/llgo/ssa,github.com/xgo-dev/llgo/internal/build,github.com/xgo-dev/llgo/internal/crosscompile \
            -coverprofile=coverage-dev-lto-globaldce-cl.txt \
            -run '^TestRunAndTestFromTestlto/globaldce_' \
            ./cl
          go tool cover -func=coverage-dev-lto-globaldce-cl.txt

          go test -tags=dev -timeout 30m -covermode=atomic \
            -coverpkg=github.com/xgo-dev/llgo/ssa,github.com/xgo-dev/llgo/internal/build,github.com/xgo-dev/llgo/internal/crosscompile \
            -coverprofile=coverage-dev-lto-globaldce-symbols.txt \
            -run '^TestBuildAndCheckSymbolsFromTestlto/globaldce_' \
            ./cl
          go tool cover -func=coverage-dev-lto-globaldce-symbols.txt

          go test -tags=dev -timeout 30m -covermode=atomic \
            -coverpkg=github.com/xgo-dev/llgo/ssa,github.com/xgo-dev/llgo/internal/build,github.com/xgo-dev/llgo/internal/crosscompile \
            -coverprofile=coverage-dev-lto-plugin-cl.txt \
            -run '^(TestRunAndTestFromTestltoLTOPlugin|TestBuildAndCheckSymbolsFromTestltoLTOPlugin)' \
            ./cl
          go tool cover -func=coverage-dev-lto-plugin-cl.txt

          LLGO_DEMO_LLGORUN_FLAGS="-lto=full -globaldce" \
            bash .github/workflows/test_demo.sh

      - name: Upload dev LTO GlobalDCE coverage reports to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: coverage-dev-globaldce-unit.txt,coverage-dev-lto-globaldce-cl.txt,coverage-dev-lto-globaldce-symbols.txt,coverage-dev-lto-plugin-cl.txt
          flags: dev-lto-globaldce

  # Tests deletion of unreachable Go methods.
  # See https://github.com/xgo-dev/llgo/issues/1853.
  dev-go-methoddrop:
    name: Dev Go Method Drop
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 19

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Setup demo dependencies
        uses: ./.github/actions/setup-demo-deps

      - name: Set LLGO_ROOT
        run: echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Build llgo with dev tag
        run: go install -tags=dev ./cmd/llgo

      - name: Run Go method drop tests
        run: go test -tags=dev -timeout 30m -run '^TestBuildAndCheckSymbolsFromTestdrop$' ./cl

      - name: Run Go deadcode-drop demos
        run: |
          LLGO_DEMO_LLGORUN_FLAGS="-deadcodedrop" \
            bash .github/workflows/test_demo.sh
