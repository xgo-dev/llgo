name: Installer shells

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
    paths:
      - install.sh
      - install.ps1
      - test/installer/**
      - .github/**

permissions:
  contents: read

concurrency:
  group: installer-shells.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  installer-shells:
    name: Installer shell startup (${{ matrix.image }})
    needs: prepare
    runs-on: ${{ matrix.runner || fromJSON(needs.prepare.outputs.linux_large_runner) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:12
          - fedora:latest
          - archlinux:latest
          - alpine:latest
          - opensuse/tumbleweed:latest
        include:
          # On the sandbox host, Fedora fish remained in D state after reaching
          # its final assertion. Keep the full tests on a standard Docker host.
          - image: fedora:latest
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Keep distro downloads independent without repeating compiler builds.
      - name: Test Bash, zsh, fish, and sh
        env:
          INSTALLER_TEST_IMAGE: ${{ matrix.image }}
        run: bash test/installer/install_shell_distro_test.sh "$INSTALLER_TEST_IMAGE"
