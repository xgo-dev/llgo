name: Mise development environment

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: mise.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  ci-gate:
    name: CI gate (Mise)
    needs: prepare
    if: always() && !cancelled()
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_runner || '["ubuntu-24.04"]') }}
    steps:
      - name: Verify CI preparation succeeded
        run: test "${{ needs.prepare.result }}" = "success"

  devenv:
    if: needs.prepare.outputs.run_code_ci == 'true'
    name: Mise (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os == 'windows-2025' && fromJSON(needs.prepare.outputs.windows_2025_runner) || matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: llgo dev
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
    steps:
      - name: Install Windows build tools on Qiniu
        if: github.repository_owner == 'xgo-dev' && matrix.os == 'windows-2025'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = Join-Path $env:RUNNER_TEMP '7zip.msi'
          Invoke-WebRequest -Uri 'https://github.com/ip7z/7zip/releases/download/26.05/7z2605-x64.msi' -OutFile $sevenZip
          $process = Start-Process msiexec.exe -ArgumentList @('/i', "`"$sevenZip`"", '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "7-Zip installer failed: $($process.ExitCode)" }
          $installer = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_BuildTools.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList @('--quiet', '--wait', '--norestart', '--add', 'Microsoft.VisualStudio.Workload.VCTools', '--includeRecommended') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Visual Studio installer failed or requires restart: $($process.ExitCode)" }
      - uses: actions/checkout@v7
        with:
          # Exercise activation and builds from a checkout path containing spaces.
          path: llgo dev
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          install_args: --locked
          working_directory: llgo dev/dev
          env: true
          export_path: true
      - name: Build LLGo and check native dependencies
        if: runner.os != 'Windows'
        run: bash dev/check_devenv.sh
      - name: Build LLGo and check native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\dev\check_devenv.ps1
