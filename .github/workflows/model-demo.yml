name: Model Demo

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  ci-gate:
    name: CI gate (Model demo)
    needs: prepare
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify CI preparation succeeded
        run: test "${{ needs.prepare.result }}" = "success"

  llama2:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_large_runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install llgo
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Download llama2 model
        run: |
          mkdir -p ./_demo/c/llama2-c
          curl --fail --location --retry 5 --retry-delay 60 --retry-all-errors \
            --output ./_demo/c/llama2-c/stories15M.bin \
            https://huggingface.co/karpathy/tinyllamas/resolve/main/stories15M.bin

      - name: Test llama2 demo
        run: |
          cd ./_demo/c/llama2-c
          llgo run .
