name: Publish baseline benchmarks

on:
  workflow_run:
    workflows: [Baseline benchmarks]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  artifacts:
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      baseline: ${{ steps.artifacts.outputs.baseline }}
      wasm: ${{ steps.artifacts.outputs.wasm }}
    steps:
      # A docs-only run succeeds with skipped benchmark jobs and no artifacts.
      # Inspect the triggering run without checking out or executing PR code.
      - uses: actions/github-script@v9
        id: artifacts
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: context.payload.workflow_run.id, per_page: 100 }
            );
            for (const [suite, prefix] of Object.entries({
              baseline: 'go-benchmark-llgo-baseline-',
              wasm: 'go-benchmark-llgo-wasm-',
            })) {
              const present = artifacts.some(a => !a.expired && a.name.startsWith(prefix));
              core.setOutput(suite, String(present));
              core.info(`${suite}: ${present ? 'publish artifacts' : 'skip; no artifacts'}`);
            }

  publish:
    needs: artifacts
    if: needs.artifacts.outputs.baseline == 'true'
    uses: xgo-dev/setup-benchmark-go-action/.github/workflows/publish.yml@v1.0.6
    with:
      run_id: ${{ github.event.workflow_run.id }}
      artifact_pattern: go-benchmark-llgo-baseline-*
      config_path: .github/llgo-benchmark.yml

  publish-wasm:
    needs: artifacts
    if: needs.artifacts.outputs.wasm == 'true'
    uses: xgo-dev/setup-benchmark-go-action/.github/workflows/publish.yml@v1.0.6
    with:
      run_id: ${{ github.event.workflow_run.id }}
      artifact_pattern: go-benchmark-llgo-wasm-*
      config_path: .github/llgo-wasm-benchmark.yml
