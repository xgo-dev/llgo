name: Doc Link Checker

on:
  push:
    branches: ["**"]
    paths:
      - "**/*.md"
      - ".github/workflows/doc-link-checker.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "**/*.md"
      - ".github/workflows/doc-link-checker.yml"
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  doc_verify:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request' && github.repository == 'xgo-dev/llgo' ||
      github.event_name == 'push' &&
      (github.event.repository.fork && github.ref_name != github.event.repository.default_branch ||
      github.repository == 'xgo-dev/llgo' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install embedme
        run: npm install -g embedme

      - name: Verify README.md embedded code
        run: embedme --verify README.md

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --max-concurrency 3 --retry-wait-time 15 "./**/*.md"
