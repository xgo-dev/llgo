name: Doc Link Checker

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"

concurrency:
  group: doc-link-checker.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  ci-gate:
    name: CI gate (Doc links)
    needs: prepare
    if: always() && !cancelled()
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_runner || '["ubuntu-24.04"]') }}
    steps:
      - name: Verify CI preparation succeeded
        run: test "${{ needs.prepare.result }}" = "success"

  doc_verify:
    if: needs.prepare.outputs.run_doc_checks == 'true'
    needs: prepare
    # This small external-link check needs a reliable public-network route.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install embedme
        run: npm install -g embedme

      - name: Verify README.md embedded code
        run: embedme --verify README.md

      - name: Link Checker
        id: lychee
        # A bounded second attempt handles transient upstream HTTP failures.
        # The retry below remains fatal, including for persistently broken links.
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          # pkg.go.dev may generate package documentation on demand. Space
          # requests to the same host while retaining strict status checks.
          args: --max-concurrency 3 --host-concurrency 1 --host-request-interval 1s --retry-wait-time 15 README.md

      - name: Wait before retrying failed links
        if: steps.lychee.outcome == 'failure'
        run: sleep 30

      - name: Retry Link Checker
        if: steps.lychee.outcome == 'failure'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --max-concurrency 3 --host-concurrency 1 --host-request-interval 1s --retry-wait-time 15 README.md
