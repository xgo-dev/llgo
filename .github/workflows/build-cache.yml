# Build cache tests for llgo
# Tests various build configurations to ensure cache works correctly

name: Build Cache

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  ci-gate:
    name: CI gate (Build cache)
    needs: prepare
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify CI preparation succeeded
        run: test "${{ needs.prepare.result }}" = "success"

  build-cache:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: build-cache (${{ matrix.os }}${{ matrix.windows_abi && format(', {0}', matrix.windows_abi) || '' }}, ${{ matrix.llvm }})
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: macos-latest
            llvm: 22
          - os: ubuntu-latest
            llvm: 22
          - os: windows-2022
            llvm: 22
            windows_abi: msvc
          - os: windows-2022
            llvm: 22
            windows_abi: mingw
    runs-on: ${{ startsWith(matrix.os, 'ubuntu') && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Binaryen
        uses: ./.github/actions/setup-binaryen

      - name: Restore LLGo and cache Wasmer
        uses: ./.github/actions/setup-llgo-cache
        with:
          # This workflow deliberately clears package objects to test cache
          # behavior, so restoring that large directory would be pure waste.
          build-cache-mode: off
          wasmer-cache-mode: readwrite

      - name: Install Wasmer (for wasm tests)
        shell: bash
        run: bash dev/install_wasmer.sh

      - name: Install llgo (dev mode)
        shell: bash
        run: |
          go install -tags=dev ./cmd/llgo
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Install esptool.py (for ESP32-C3 tests on Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: pip3 install --break-system-packages esptool==5.1.0

      - name: Run build cache tests
        shell: bash
        run: bash test/buildcache/test.sh
