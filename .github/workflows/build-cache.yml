# Build cache tests for llgo
# Tests various build configurations to ensure cache works correctly

name: Build Cache

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-cache:
    name: build-cache (${{ matrix.os }}${{ matrix.windows_abi && format(', {0}', matrix.windows_abi) || '' }}, ${{ matrix.llvm }})
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: macos-latest
            llvm: 21
          - os: ubuntu-latest
            llvm: 21
          - os: windows-2022
            llvm: 21
            windows_abi: msvc
          - os: windows-2022
            llvm: 21
            windows_abi: mingw
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install WAMR (for wasm tests)
        shell: bash
        run: bash dev/build_iwasm.sh

      - name: Install llgo (dev mode)
        shell: bash
        run: |
          go install -tags=dev ./cmd/llgo
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Install esptool.py (for ESP32-C3 tests on Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: pip3 install --break-system-packages esptool==5.1.0

      - name: Run build cache tests
        shell: bash
        run: bash test/buildcache/test.sh
