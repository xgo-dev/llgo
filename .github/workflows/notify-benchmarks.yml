name: Notify benchmarks

on:
  workflow_dispatch:
  # Every main revision receives full post-merge CI, including external benchmarks.
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/scripts/ci_changes.py
      - .github/scripts/classify_benchmark_changes.py
      - .github/scripts/test_classify_benchmark_changes.py
      - .github/workflows/notify-benchmarks.yml
  # Compatibility is intentionally release-based: publishing a stable release
  # or prerelease records one durable open-source test result for that tag.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: notify-benchmarks.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  classifier-tests:
    needs: prepare
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_runner) }}
    steps:
      - uses: actions/checkout@v7
      - name: Test benchmark change classifier
        run: python3 .github/scripts/test_classify_benchmark_changes.py

  dispatch:
    needs: prepare
    if: github.repository == 'xgo-dev/llgo' && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_runner) }}
    env:
      # Override this repository variable only when testing another receiver.
      BENCHMARKS_REPOSITORY: ${{ vars.BENCHMARKS_REPOSITORY || 'llgo-test/benchmarks' }}
      BENCHMARKS_DISPATCH_TOKEN: ${{ secrets.BENCHMARKS_DISPATCH_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Request benchmarks for this LLGo revision
        run: |
          set -euo pipefail
          if [[ -z "$BENCHMARKS_DISPATCH_TOKEN" ]]; then
            echo "BENCHMARKS_DISPATCH_TOKEN is not configured" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            if [[ -z "$RELEASE_TAG" ]] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
              echo "invalid release tag: ${RELEASE_TAG:-missing}" >&2
              exit 1
            fi
            tag_ref="refs/tags/$RELEASE_TAG"
            tag_rows="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
              "$tag_ref" "$tag_ref^{}")"
            llgo_commit="$(awk -v ref="$tag_ref^{}" '$2 == ref { print $1; exit }' <<<"$tag_rows")"
            if [[ -z "$llgo_commit" ]]; then
              llgo_commit="$(awk -v ref="$tag_ref" '$2 == ref { print $1; exit }' <<<"$tag_rows")"
            fi
            event_type=llgo-tag-released
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual runs are an end-to-end transport check, not a request to
            # benchmark the selected workflow ref. Always resolve authoritative
            # main so the llgo-main-updated event cannot carry a branch commit.
            llgo_commit="$(git ls-remote \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              refs/heads/main | awk 'NR == 1 { print $1 }')"
            event_type=llgo-main-updated
          else
            llgo_commit="$GITHUB_SHA"
            event_type=llgo-main-updated
          fi
          if [[ ! "$llgo_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid LLGo commit for ${RELEASE_TAG:-$GITHUB_REF}: ${llgo_commit:-missing}" >&2
            exit 1
          fi

          payload="$(jq -cn \
            --arg event_type "$event_type" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg llgo_repository "$GITHUB_REPOSITORY" \
            --arg llgo_commit "$llgo_commit" \
            --arg llgo_tag "$RELEASE_TAG" \
            --arg source_run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{event_type: $event_type, client_payload: {source_repository: $source_repository, llgo_repository: $llgo_repository, llgo_commit: $llgo_commit, llgo_tag: $llgo_tag, source_run_url: $source_run_url}}')"

          curl --fail-with-body --location --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${BENCHMARKS_DISPATCH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${BENCHMARKS_REPOSITORY}/dispatches" \
            --data "$payload"
