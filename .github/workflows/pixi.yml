name: Pixi development environment

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: pixi.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  ci-gate:
    name: CI gate (Pixi)
    needs: prepare
    if: always() && !cancelled()
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_runner || '["ubuntu-24.04"]') }}
    steps:
      - name: Verify CI preparation succeeded
        run: test "${{ needs.prepare.result }}" = "success"

  devenv:
    if: needs.prepare.outputs.run_code_ci == 'true'
    name: Pixi (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: llgo dev
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          # Exercise activation and builds from a checkout path containing spaces.
          path: llgo dev
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          working-directory: llgo dev/dev
          locked: true
      - name: Check the development environment
        if: runner.os != 'Windows'
        run: pixi run --manifest-path dev/pixi.toml --locked bash dev/check_devenv.sh
      - name: Check the development environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pixi run --manifest-path dev/pixi.toml --locked pwsh -File dev/check_devenv.ps1
