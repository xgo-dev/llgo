name: WinGet MinGW v1.0.9 validation
on:
  push:
    branches: [codex/winget-mingw-109-20261029]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: winget-release-validation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  validate:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [symlink]
        goarch: [amd64, arm64]
        include:
          - goarch: amd64
            runner: windows-2025
          - goarch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap stable WinGet
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue) -or ((& winget.exe --version) -ne 'v1.29.380')) {
            # Bootstrap from verified release files, avoiding the module's
            # failing latest-release discovery on the ARM64 image.
            $base = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380'
            $files = @{
              'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle' = '65dea9c01ce08ee7b763366b27c0e651f97db857c11ca9b9c301826c10092f2e'
              'DesktopAppInstaller_Dependencies.zip' = 'ba875afe9d190f61218985ac0292a99d1db710bf93e13c68944ca9d89f0d82d1'
            }
            $temporary = Join-Path $env:RUNNER_TEMP 'winget-bootstrap'
            New-Item -ItemType Directory -Force $temporary | Out-Null
            foreach ($name in $files.Keys) {
              $path = Join-Path $temporary $name
              curl.exe --fail --location --retry 5 --retry-all-errors --output $path "$base/$name"
              if ($LASTEXITCODE -ne 0) { throw "Downloading $name failed" }
              if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $files[$name]) { throw "Invalid hash for $name" }
            }
            $deps = Join-Path $temporary 'dependencies'
            Expand-Archive (Join-Path $temporary 'DesktopAppInstaller_Dependencies.zip') $deps
            $arch = @{ amd64 = 'x64'; arm64 = 'arm64' }['${{ matrix.goarch }}']
            $packages = @(Get-ChildItem (Join-Path $deps $arch) -Recurse -File | Where-Object { $_.Extension -in @('.appx', '.msix') })
            if (-not $packages.Count) { throw "Missing WinGet dependencies for $arch" }
            Add-AppxPackage -Path (Join-Path $temporary 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle') -DependencyPath $packages.FullName -ForceApplicationShutdown
          }
          $env:PATH += ';' + (Join-Path $env:LOCALAPPDATA 'Microsoft/WindowsApps')
          (Join-Path $env:LOCALAPPDATA 'Microsoft/WindowsApps') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'WinGet bootstrap failed' }
      - name: Install and test command without dependency PATH
        shell: pwsh
        run: ./.github/windows/test-winget-ab.ps1 -GoArch ${{ matrix.goarch }} -Mode ${{ matrix.mode }} -Phase install
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: "22"
          windows-abi: mingw
          windows-arch: ${{ matrix.goarch }}
      - uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: mingw
          windows-arch: ${{ matrix.goarch }}
      - name: Compile native Go C C++ and ESP from installed command
        shell: pwsh
        run: ./.github/windows/test-winget-ab.ps1 -GoArch ${{ matrix.goarch }} -Mode ${{ matrix.mode }} -Phase build
      - name: Uninstall and verify command removal
        if: always()
        shell: pwsh
        run: ./.github/windows/test-winget-ab.ps1 -GoArch ${{ matrix.goarch }} -Mode ${{ matrix.mode }} -Phase uninstall
      - name: Collect WinGet diagnostic logs
        if: always()
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'winget-ab/logs'
          New-Item -ItemType Directory -Force $destination | Out-Null
          foreach ($relative in @('Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/DiagOutputDir', 'Microsoft/WinGet/DiagOutputDir')) {
            $source = Join-Path $env:LOCALAPPDATA $relative
            if (Test-Path $source) { Copy-Item "$source/*" $destination -Recurse -Force }
          }
      - name: Preserve WinGet diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: winget-logs-${{ matrix.goarch }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/winget-ab/
          if-no-files-found: ignore
