name: Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: doc.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  ci-gate:
    name: CI gate (Docs)
    needs: prepare
    if: always() && !cancelled()
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_runner || '["ubuntu-24.04"]') }}
    steps:
      - name: Verify CI preparation succeeded
        run: test "${{ needs.prepare.result }}" = "success"

  remote_install:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ startsWith(matrix.os, 'ubuntu') && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Test release installer helpers
        run: bash test/installer/install_sh_test.sh

      - name: Test fresh login and non-login shells on macOS
        if: startsWith(matrix.os, 'macos')
        run: bash test/installer/install_shell_test.sh bash zsh sh

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install dependencies on macOS
        if: startsWith(matrix.os, 'macos')
        run: bash doc/_readme/scripts/deps_macos.sh

      - name: Install dependencies on Ubuntu
        if: startsWith(matrix.os, 'ubuntu')
        run: bash doc/_readme/scripts/deps_ubuntu.sh

      - name: Test documented dependencies on other Linux distributions
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          for distro in fedora arch opensuse; do
            case "$distro" in
              fedora) image=fedora:44 ;;
              arch) image=archlinux:latest ;;
              opensuse) image=opensuse/tumbleweed:latest ;;
            esac
            docker run --platform linux/amd64 --rm --init -v "$GITHUB_WORKSPACE:/src:ro" "$image" bash -ec '
              sudo() { "$@"; }
              source "/src/doc/_readme/scripts/deps_$1.sh"
              pkg-config --exists bdw-gc libffi openssl zlib libcjson sqlite3 libuv
            ' _ "$distro"
          done

      - name: Test README quick install
        env:
          LLGO_INSTALL_ROOT: ${{ runner.temp }}/llgo-readme
          LLGO_UPDATE_PATH: "0"
        run: |
          set -euo pipefail
          # Use the PR's installer for the documented download URL.
          curl() {
            if [[ "${!#}" == https://raw.githubusercontent.com/xgo-dev/llgo/main/install.sh ]]; then
              cat "$GITHUB_WORKSPACE/install.sh"
            else
              command curl "$@"
            fi
          }
          export -f curl
          bash doc/_readme/scripts/quick_install.sh

      - name: Verify README installation
        run: |
          test "$(cd "$(llgo env LLGO_ROOT)" && pwd -P)" = \
            "$(cd "$RUNNER_TEMP/llgo-readme/current" && pwd -P)"
          bash doc/_readme/scripts/verify_install.sh
          llgo run ./doc/_readme/llgo_simple

  local_install:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: local installs (${{ matrix.os }}${{ matrix.windows_abi && format(', {0}', matrix.windows_abi) || '' }})
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [macos, ubuntu, windows-msvc, windows-mingw]
        include:
          - platform: macos
            os: macos-latest
          - platform: ubuntu
            os: ubuntu-latest
          - platform: windows-msvc
            os: windows-2022
            windows_abi: msvc
          - platform: windows-mingw
            os: windows-2022
            windows_abi: mingw
    runs-on: ${{ startsWith(matrix.os, 'ubuntu') && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Test local installer with LF and CRLF checkouts
        shell: bash
        run: bash test/installer/install_local_test.sh

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install dependencies on macOS
        if: startsWith(matrix.os, 'macos')
        run: |
          set -e
          set -x
          source doc/_readme/scripts/install_macos.sh

      - name: Install dependencies on Ubuntu
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -e
          set -x
          source doc/_readme/scripts/install_ubuntu.sh

      - name: Set up Python 3.12 on Windows
        if: startsWith(matrix.os, 'windows')
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test PowerShell installer helpers
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: ./test/installer/install_ps1_test.ps1

      - name: Install dependencies on Windows
        if: startsWith(matrix.os, 'windows')
        uses: ./.github/actions/setup-deps
        with:
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}

      - name: Test README PowerShell quick install
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        env:
          LLGO_INSTALL_ROOT: ${{ runner.temp }}/llgo-readme
          LLGO_INSTALL_DEPS: "0"
          LLGO_UPDATE_PATH: "0"
          LLGO_ABI: ${{ matrix.windows_abi }}
        run: |
          # Use the PR's installer for the documented download URL.
          function Invoke-RestMethod {
            param([string]$Uri)
            if ($Uri -ne 'https://raw.githubusercontent.com/xgo-dev/llgo/main/install.ps1') {
              throw "Unexpected installer URL: $Uri"
            }
            Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'install.ps1')
          }
          . ./doc/_readme/scripts/quick_install.ps1
          bash doc/_readme/scripts/verify_install.sh
          if ($LASTEXITCODE -ne 0) { throw 'Installation verification failed' }
          llgo run ./doc/_readme/llgo_simple
          if ($LASTEXITCODE -ne 0) { throw 'Compiled program failed' }

      - name: Test default and full local installs
        shell: bash
        run: |
          # Keep nounset disabled: this wrapper sources the contributor examples and
          # generated virtualenv scripts, which manage optional variables.
          set -eo pipefail
          set -x

          base_path="$PATH"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_lib=$(python -c 'import os, sys; print(os.path.join(sys.base_prefix, "libs", f"python{sys.version_info.major}{sys.version_info.minor}"))')
            export LLGO_LIB_PYTHON="$python_lib"
            export LLGO_STDIO_NOBUF=1
          fi

          # Both documented installation modes run after one platform dependency
          # setup, but use separate binary directories. Reset PATH between
          # them so the full install cannot pass using the default install.
          git() {
            if [ "$1" = "clone" ]; then
              # do nothing because we already have the branch
              cd ..
            else
              command git "$@"
            fi
          }

          for install_mode in default full; do
            cd "$GITHUB_WORKSPACE"
            install_bin="$RUNNER_TEMP/llgo-$install_mode-bin"
            path_bin="$install_bin"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              install_bin=$(cygpath -m "$install_bin")
              path_bin=$(cygpath -u "$install_bin")
            fi
            mkdir -p "$path_bin"
            export GOBIN="$install_bin"
            export PATH="$path_bin:$base_path"
            if [[ "$install_mode" == "full" && "$RUNNER_OS" == "Linux" ]]; then
              export PATH="/usr/lib/llvm-22/bin:$PATH"
            fi

            if [[ "$install_mode" == "full" ]]; then
              source doc/_readme/scripts/install_full.sh
            else
              source doc/_readme/scripts/install_llgo.sh
            fi
            export LLGO_ROOT="$GITHUB_WORKSPACE"
            cd "$GITHUB_WORKSPACE"
            source doc/_readme/scripts/run.sh
          done
