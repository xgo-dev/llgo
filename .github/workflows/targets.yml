name: Targets

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  ci-gate:
    name: CI gate (Targets)
    needs: prepare
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify CI preparation succeeded
        run: test "${{ needs.prepare.result }}" = "success"

  llgo:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: llgo (${{ matrix.test_dir }}, ${{ matrix.os }}, LLVM ${{ matrix.llvm }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test_dir: [empty, defer]
        os:
          - ubuntu-latest
        llvm: [22]
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_large_runner) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Set up Go for build
        uses: ./.github/actions/setup-go

      - name: Install
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Build targets (${{ matrix.test_dir }})
        working-directory: _demo/embed/targetsbuild
        run: bash build.sh "${{ matrix.test_dir }}"

  embedded-debug:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: embedded debug (${{ matrix.os }}, ${{ matrix.backend }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        backend: [gdb, lldb]
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os }}
    env:
      GOMAXPROCS: '4'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: '22'
      - uses: ./.github/actions/setup-go
      - name: Build compiler
        shell: bash
        run: go install ./cmd/llgo

      # Install after building: this action's MSYS2 shell belongs to debugger
      # tools, not the pinned compiler environment installed by setup-deps.
      - uses: ./.github/actions/setup-gdb
      - name: Install Linux emulator and LLDB
        if: runner.os == 'Linux'
        run: sudo apt-get install -y qemu-system-arm lldb-22
      - name: Install macOS emulator
        if: runner.os == 'macOS'
        run: brew install qemu
      - name: Install Windows emulator in the isolated debugger environment
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          LLGO_PACMAN_RETRY_DELAY_SECONDS: "30"
        run: |
          set -euo pipefail
          source .github/actions/setup-deps/pacman_retry.sh
          pacman_with_retry --noconfirm -S --needed mingw-w64-clang-x86_64-qemu
          echo "QEMU_SYSTEM_ARM=$(cygpath -m /clang64/bin/qemu-system-arm.exe)" >> "$GITHUB_ENV"
      - name: Install matching Windows LLDB Python runtime
        if: runner.os == 'Windows' && matrix.backend == 'lldb'
        id: lldb-python
        uses: actions/setup-python@v7
        with:
          # The LLVM 22.1.8 Windows LLDB installer links python311.dll.
          python-version: '3.11.9'
          architecture: x64
          update-environment: false
      - name: Configure matching Windows LLDB Python runtime
        if: runner.os == 'Windows' && matrix.backend == 'lldb'
        shell: pwsh
        env:
          LLDB_PYTHON: ${{ steps.lldb-python.outputs.python-path }}
        run: |
          $prefix = (& $env:LLDB_PYTHON -c "import sys; print(sys.base_prefix)").Trim()
          if (-not (Test-Path (Join-Path $prefix 'python311.dll'))) {
            throw "The LLVM 22 LLDB Python runtime is incomplete: $prefix"
          }
          "LLGO_WINDOWS_LLDB_PYTHON_HOME=$prefix" >> $env:GITHUB_ENV
      - name: Test preloaded and explicit-download Cortex-M sessions
        shell: bash
        run: python3 test/debug/embedded/runtest.py --backend "${{ matrix.backend }}"
      - name: Test physical-probe opt-in guard
        shell: bash
        run: |
          set +e
          output="$(bash test/debug/hardware/runtest.sh 2>&1)"
          result=$?
          set -e
          test "${result}" -eq 2
          grep -F 'LLGO_HARDWARE_CONFIRM=flash' <<<"${output}"
