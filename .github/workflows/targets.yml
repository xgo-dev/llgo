name: Targets

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: targets.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  ci-gate:
    name: CI gate (Targets)
    needs: prepare
    if: always() && !cancelled()
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_runner || '["ubuntu-24.04"]') }}
    steps:
      - name: Verify CI preparation succeeded
        run: test "${{ needs.prepare.result }}" = "success"

  llgo:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: llgo (empty + defer, ${{ matrix.os }}, LLVM ${{ matrix.llvm }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        llvm: [22]
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_large_runner) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Set up Go for build
        uses: ./.github/actions/setup-go

      - uses: ./.github/actions/setup-llgo-cache
        with:
          build-cache-mode: readwrite
          build-cache-scope: embedded-boards
          crosscompile-cache-mode: readwrite

      - name: Build compiler once for all boards
        id: compiler
        run: |
          go build -tags=dev -o "$RUNNER_TEMP/llgo-targets" ./cmd/llgo
          {
            echo "LLGO_TEST_COMPILER=$RUNNER_TEMP/llgo-targets"
            echo "LLGO_ROOT=$GITHUB_WORKSPACE"
            echo "LLGO_BUILD_CACHE=1"
          } >> "$GITHUB_ENV"

      - name: Build targets (empty)
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        working-directory: _demo/embed/targetsbuild
        run: bash build.sh empty

      - name: Build targets (defer)
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        working-directory: _demo/embed/targetsbuild
        run: bash build.sh defer

  embedded-debug:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: embedded debug (${{ matrix.os }}, gdb + lldb)
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os == 'windows-2022' && fromJSON(needs.prepare.outputs.windows_2022_runner) || matrix.os }}
    env:
      GOMAXPROCS: '4'
      GOFLAGS: '-p=2'
    steps:
      - name: Install Windows build tools on Qiniu
        if: github.repository_owner == 'xgo-dev' && matrix.os == 'windows-2022'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = Join-Path $env:RUNNER_TEMP '7zip.msi'
          Invoke-WebRequest -Uri 'https://github.com/ip7z/7zip/releases/download/26.05/7z2605-x64.msi' -OutFile $sevenZip
          $process = Start-Process msiexec.exe -ArgumentList @('/i', "`"$sevenZip`"", '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "7-Zip installer failed: $($process.ExitCode)" }
          $installer = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_BuildTools.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList @('--quiet', '--wait', '--norestart', '--add', 'Microsoft.VisualStudio.Workload.VCTools', '--includeRecommended') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Visual Studio installer failed or requires restart: $($process.ExitCode)" }
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: '22'
      - uses: ./.github/actions/setup-go
      - name: Build compiler
        id: compiler
        shell: bash
        run: go install ./cmd/llgo

      # Install after building: this action's MSYS2 shell belongs to debugger
      # tools, not the pinned compiler environment installed by setup-deps.
      - uses: ./.github/actions/setup-gdb
      - name: Install Linux emulator and LLDB
        if: runner.os == 'Linux'
        run: sudo apt-get install -y qemu-system-arm lldb-22
      - name: Install macOS emulator
        if: runner.os == 'macOS'
        run: brew install qemu
      - name: Install Windows emulator in the isolated debugger environment
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          LLGO_PACMAN_RETRY_DELAY_SECONDS: "30"
        run: |
          set -euo pipefail
          source .github/actions/setup-deps/pacman_retry.sh
          pacman_with_retry --noconfirm -S --needed mingw-w64-clang-x86_64-qemu
          echo "QEMU_SYSTEM_ARM=$(cygpath -m /clang64/bin/qemu-system-arm.exe)" >> "$GITHUB_ENV"
      - name: Install matching Windows LLDB Python runtime
        if: runner.os == 'Windows'
        id: lldb-python
        uses: actions/setup-python@v7
        with:
          # The LLVM 22.1.8 Windows LLDB installer links python311.dll.
          python-version: '3.11.9'
          architecture: x64
          update-environment: false
      - name: Configure matching Windows LLDB Python runtime
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LLDB_PYTHON: ${{ steps.lldb-python.outputs.python-path }}
        run: |
          $prefix = (& $env:LLDB_PYTHON -c "import sys; print(sys.base_prefix)").Trim()
          if (-not (Test-Path (Join-Path $prefix 'python311.dll'))) {
            throw "The LLVM 22 LLDB Python runtime is incomplete: $prefix"
          }
          "LLGO_WINDOWS_LLDB_PYTHON_HOME=$prefix" >> $env:GITHUB_ENV
      # Separate steps keep both backends observable and run LLDB even when
      # the GDB acceptance test fails, as the former fail-fast:false matrix did.
      - name: Test GDB preloaded and explicit-download Cortex-M sessions
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: python3 test/debug/embedded/runtest.py --backend gdb
      - name: Test LLDB preloaded and explicit-download Cortex-M sessions
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: python3 test/debug/embedded/runtest.py --backend lldb
      - name: Test physical-probe opt-in guard
        shell: bash
        run: |
          set +e
          output="$(bash test/debug/hardware/runtest.sh 2>&1)"
          result=$?
          set -e
          test "${result}" -eq 2
          grep -F 'LLGO_HARDWARE_CONFIRM=flash' <<<"${output}"
