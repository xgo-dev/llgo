name: Release Build

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: release-build.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  # goreleaser-cross tags follow the bundled Go release. Keep release builds
  # on the same Go 1.27 line as .go-version.
  GORELEASER_CROSS_IMAGE: ghcr.io/goreleaser/goreleaser-cross:v1.27.0-1

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  ci-gate:
    name: CI gate (Release build)
    needs: prepare
    if: always() && !cancelled()
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_runner || '["ubuntu-24.04"]') }}
    steps:
      - name: Verify CI preparation succeeded
        run: test "${{ needs.prepare.result }}" = "success"

  populate-linux-sysroot:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_large_runner) }}
    timeout-minutes: 30
    steps:
      - name: Verify Docker and privileged containers
        run: |
          docker info --format 'Docker server={{.ServerVersion}} driver={{.Driver}} arch={{.Architecture}}'
          docker run --rm --privileged busybox:1.37.0 sh -eu -c '
            mkdir /privileged-probe
            mount -t tmpfs -o size=1m tmpfs /privileged-probe
            umount /privileged-probe
            echo PRIVILEGED_CONTAINER_OK
          '
      - name: Check out code
        uses: actions/checkout@v7
      - name: Calculate cache keys
        id: cache-keys
        run: |
          LINUX_KEY="linux-sysroot-${{ hashFiles('.github/workflows/populate_linux_sysroot.sh', '.github/workflows/release-build.yml') }}-v1.0.0"
          echo "linux-key=$LINUX_KEY" >> "$GITHUB_OUTPUT"
      - name: Check Linux sysroot cache
        id: cache-linux-sysroot
        uses: actions/cache/restore@v6
        with:
          path: .sysroot/linux.tar.gz
          key: ${{ steps.cache-keys.outputs.linux-key }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        if: steps.cache-linux-sysroot.outputs.cache-hit != 'true'
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68
      - name: Populate Linux sysroot
        if: steps.cache-linux-sysroot.outputs.cache-hit != 'true'
        run: bash .github/workflows/populate_linux_sysroot.sh
      - name: Create Linux sysroot tarball
        if: steps.cache-linux-sysroot.outputs.cache-hit != 'true'
        run: tar -czvf .sysroot/linux.tar.gz -C .sysroot linux
      # Keep the producer lookup-only so a hit does not download this large
      # archive merely to discard it. A miss therefore needs an explicit save.
      - name: Save Linux sysroot cache
        if: steps.cache-linux-sysroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .sysroot/linux.tar.gz
          key: ${{ steps.cache-keys.outputs.linux-key }}
      # The cache is only a cross-run optimization: repository cache pressure
      # may evict it while a downstream job is queued. Use an artifact as the
      # required, run-scoped handoff so release correctness never depends on it.
      - name: Upload Linux sysroot artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-sysroot
          path: .sysroot/linux.tar.gz
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 3
  build:
    if: needs.prepare.outputs.run_code_ci == 'true'
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_large_runner) }}
    needs: [prepare, populate-linux-sysroot]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Download Linux sysroot artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-sysroot
          path: .sysroot
      - name: Set up Release
        uses: ./.github/actions/setup-goreleaser
      - name: Run GoReleaser (Build & Test)
        env:
          GITHUB_TOKEN: ${{github.token}}
        run: |
          # The docker skip also disables dockers_v2 snapshot image builds.
          docker run --rm --entrypoint go "${GORELEASER_CROSS_IMAGE}" version
          docker run --rm "${GORELEASER_CROSS_IMAGE}" --version
          docker run \
            --rm \
            -e "GITHUB_TOKEN=${GITHUB_TOKEN}" \
            -e GOMAXPROCS=2 \
            -e GOFLAGS=-p=2 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/go/src/llgo" \
            -w /go/src/llgo \
            "${GORELEASER_CROSS_IMAGE}" \
            release --parallelism=1 --verbose --skip=publish,snapcraft,docker --snapshot --clean

      - name: Upload Darwin AMD64 Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: llgo-darwin-amd64
          path: .dist/*darwin-amd64.tar.gz
          retention-days: 3
          include-hidden-files: true

      - name: Upload Darwin ARM64 Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: llgo-darwin-arm64
          path: .dist/*darwin-arm64.tar.gz
          retention-days: 3
          include-hidden-files: true

      - name: Upload Linux AMD64 Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: llgo-linux-amd64
          path: .dist/*linux-amd64.tar.gz
          retention-days: 3
          include-hidden-files: true

      - name: Upload Linux ARM64 Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: llgo-linux-arm64
          path: .dist/*linux-arm64.tar.gz
          retention-days: 3
          include-hidden-files: true

      - name: Upload Linux AMD64 packages
        uses: actions/upload-artifact@v7
        with:
          name: llgo-linux-amd64-packages
          path: |
            .dist/*.linux-amd64.deb
            .dist/*.linux-amd64.rpm
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
          compression-level: 0

      - name: Upload Linux ARM64 packages
        uses: actions/upload-artifact@v7
        with:
          name: llgo-linux-arm64-packages
          path: |
            .dist/*.linux-arm64.deb
            .dist/*.linux-arm64.rpm
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
          compression-level: 0

      - name: Upload Checksums
        uses: actions/upload-artifact@v7
        with:
          name: llgo-checksums
          path: .dist/*checksums.txt
          retention-days: 3
          include-hidden-files: true

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: llgo-release-metadata
          path: .dist/metadata.json
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true

  build-windows-compiler:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: [prepare, build]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
        include:
          - goarch: amd64
            os: windows-2022
          - goarch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps: &windows-compiler-steps
      - uses: actions/checkout@v7
      - name: Install build dependencies
        uses: ./.github/actions/setup-deps
        with:
          windows-abi: msvc
          windows-arch: ${{ matrix.goarch }}
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          # On windows-11-arm, both MinGW and MSVC build natively.
          architecture: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}
      - name: Cache ARM64 MSVC release SDK archive
        if: matrix.goarch == 'arm64'
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/llgo-release-downloads/llvm-arm64
          key: llgo-release-llvm-archive-v1-de718c58ebbc5f61d58c17b90457fcf42983bc2c4a4aba3e010d108713bfd7f1
      - name: Cache Windows x86 LLVM SDK archive
        if: matrix.goarch == '386'
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/llgo-release-downloads/llvm-x86
          key: llgo-release-llvm-x86-v1-${{ hashFiles('.github/windows/espressif-toolchain.json') }}
      - name: Download release metadata
        uses: actions/download-artifact@v8
        with:
          name: llgo-release-metadata
          path: .windows-dist
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test Windows packaging checks
        shell: pwsh
        run: |
          python .github/windows/test_release_zip.py
          if ($LASTEXITCODE -ne 0) { throw 'ZIP regression tests failed' }
          python .github/windows/test_prepare_winget.py
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest tests failed' }
          ./.github/windows/release-lib_test.ps1
          ./.github/windows/release-build_test.ps1
      - name: Build the shared host compiler
        shell: pwsh
        run: >-
          ./.github/windows/build-compiler.ps1
          -GoArch '${{ matrix.goarch }}'
          -OutputDirectory '${{ runner.temp }}/llgo-windows-compiler'
      - name: Upload shared host compiler
        uses: actions/upload-artifact@v7
        with:
          name: windows-host-compiler-${{ matrix.goarch }}
          path: ${{ runner.temp }}/llgo-windows-compiler
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 3

  # Keep x86 host qualification separate while sharing compiler/packaging steps.
  build-windows-compiler-x86:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: [prepare, build]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        goarch: ['386']
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps: *windows-compiler-steps

  build-windows:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: [prepare, build, build-windows-compiler]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [msvc, mingw]
        goarch: [amd64, arm64]
        include:
          - goarch: amd64
            os: windows-2022
          - goarch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps: &windows-package-steps
      - uses: actions/checkout@v7
      - name: Cache ESP release archive
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/llgo-release-downloads/esp
          key: llgo-release-esp-archive-v3-${{ matrix.goarch }}-${{ hashFiles('.github/windows/espressif-toolchain.json') }}
          enableCrossOsArchive: true
      - name: Download release metadata
        uses: actions/download-artifact@v8
        with:
          name: llgo-release-metadata
          path: .windows-dist
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download shared host compiler
        uses: actions/download-artifact@v8
        with:
          name: windows-host-compiler-${{ matrix.goarch }}
          path: ${{ runner.temp }}/llgo-windows-compiler
      - name: Build integrated Windows archive
        shell: pwsh
        run: >-
          ./.github/windows/build-release.ps1
          -Profile '${{ matrix.abi }}' -GoArch '${{ matrix.goarch }}'
          -HostCompilerDirectory '${{ runner.temp }}/llgo-windows-compiler'
      - name: Upload Windows archive
        uses: actions/upload-artifact@v7
        with:
          name: llgo-windows-${{ matrix.goarch }}-${{ matrix.abi }}
          path: |
            .windows-dist/*.windows-${{ matrix.goarch }}-${{ matrix.abi }}.zip
            .windows-dist/*.windows-${{ matrix.goarch }}-${{ matrix.abi }}.zip.sha256
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
          compression-level: 0

  build-windows-x86:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: [prepare, build, build-windows-compiler-x86]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [msvc, mingw]
        goarch: ['386']
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps: *windows-package-steps

  test-windows-artifacts:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: [prepare, build-windows]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [msvc, mingw]
        goarch: [amd64, arm64]
        include:
          - goarch: amd64
            os: windows-2022
          - goarch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps: &windows-test-steps
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Download Windows archive
        uses: actions/download-artifact@v8
        with:
          name: llgo-windows-${{ matrix.goarch }}-${{ matrix.abi }}
          path: .windows-dist
      - name: Test release installer with the built archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem ".windows-dist/llgo*.windows-${{ matrix.goarch }}-${{ matrix.abi }}.zip" |
            Select-Object -First 1
          if (-not $archive -or $archive.Name -notmatch '^llgo(.+)\.windows-[^.]+-[^.]+\.zip$') {
            throw 'Could not determine the LLGo version from the Windows archive'
          }
          $env:LLGO_VERSION = $Matches[1]
          $env:LLGO_ARCH = '${{ matrix.goarch }}'
          $env:LLGO_ABI = '${{ matrix.abi }}'
          $env:LLGO_ARCHIVE_PATH = $archive.FullName
          $env:LLGO_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP 'llgo-release-install'
          $env:LLGO_INSTALL_DEPS = '0'
          $env:LLGO_UPDATE_PATH = '0'
          if ('${{ matrix.abi }}' -eq 'mingw') {
            $msystem = if ('${{ matrix.goarch }}' -eq 'arm64') { 'CLANGARM64' } else { 'CLANG64' }
            & bash.exe -c "MSYSTEM=$msystem ./install.sh"
            if ($LASTEXITCODE -ne 0) { throw 'The MSYS2 installer failed' }
          } else {
            ./install.ps1
          }
          $current = Get-Item -Force -LiteralPath (Join-Path $env:LLGO_INSTALL_ROOT 'current')
          $bin = Get-Item -Force -LiteralPath (Join-Path $env:LLGO_INSTALL_ROOT 'bin')
          if (-not ($current.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
              -not ($bin.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw 'The installer did not create the current and bin junctions'
          }
      # Execute the unpacked compiler before installing any LLVM or native
      # dependencies: this catches missing DLLs that the build runner can mask.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify standalone compiler and archive
        shell: pwsh
        run: >-
          ./.github/windows/test-release.ps1 -CheckOnly
          -Profile '${{ matrix.abi }}' -GoArch '${{ matrix.goarch }}'
      - name: Install native target dependencies
        uses: ./.github/actions/setup-deps
        with:
          windows-abi: ${{ matrix.abi }}
          windows-arch: ${{ matrix.goarch }}
      - name: Activate native Windows target
        uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: ${{ matrix.abi }}
          windows-arch: ${{ matrix.goarch }}
      - name: Test installed command in fresh MSYS2 shells
        if: matrix.abi == 'mingw'
        shell: msys2 {0}
        run: >-
          bash test/installer/install_msys_path_test.sh
          .windows-dist/*.windows-${{ matrix.goarch }}-mingw.zip
          "$RUNNER_TEMP/llgo-release-install"
      - name: Test extracted native and embedded compiler
        shell: pwsh
        run: >-
          ./.github/windows/test-release.ps1
          -Profile '${{ matrix.abi }}' -GoArch '${{ matrix.goarch }}'

  test-windows-artifacts-x86:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: [prepare, build-windows-x86]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [msvc, mingw]
        goarch: ['386']
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps: *windows-test-steps

  prepare-winget:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: [prepare, test-windows-artifacts, test-windows-artifacts-x86]
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_runner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: llgo-windows-*
          merge-multiple: true
          path: .windows-dist
      - uses: actions/download-artifact@v8
        with:
          name: llgo-release-metadata
          path: .windows-dist
      - name: Prepare WinGet candidates from tested ZIPs
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open(".windows-dist/metadata.json"))["version"])')
          python .github/windows/prepare-winget.py --artifacts .windows-dist --version "$version" --output .winget
      - uses: actions/upload-artifact@v7
        with:
          name: llgo-winget-candidates
          path: .winget/manifests
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  test-artifacts:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: [prepare, build]
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            go-mod-version: "1.27"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            go-mod-version: "1.27"
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            go-mod-version: "1.27"
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            go-mod-version: "1.27"
    runs-on: ${{ matrix.os == 'ubuntu-latest' && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          install-llvm: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Download Platform Artifact
        uses: actions/download-artifact@v8
        with:
          name: llgo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: .

      - name: Install LLGo archive
        run: |
          archive=$(find . -maxdepth 1 -name 'llgo*.tar.gz' -print -quit)
          pattern='^\./llgo(.+)\.${{ matrix.goos }}-${{ matrix.goarch }}\.tar\.gz$'
          if [[ "$archive" =~ $pattern ]]; then
            version=${BASH_REMATCH[1]}
          else
            echo 'Could not determine the LLGo version from the archive' >&2
            exit 1
          fi
          export LLGO_VERSION="$version"
          export LLGO_ARCHIVE_PATH="$archive"
          export LLGO_INSTALL_ROOT="$RUNNER_TEMP/llgo-release-install"
          export LLGO_INSTALL_DEPS=0
          export LLGO_UPDATE_PATH=0
          ./install.sh
          test "$(readlink "$LLGO_INSTALL_ROOT/current")" = \
            "versions/$version/${{ matrix.goos }}-${{ matrix.goarch }}"
          echo "$LLGO_INSTALL_ROOT/bin" >> "$GITHUB_PATH"

      - name: Test Hello World
        uses: ./.github/actions/test-helloworld
        with:
          mod-version: ${{ matrix.go-mod-version }}

      - name: Install native assembly test compiler
        if: runner.os == 'Linux'
        run: |
          # install-llvm=false above leaves minimal runners without clang.
          sudo timeout --kill-after=30s 10m apt-get install -y clang
          clang --version

      - name: Test native assembly shared-library calls
        run: bash dev/test_native_asm.sh

  test-linux-distributions:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: [prepare, build]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goarch: amd64
          - os: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.goarch == 'amd64' && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: llgo-linux-${{ matrix.goarch }}-packages
          path: .dist
      - name: Test installed DEB and RPM
        run: bash .github/linux/test-packages.sh .dist '${{ matrix.goarch }}'
      - name: Build release container
        run: |
          context="$RUNNER_TEMP/llgo-container"
          mkdir -p "$context/linux/${{ matrix.goarch }}"
          cp Dockerfile "$context/"
          cp .dist/*.linux-${{ matrix.goarch }}.deb "$context/linux/${{ matrix.goarch }}/"
          docker build --tag llgo-release:test "$context"
      - name: Test release container
        run: |
          docker run --rm llgo-release:test
          docker run --rm -v "$PWD/.github/linux:/tests:ro" \
            llgo-release:test bash /tests/test-installed.sh

  release:
    permissions:
      contents: write
      packages: write
    needs: [prepare, prepare-winget, test-artifacts, test-windows-artifacts, test-windows-artifacts-x86, test-linux-distributions, populate-linux-sysroot]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.run_code_ci == 'true' && (startsWith(github.ref, 'refs/tags/'))
    outputs:
      stable: ${{ steps.release-type.outputs.stable }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check release type
        id: release-type
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download Linux sysroot artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-sysroot
          path: .sysroot
      - name: Set up Release
        uses: ./.github/actions/setup-goreleaser
      - name: Download tested Windows archives
        uses: actions/download-artifact@v8
        with:
          pattern: llgo-windows-*
          merge-multiple: true
          path: .windows-dist
      - name: Verify all six Windows ZIPs
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd .windows-dist
          archives=(llgo*.windows-*.zip)
          test "${#archives[@]}" = 6
          for arch in 386 amd64 arm64; do
            for abi in msvc mingw; do
              archive="llgo${version}.windows-${arch}-${abi}.zip"
              test -s "$archive"
              sha256sum -c "$archive.sha256"
            done
          done
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run GoReleaser (Release)
        env:
          GITHUB_TOKEN: ${{github.token}}
        run: |
          echo "Publishing release for tag: ${{ github.ref }}"
          echo "All artifact tests passed, proceeding with release..."
          docker run --rm --entrypoint go "${GORELEASER_CROSS_IMAGE}" version
          docker run --rm "${GORELEASER_CROSS_IMAGE}" --version
          # Keep credentials read-only while Buildx updates its builder state.
          docker run \
            --rm \
            -e "GITHUB_TOKEN=${GITHUB_TOKEN}" \
            -e GOMAXPROCS=2 \
            -e GOFLAGS=-p=2 \
            -e "DOCKER_IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" \
            -e DOCKER_CONFIG=/root/.docker \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$HOME/.docker/buildx:/root/.docker/buildx" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/go/src/llgo" \
            -w /go/src/llgo \
            "${GORELEASER_CROSS_IMAGE}" \
            release --parallelism=1 --clean --verbose --skip snapcraft

      - name: Upload Linux packages to Fury
        if: steps.release-type.outputs.stable == 'true'
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ vars.FURY_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${FURY_TOKEN:?Set the FURY_TOKEN Actions secret to a Gemfury Push token}"
          if [[ -z "$FURY_ACCOUNT" ]]; then
            FURY_ACCOUNT="$GITHUB_REPOSITORY_OWNER"
            if [[ "$FURY_ACCOUNT" == 'xgo-dev' ]]; then
              FURY_ACCOUNT=goplus
            fi
          fi
          if [[ ! "$FURY_ACCOUNT" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo 'Invalid FURY_ACCOUNT' >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          packages=()
          for arch in amd64 arm64; do
            for format in deb rpm; do
              package=".dist/llgo${version}.linux-${arch}.${format}"
              if [[ ! -s "$package" ]]; then
                echo "Missing release package: $package" >&2
                exit 1
              fi
              packages+=("$package")
            done
          done
          for package in "${packages[@]}"; do
            echo "Uploading $package to Fury account $FURY_ACCOUNT"
            status=$(curl --silent --show-error --connect-timeout 30 --max-time 600 \
              --header "Authorization: ${FURY_TOKEN}" \
              --header 'Accept: application/vnd.fury.v1' \
              --form "file=@${package}" --form 'public=true' \
              --output /dev/null --write-out '%{http_code}' \
              "https://push.fury.io/uploads?as=${FURY_ACCOUNT}")
            if [[ "$status" != 2[0-9][0-9] ]]; then
              echo "Fury upload failed for $package (HTTP $status)" >&2
              exit 1
            fi
          done

  submit-winget:
    needs: [prepare, release]
    if: needs.prepare.outputs.run_code_ci == 'true' && github.repository == 'xgo-dev/llgo' && needs.release.outputs.stable == 'true'
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      WINGET_PR_TOKEN: ${{ secrets.WINGET_PR_TOKEN }}
