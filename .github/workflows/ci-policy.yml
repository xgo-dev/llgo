name: CI policy

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-policy.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

# This independent check must never be gated by the policy it tests.
jobs:
  policy:
    # Validate the policy independently, without waiting for prepare outputs.
    runs-on: ${{ fromJSON(github.repository_owner == 'xgo-dev' && '["qiniu", "ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-go
        with:
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Require policy test tools
        run: |
          python - <<'PY'
          import shutil
          missing = [tool for tool in ("go", "git", "node", "bash") if shutil.which(tool) is None]
          if missing:
              raise SystemExit("required CI policy tools missing: " + ", ".join(missing))
          PY
      - name: Install workflow test dependency
        run: python -m pip install -r .github/scripts/requirements-ci.txt
      - name: Test decisions and workflow contracts
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Test WinGet publication
        run: python -m unittest discover -s .github/windows -p 'test_*winget.py' -v
