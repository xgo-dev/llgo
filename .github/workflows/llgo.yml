# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: LLGo

on:
  push:
    branches:
      - "**"
      - "!dependabot/**"
      - "!xgopilot/**"
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  llgo:
    name: llgo (${{ matrix.lane }}, ${{ matrix.os }}, LLVM ${{ matrix.llvm }}, Go ${{ matrix.go }})
    continue-on-error: ${{ matrix.lane == 'compatibility' }}
    timeout-minutes: 60
    strategy:
      matrix:
        # Compatibility results are tied to these exact patch releases.
        # Keep the supported Go 1.24 and 1.26 endpoints on macOS so user
        # projects exercise both runtime generations there. macOS Intel is
        # covered by the release artifact smoke test, avoiding a duplicate
        # 35-minute demo job.
        include:
          - os: ubuntu-latest
            llvm: 19
            go: "1.24.2"
            lane: compatibility
          - os: ubuntu-latest
            llvm: 19
            go: "1.26.5"
            lane: primary
          - os: macos-latest
            llvm: 19
            go: "1.24.2"
            lane: compatibility
          - os: macos-latest
            llvm: 19
            go: "1.26.5"
            lane: primary
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
      - name: Install embedded dependencies
        uses: ./.github/actions/setup-embed-deps
      - name: Download platform-specific demo libs
        run: |
          if ${{ startsWith(matrix.os, 'macos') }}; then
            # Use uname -m to detect actual CPU architecture
            if [[ "$(uname -m)" == "x86_64" ]]; then
              DEMO_PKG="cargs_darwin_amd64.zip"
            else
              DEMO_PKG="cargs_darwin_arm64.zip"
            fi
          else
            DEMO_PKG="cargs_linux_amd64.zip"
          fi

          mkdir -p ./_demo/c/cargs/libs
          cd ./_demo/c/cargs/libs
          wget https://github.com/goplus/llpkg/releases/download/cargs/v1.0.0/${DEMO_PKG}
          unzip ${DEMO_PKG}

          # Process pc template files - replace {{.Prefix}} with actual path
          ACTUAL_PREFIX="$(pwd)"
          for tmpl in lib/pkgconfig/*.pc.tmpl; do
            pc_file="${tmpl%.tmpl}"
            sed "s|{{.Prefix}}|${ACTUAL_PREFIX}|g" "$tmpl" > "$pc_file"
          done

          echo "PKG_CONFIG_PATH=${ACTUAL_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV
      - name: Install further optional dependencies for demos
        run: |
          py_deps=(
            numpy # for github.com/goplus/lib/py/numpy
            torch # for github.com/goplus/lib/py/torch
          )
          pip3.12 install --break-system-packages "${py_deps[@]}"

      - name: Set up Go for build
        uses: ./.github/actions/setup-go

      - name: Install
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Set up Go for testing
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{matrix.go}}

      - name: Test demo without RPATH (expect failure)
        run: |
          echo "Testing demo without RPATH (should fail)..."
          export LLGO_FULL_RPATH=false
          pkg-config --libs cargs
          if (cd ./_demo/c/cargs && llgo run .); then
            echo "ERROR: cargs demo should have failed without RPATH!"
            exit 1
          else
            echo "✓ cargs demo correctly failed without RPATH"
          fi

      - name: Test demos
        run: |
          # TODO(lijie): force python3-embed to be linked with python-3.12-embed
          # Currently, python3-embed is python-3.13-embed, doesn't work with pytorch
          # Will remove this after pytorch is fixed.
          pcdir=$HOME/pc
          mkdir -p $pcdir
          libdir=$(pkg-config --variable=libdir python-3.12-embed)
          echo "libdir: $libdir"
          ln -s $libdir/pkgconfig/python-3.12-embed.pc $pcdir/python3-embed.pc
          export PKG_CONFIG_PATH=$pcdir:${PKG_CONFIG_PATH}
          export LLGO_FULL_RPATH=true
          bash .github/workflows/test_demo.sh

      - name: Test demos (embedded target)
        run: bash .github/workflows/test_demo.sh --embedded

      - name: Test C header generation
        run: |
          echo "Testing C header generation in different build modes..."
          cd _demo/go/export
          chmod +x test.sh
          ./test.sh

      - name: Test export with different symbol names on embedded targets
        run: |
          echo "Testing //export with different symbol names on embedded targets..."
          cd _demo/embed/export
          chmod +x verify_export.sh
          ./verify_export.sh

      - name: Test ESP serial smoke (build + emulator)
        run: |
          echo "Testing ESP32/ESP32-C3 build + emulator smoke..."
          cd _demo/embed
          chmod +x test-esp-serial-startup.sh
          ./test-esp-serial-startup.sh

      - name: Test ESP32-C3 startup regression
        run: |
          echo "Testing ESP32-C3 startup regressions..."
          pip3 install --break-system-packages esptool==5.1.0
          cd _demo/embed
          chmod +x test_esp32c3_startup.sh
          ./test_esp32c3_startup.sh

      - name: _xtool build tests
        run: |
          cd _xtool
          llgo build -v ./...

      - name: Show test result
        run: cat result.md

      - name: LLDB integration tests
        if: ${{ startsWith(matrix.os, 'macos') && matrix.os != 'macos-15-intel' }}
        run: |
          echo "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash _lldb/runtest.sh -v

      - name: DWARF standard tests
        if: ${{ startsWith(matrix.os, 'macos') && matrix.os != 'macos-15-intel' }}
        run: go test -timeout 15m ./internal/build -run '^TestStandardDWARF$' -count=1 -v

  test:
    name: test (${{ matrix.lane }}, ${{ matrix.os }}, LLVM ${{ matrix.llvm }}, Go ${{ matrix.go }}, shard ${{ matrix.shard }})
    continue-on-error: ${{ matrix.lane == 'compatibility' }}
    # macOS runs the full package set in one shard and is normally just over
    # 30 minutes once the wasm runtime sources are present.
    timeout-minutes: 40
    strategy:
      matrix:
        # Keep compatibility and primary toolchains pinned to exact patches.
        os:
          - macos-latest
          - ubuntu-latest
        llvm: [19]
        go: ["1.24.2", "1.26.5"]
        # In-command package parallelism lets Ubuntu use two shards while
        # retaining headroom for the serial std build-mode checks.
        shard: ["0", "1"]
        include:
          - go: "1.24.2"
            lane: compatibility
          - go: "1.26.5"
            lane: primary
        exclude:
          # The full demo lane above exercises Go 1.24 user-project/runtime
          # compatibility on macOS. Keep the much larger per-package
          # compatibility matrix on Ubuntu and use one parallel primary shard
          # on macOS.
          - os: macos-latest
            go: "1.24.2"
          - os: macos-latest
            shard: "1"
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
      - name: Install further optional dependencies for demos
        run: |
          py_deps=(
            numpy # for github.com/goplus/lib/py/numpy
            torch # for github.com/goplus/lib/py/torch
          )
          pip3.12 install --break-system-packages "${py_deps[@]}"

      - name: Set up Go for build
        uses: ./.github/actions/setup-go

      - name: Install
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Set up Go for testing
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{matrix.go}}
      - name: run llgo test
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ startsWith(matrix.os, 'macos') && '1' || '2' }}
          TEST_JOBS: ${{ startsWith(matrix.os, 'macos') && '3' || '4' }}
        run: |
          set -euo pipefail

          pkgs=()
          while IFS= read -r pkg; do
            pkgs+=("${pkg}")
          done < <(go list -tags=llgo ./test/... | sort)

          selected=()
          for i in "${!pkgs[@]}"; do
            if (( i % SHARD_TOTAL == SHARD_INDEX )); then
              selected+=("${pkgs[$i]}")
            fi
          done

          echo "Shard: ${SHARD_INDEX}/${SHARD_TOTAL}, selected: ${#selected[@]} package(s)"
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "No packages in this shard."
            exit 0
          fi
          printf '  %s\n' "${selected[@]}"

          std_pkgs=()
          for pkg in "${selected[@]}"; do
            if [[ "${{ matrix.os }}" == ubuntu-latest && "${{ matrix.go }}" == 1.26.5 && "${pkg}" == */test/std/* ]]; then
              std_pkgs+=("${pkg}")
            fi
          done

          echo "==> llgo test -p=${TEST_JOBS} (${#selected[@]} packages)"
          SECONDS=0
          llgo test -p="${TEST_JOBS}" -timeout=20m -bench='^BenchmarkGo126' -benchtime=1x "${selected[@]}"
          echo "==> llgo test done (${SECONDS}s)"

          if [[ "${#std_pkgs[@]}" -ne 0 ]]; then
            dev/test_std_buildmodes.sh "${std_pkgs[@]}"
          fi

  hello:
    name: hello (${{ matrix.lane }}, ${{ matrix.os }}, LLVM ${{ matrix.llvm }}, Go ${{ matrix.go }})
    continue-on-error: ${{ matrix.lane == 'compatibility' }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            llvm: 19
            go: "1.24.2"
            lane: compatibility
          - os: ubuntu-latest
            llvm: 19
            go: "1.26.5"
            lane: primary
          # Keep the Go 1.26 user-module compatibility matrix on both host
          # platforms; release artifact smoke tests alone only cover go 1.26.
          - os: macos-latest
            llvm: 19
            go: "1.26.5"
            lane: primary
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Install llgo
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Set up Go for testing
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{matrix.go}}

      - name: Test Hello World with go.mod 1.21
        if: startsWith(matrix.go, '1.24') || startsWith(matrix.go, '1.26')
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{matrix.go}}
          mod-version: "1.21"

      - name: Test Hello World with go.mod 1.22
        if: startsWith(matrix.go, '1.24') || startsWith(matrix.go, '1.26')
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{matrix.go}}
          mod-version: "1.22"

      - name: Test Hello World with go.mod 1.24
        if: startsWith(matrix.go, '1.24') || startsWith(matrix.go, '1.26')
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{matrix.go}}
          mod-version: "1.24"

      - name: Test Hello World with go.mod 1.26
        if: startsWith(matrix.go, '1.26')
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{matrix.go}}
          mod-version: "1.26"

  cross-compile:
    timeout-minutes: 30
    strategy:
      matrix:
        # WASI output is host-independent; keep this expensive WAMR build on
        # Ubuntu. Native Darwin coverage remains in the primary LLGo lanes and
        # release artifact smoke tests.
        os: [ubuntu-latest]
        llvm: [19]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Set up Binaryen
        uses: ./.github/actions/setup-binaryen

      - name: Install wamr
        run: |
          git clone --branch WAMR-2.4.4 --depth 1 https://github.com/bytecodealliance/wasm-micro-runtime.git
          mkdir wasm-micro-runtime/product-mini/platforms/linux/build
          cd wasm-micro-runtime/product-mini/platforms/linux/build
          cmake -D WAMR_BUILD_EXCE_HANDLING=1 -D WAMR_BUILD_FAST_INTERP=0 -DWAMR_BUILD_SHARED_MEMORY=1 -DWAMR_BUILD_LIB_WASI_THREADS=1 -DWAMR_BUILD_LIB_PTHREAD=1 -DCMAKE_BUILD_TYPE=Debug -DWAMR_BUILD_DEBUG_INTERP=1 ..
          make -j8
          echo "$PWD" >> $GITHUB_PATH

      - name: Install llgo
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Test Cross Compilation (wasm)
        shell: bash
        working-directory: _demo/c
        run: |
          echo "Testing cross-compilation wasm with $(go env GOVERSION)"

          # Compile for wasm architecture
          GOOS=wasip1 GOARCH=wasm llgo build -o hello -tags=nogc -v ./helloc

          # Check file type
          file hello.wasm

          # Run the wasm binary using llgo_wasm
          iwasm --stack-size=819200000 --heap-size=800000000 hello.wasm

  wasm-runtime:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.2", "1.26.5"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 19

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "4.0.21"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "25"

      - name: Set up Binaryen
        uses: ./.github/actions/setup-binaryen

      - name: Set up Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "39.0.1"

      - name: Set up wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: "1.243.0"

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Install llgo
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Set up Go for testing
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{matrix.go}}

      - name: Build standard runtime for wasm
        shell: bash
        run: |
          run_wasm_scheduler() {
            local module="$1"
            local output
            node --input-type=module -e "import Module from '$module'; await Module();"
            if output=$(node --input-type=module -e "import Module from '$module'; await Module({preRun: [module => { module.ENV.LLGO_WASM_SCHEDULER_DEADLOCK = '1'; }]});" 2>&1); then
              echo "deadlock scheduler fixture unexpectedly succeeded"
              return 1
            fi
            grep -Fq "fatal error: all goroutines are asleep - deadlock!" <<<"$output"
          }

          run_wasi_scheduler() {
            local module="$1"
            local output
            wasm-tools validate --features all "$module"
            output=$(wasmtime run -W exceptions=y "$module" 2>&1)
            grep -Fq "wasm scheduler ok" <<<"$output"
            if output=$(wasmtime run -W exceptions=y \
              --env LLGO_WASM_SCHEDULER_DEADLOCK=1 "$module" 2>&1); then
              echo "deadlock scheduler fixture unexpectedly succeeded"
              return 1
            fi
            grep -Fq "fatal error: all goroutines are asleep - deadlock!" <<<"$output"
          }

          run_wasm_timers() {
            local output
            output=$(node --input-type=module -e "import Module from '$1'; await Module();" 2>&1)
            test "$output" = "wasm timers ok"
          }

          run_wasm_workers() {
            local output
            output=$(node -e "import('$1').then(module => module.default()).catch(error => { console.error(error); process.exit(1); });" 2>&1)
            grep -Fxq "wasm workers ok" <<<"$output"
          }

          run_wasi_timers() {
            local output
            wasm-tools validate --features all "$1"
            output=$(wasmtime run -W exceptions=y "$1" 2>&1)
            test "$output" = "wasm timers ok"
          }

          GOOS=js GOARCH=wasm llgo build -o "$RUNNER_TEMP/runtime-js.wasm" ./internal/build/testdata/wasm-runtime
          GOOS=wasip1 GOARCH=wasm llgo build -o "$RUNNER_TEMP/runtime-wasip1.wasm" ./internal/build/testdata/wasm-runtime
          LLGO_WASI_THREADS=1 GOOS=wasip1 GOARCH=wasm llgo build \
            -o "$RUNNER_TEMP/runtime-wasip1-threads.wasm" ./internal/build/testdata/wasm-blocking
          test "$(wasmtime run -W exceptions=y "$RUNNER_TEMP/runtime-wasip1.wasm" 2>&1)" = "wasip1"
          GOOS=js GOARCH=wasm llgo build -o "$RUNNER_TEMP/wasm-scheduler-go.mjs" ./internal/build/testdata/wasm-scheduler
          run_wasm_scheduler "$RUNNER_TEMP/wasm-scheduler-go.mjs"
          llgo build -target wasm -o "$RUNNER_TEMP/wasm-scheduler.mjs" ./internal/build/testdata/wasm-scheduler
          run_wasm_scheduler "$RUNNER_TEMP/wasm-scheduler.mjs"
          GOOS=wasip1 GOARCH=wasm llgo build -o "$RUNNER_TEMP/wasm-scheduler-wasip1.wasm" ./internal/build/testdata/wasm-scheduler
          run_wasi_scheduler "$RUNNER_TEMP/wasm-scheduler-wasip1.wasm"
          GOOS=js GOARCH=wasm llgo build -o "$RUNNER_TEMP/wasm-timers-go.mjs" ./internal/build/testdata/wasm-timers
          run_wasm_timers "$RUNNER_TEMP/wasm-timers-go.mjs"
          llgo build -target wasm -o "$RUNNER_TEMP/wasm-timers.mjs" ./internal/build/testdata/wasm-timers
          run_wasm_timers "$RUNNER_TEMP/wasm-timers.mjs"
          GOOS=wasip1 GOARCH=wasm llgo build -o "$RUNNER_TEMP/wasm-timers-wasip1.wasm" ./internal/build/testdata/wasm-timers
          run_wasi_timers "$RUNNER_TEMP/wasm-timers-wasip1.wasm"
          LLGO_WASM_WORKERS=2 GOOS=js GOARCH=wasm llgo build \
            -o "$RUNNER_TEMP/wasm-workers-go.mjs" ./internal/build/testdata/wasm-workers
          run_wasm_workers "$RUNNER_TEMP/wasm-workers-go.mjs"
          LLGO_WASM_WORKERS=2 llgo build -target wasm \
            -o "$RUNNER_TEMP/wasm-workers.mjs" ./internal/build/testdata/wasm-workers
          run_wasm_workers "$RUNNER_TEMP/wasm-workers.mjs"
          cp ./internal/build/testdata/wasm-workers/browser.html "$RUNNER_TEMP/browser.html"
          node ./internal/build/testdata/wasm-workers/server.mjs "$RUNNER_TEMP" 8123 &
          browser_server=$!
          trap 'kill "$browser_server" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl -fsS http://127.0.0.1:8123/ >/dev/null; then
              break
            fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8123/ >/dev/null
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser"
          for module in wasm-timers.mjs wasm-workers.mjs wasm-workers-go.mjs; do
            html=$("$browser" --headless=new --no-sandbox --disable-gpu \
              --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom \
              "http://127.0.0.1:8123/browser.html?module=$module")
            grep -Fq 'data-result="pass"' <<<"$html"
          done
          kill "$browser_server"
          wait "$browser_server" || true
          trap - EXIT
          GOOS=js GOARCH=wasm llgo build -o "$RUNNER_TEMP/wasm-gc-go.mjs" ./internal/build/testdata/wasm-gc
          node --input-type=module -e "import Module from '$RUNNER_TEMP/wasm-gc-go.mjs'; await Module();"
          llgo build -target wasm -o "$RUNNER_TEMP/wasm-gc.mjs" ./internal/build/testdata/wasm-gc
          node --input-type=module -e "import Module from '$RUNNER_TEMP/wasm-gc.mjs'; await Module();"
          GOOS=wasip1 GOARCH=wasm LLGO_WASI_THREADS=0 llgo build -o "$RUNNER_TEMP/wasm-gc-wasip1.wasm" ./internal/build/testdata/wasm-gc
          wasm-tools validate --features all "$RUNNER_TEMP/wasm-gc-wasip1.wasm"
          test "$(wasmtime run -W exceptions=y "$RUNNER_TEMP/wasm-gc-wasip1.wasm" 2>&1)" = "wasm gc ok"
          file "$RUNNER_TEMP/runtime-js.wasm" \
            "$RUNNER_TEMP/runtime-wasip1.wasm" \
            "$RUNNER_TEMP/runtime-wasip1-threads.wasm" \
            "$RUNNER_TEMP/wasm-gc-wasip1.wasm"
