# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: LLGo

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  llgo:
    name: llgo (${{ matrix.os }}${{ matrix.windows_abi && format(', {0}', matrix.windows_abi) || '' }}, LLVM ${{ matrix.llvm }}, Go current)
    timeout-minutes: 60
    strategy:
      matrix:
        # Build the compiler and run compiler-owned integration checks once per
        # native toolchain profile, always with .go-version.
        include:
          - os: ubuntu-latest
            llvm: 19
          - os: macos-latest
            llvm: 19
          - os: windows-2022
            llvm: 19
            windows_abi: msvc
          - os: windows-2022
            llvm: 19
            windows_abi: mingw
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}
      - name: Install embedded dependencies
        uses: ./.github/actions/setup-embed-deps
      - name: Setup demo dependencies
        uses: ./.github/actions/setup-demo-deps
        with:
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}

      - name: Set up Go for build
        uses: ./.github/actions/setup-go

      - name: Install
        shell: bash
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Test Hello World with go.mod 1.21 through 1.26
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for mod_version in 1.21 1.22 1.23 1.24 1.25 1.26; do
            LLGO_HELLO_EMBED=false \
              dev/with_go_version.sh 1.27 dev/test_helloworld.sh "$mod_version"
          done

      - name: Test Hello World with go.mod 1.27
        shell: bash
        run: dev/with_go_version.sh 1.27 dev/test_helloworld.sh 1.27

      - name: Test runtime module compatibility
        if: matrix.os == 'ubuntu-latest'
        run: dev/test_runtime_go_versions.sh

      - name: Validate the native Windows toolchain profile
        if: ${{ matrix.os == 'windows-2022' }}
        shell: pwsh
        run: .\.github\workflows\test_windows_toolchain_profile.ps1 -Profile "${{ matrix.windows_abi }}"

      - name: Test demo without RPATH (expect failure)
        if: runner.os != 'Windows'
        run: |
          echo "Testing demo without RPATH (should fail)..."
          export LLGO_FULL_RPATH=false
          pkg-config --libs cargs
          if (cd ./_demo/c/cargs && llgo run .); then
            echo "ERROR: cargs demo should have failed without RPATH!"
            exit 1
          else
            echo "✓ cargs demo correctly failed without RPATH"
          fi

      - name: Test static cargs without a runtime search path
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export LLGO_FULL_RPATH=false
          pkg-config --libs cargs
          (cd ./_demo/c/cargs && llgo run .)

      - name: Test demos
        run: bash .github/workflows/test_demo.sh

      - name: Test demos (embedded target)
        run: bash .github/workflows/test_demo.sh --embedded

      - name: Test C header generation
        shell: bash
        run: |
          echo "Testing C header generation in different build modes..."
          cd _demo/go/export
          chmod +x test.sh
          ./test.sh

      - name: Test export with different symbol names on embedded targets
        shell: bash
        run: |
          echo "Testing //export with different symbol names on embedded targets..."
          cd _demo/embed/export
          chmod +x verify_export.sh
          ./verify_export.sh

      - name: Test ESP serial smoke (build + emulator)
        shell: bash
        run: |
          echo "Testing ESP32/ESP32-C3 build + emulator smoke..."
          cd _demo/embed
          chmod +x test-esp-serial-startup.sh
          ./test-esp-serial-startup.sh

      - name: Test ESP32-C3 startup regression
        shell: bash
        run: |
          echo "Testing ESP32-C3 startup regressions..."
          python -m pip install esptool==5.1.0
          cd _demo/embed
          chmod +x test_esp32c3_startup.sh
          ./test_esp32c3_startup.sh

      - name: Test ESP32-C6 target regression
        shell: bash
        run: |
          echo "Testing ESP32-C6 target regressions..."
          cd _demo/embed
          chmod +x test_esp32c6_startup.sh
          ./test_esp32c6_startup.sh

      - name: _xtool build tests
        run: |
          cd _xtool
          llgo build -v ./...

      - name: Show test result
        run: cat result.md

      - name: Install LLDB for integration tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get install -y lldb-${{matrix.llvm}}

      - name: Install MinGW LLDB for integration tests
        if: ${{ matrix.os == 'windows-2022' && matrix.windows_abi == 'mingw' }}
        shell: msys2 {0}
        env:
          MSYS2_LLDB_PACKAGE_VERSION: "19.1.7-1"
          MSYS2_PYTHON_PACKAGE_VERSION: "3.12.8-2"
        run: |
          set -euo pipefail
          repo=https://repo.msys2.org/mingw/clang64
          prefix=mingw-w64-clang-x86_64
          pacman_args=(--noconfirm -U)
          for dependency in cc-libs expat bzip2 mpdecimal ncurses openssl sqlite3 tcl tk tzdata; do
            pacman_args+=(--assume-installed "$prefix-$dependency")
          done
          pacman "${pacman_args[@]}" \
            "$repo/$prefix-python-$MSYS2_PYTHON_PACKAGE_VERSION-any.pkg.tar.zst" \
            "$repo/$prefix-lldb-$MSYS2_LLDB_PACKAGE_VERSION-any.pkg.tar.zst"

          lldb_path=/clang64/bin/lldb.exe
          "$lldb_path" --version
          echo "LLGO_LLDB=$(cygpath -m "$lldb_path")" >> "$GITHUB_ENV"

      - name: LLDB integration tests
        if: ${{ matrix.os != 'windows-2022' }}
        run: |
          echo "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash cmd/llgo/lldbtest/runtest.sh -v

      - name: LLDB integration tests (MSVC)
        if: ${{ matrix.windows_abi == 'msvc' }}
        shell: pwsh
        run: |
          # The upstream LLVM archive records its build runner's Python home.
          # setup-demo-deps installs that exact Python patch release.
          $env:PYTHONHOME = $env:LLGO_WINDOWS_PYTHON_HOME
          Write-Host "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash cmd/llgo/lldbtest/runtest.sh -v

      - name: LLDB integration tests (MinGW)
        if: ${{ matrix.windows_abi == 'mingw' }}
        shell: msys2 {0}
        run: |
          # Git Bash prepends its own MinGW runtime DLLs to PATH. Use the
          # CLANG64 shell so the debuggee loads its ABI-matching dependencies.
          echo "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash cmd/llgo/lldbtest/runtest.sh -v

      - name: DWARF standard tests
        if: ${{ startsWith(matrix.os, 'macos') && matrix.os != 'macos-15-intel' }}
        run: go test -timeout 15m ./internal/build -run '^TestStandardDWARF$' -count=1 -v

  test:
    name: test (${{ matrix.lane }}, ${{ matrix.os }}${{ matrix.windows_abi && format(', {0}', matrix.windows_abi) || '' }}, Go ${{ matrix.go_version }}, shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 60 || startsWith(matrix.os, 'macos') && 45 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        # LLGo and its checker are always built with .go-version. Each job then
        # selects a real target toolchain and matching alternate module file.
        # Go 1.20-1.26 share one focused compatibility lane. Go 1.27 is the
        # primary release and runs the complete test tree on every native
        # toolchain profile. Its Ubuntu shards remain separate because recent
        # runs take about 25 minutes each and would exceed 30 minutes combined.
        include:
          - os: ubuntu-latest
            llvm: 19
            go_version: "1.20-1.26"
            lane: compatibility
            shard_index: "0"
            shard_total: "1"
            check_symbols: true
          - os: ubuntu-latest
            llvm: 19
            go_version: "1.27"
            lane: full
            shard_index: "0"
            shard_total: "2"
            check_symbols: true
            std_buildmodes: true
          - os: ubuntu-latest
            llvm: 19
            go_version: "1.27"
            lane: full
            shard_index: "1"
            shard_total: "2"
            check_symbols: true
            std_buildmodes: true
          - os: macos-latest
            llvm: 19
            go_version: "1.27"
            lane: full
            shard_index: "0"
            shard_total: "1"
          # Each Windows ABI profile runs the latest complete set with -p=2.
          - os: windows-2022
            llvm: 19
            go_version: "1.27"
            lane: full
            shard_index: "0"
            shard_total: "1"
            windows_abi: msvc
          - os: windows-2022
            llvm: 19
            go_version: "1.27"
            lane: full
            shard_index: "0"
            shard_total: "1"
            windows_abi: mingw
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}
      - name: Install further optional dependencies for demos
        if: matrix.lane == 'full'
        uses: ./.github/actions/setup-demo-deps
        with:
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}

      - name: Set up Go for build
        uses: ./.github/actions/setup-go

      - name: Build LLGo and test tools
        shell: bash
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Check Windows native runtime and FFI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llgo = Join-Path $env:RUNNER_TEMP 'llgo-bin\llgo.exe'
          .\.github\workflows\test_windows_runtime.ps1 `
            -LLGo $llgo `
            -Profile "${{ matrix.windows_abi }}"

      - name: Run versioned LLGo tests
        env:
          # The compatibility driver gives every target release an isolated
          # XDG cache. Full lanes run one target release per runner job.
          LLGO_BUILD_CACHE: "1"
          LLGO_TEST_BENCH_GO126: "1"
          LLGO_TEST_CHECK_SYMBOLS: ${{ matrix.check_symbols && '1' || '0' }}
          LLGO_TEST_JOBS: ${{ startsWith(matrix.os, 'windows') && '2' || startsWith(matrix.os, 'macos') && '3' || '4' }}
          LLGO_TEST_STD_BUILDMODES: ${{ matrix.std_buildmodes && '1' || '0' }}
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
        shell: bash
        run: |
          set -euo pipefail

          tool_suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then
            tool_suffix=.exe
            export LLGO_STDIO_NOBUF=1
          fi
          export LLGO="$RUNNER_TEMP/llgo-bin/llgo${tool_suffix}"
          export LLGO_TEST_LLGEN="$RUNNER_TEMP/llgo-bin/llgen${tool_suffix}"
          export CHECK_STD_SYMBOLS="$RUNNER_TEMP/llgo-bin/check_std_symbols${tool_suffix}"
          if [[ "${{ matrix.lane }}" == compatibility ]]; then
            dev/test_go_versions.sh 1.20 1.21 1.22 1.23 1.24 1.25 1.26
          else
            dev/test_go_version.sh "${{ matrix.go_version }}"
          fi

      - name: Test Hello World with Go 1.20
        if: matrix.lane == 'compatibility'
        uses: ./.github/actions/test-helloworld
        with:
          go-version: "1.20"
          embedded: "false"
          mod-version: "1.20"

  cross-compile:
    timeout-minutes: 30
    strategy:
      matrix:
        # WASI output is host-independent; keep this source build on Ubuntu.
        # Native Darwin coverage remains in the primary LLGo lanes and release
        # artifact smoke tests.
        os: [ubuntu-latest]
        llvm: [19]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Install WAMR
        shell: bash
        run: bash dev/build_iwasm.sh

      - name: Install llgo
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Test Cross Compilation (wasm)
        shell: bash
        working-directory: _demo/c
        run: |
          echo "Testing cross-compilation wasm with $(go env GOVERSION)"

          # Compile for wasm architecture
          GOOS=wasip1 GOARCH=wasm llgo build -o hello.wasm -tags=nogc -v ./helloc

          # Check file type
          file hello.wasm

          iwasm --stack-size=819200000 --heap-size=800000000 hello.wasm

  wasm-runtime:
    name: wasm-runtime (Go 1.24 and 1.27)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 19

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "4.0.21"

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Install llgo
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Build standard runtime for wasm
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "off"
        run: dev/test_wasm_runtime_go_versions.sh 1.24 1.27
