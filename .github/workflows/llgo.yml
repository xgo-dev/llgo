# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: LLGo

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  llgo:
    name: llgo (${{ matrix.lane }}, ${{ matrix.os }}, LLVM ${{ matrix.llvm }}, Go ${{ matrix.go }})
    continue-on-error: ${{ matrix.lane == 'compatibility' }}
    timeout-minutes: 60
    strategy:
      matrix:
        # Compatibility results are tied to these exact patch releases.
        # Keep the supported Go 1.24 and 1.26 endpoints on macOS so user
        # projects exercise both runtime generations there. macOS Intel is
        # covered by the release artifact smoke test, avoiding a duplicate
        # 35-minute demo job.
        include:
          - os: ubuntu-latest
            llvm: 19
            go: "1.24.2"
            lane: compatibility
          - os: ubuntu-latest
            llvm: 19
            go: "1.26.5"
            lane: primary
          - os: macos-latest
            llvm: 19
            go: "1.24.2"
            lane: compatibility
          - os: macos-latest
            llvm: 19
            go: "1.26.5"
            lane: primary
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
      - name: Install embedded dependencies
        uses: ./.github/actions/setup-embed-deps
      - name: Setup demo dependencies
        uses: ./.github/actions/setup-demo-deps

      - name: Set up Go for build
        uses: ./.github/actions/setup-go

      - name: Install
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Set up Go for testing
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{matrix.go}}

      - name: Test demo without RPATH (expect failure)
        run: |
          echo "Testing demo without RPATH (should fail)..."
          export LLGO_FULL_RPATH=false
          pkg-config --libs cargs
          if (cd ./_demo/c/cargs && llgo run .); then
            echo "ERROR: cargs demo should have failed without RPATH!"
            exit 1
          else
            echo "✓ cargs demo correctly failed without RPATH"
          fi

      - name: Test demos
        run: bash .github/workflows/test_demo.sh

      - name: Test demos (embedded target)
        run: bash .github/workflows/test_demo.sh --embedded

      - name: Test C header generation
        run: |
          echo "Testing C header generation in different build modes..."
          cd _demo/go/export
          chmod +x test.sh
          ./test.sh

      - name: Test export with different symbol names on embedded targets
        run: |
          echo "Testing //export with different symbol names on embedded targets..."
          cd _demo/embed/export
          chmod +x verify_export.sh
          ./verify_export.sh

      - name: Test ESP serial smoke (build + emulator)
        run: |
          echo "Testing ESP32/ESP32-C3 build + emulator smoke..."
          cd _demo/embed
          chmod +x test-esp-serial-startup.sh
          ./test-esp-serial-startup.sh

      - name: Test ESP32-C3 startup regression
        run: |
          echo "Testing ESP32-C3 startup regressions..."
          pip3 install --break-system-packages esptool==5.1.0
          cd _demo/embed
          chmod +x test_esp32c3_startup.sh
          ./test_esp32c3_startup.sh

      - name: _xtool build tests
        run: |
          cd _xtool
          llgo build -v ./...

      - name: Show test result
        run: cat result.md

      - name: Install LLDB for integration tests
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.lane == 'primary' }}
        run: sudo apt-get install -y lldb-${{matrix.llvm}}

      - name: LLDB integration tests
        if: ${{ matrix.lane == 'primary' }}
        run: |
          echo "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash cmd/llgo/lldbtest/runtest.sh -v

      - name: DWARF standard tests
        if: ${{ startsWith(matrix.os, 'macos') && matrix.os != 'macos-15-intel' }}
        run: go test -timeout 15m ./internal/build -run '^TestStandardDWARF$' -count=1 -v

  test:
    name: test (${{ matrix.lane }}, ${{ matrix.os }}, LLVM ${{ matrix.llvm }}, Go ${{ matrix.go }}, shard ${{ matrix.shard }})
    continue-on-error: ${{ matrix.lane == 'compatibility' }}
    timeout-minutes: ${{ (startsWith(matrix.os, 'macos') || matrix.lane == 'primary') && 45 || 30 }}
    strategy:
      matrix:
        # Keep compatibility and primary toolchains pinned to exact patches.
        os:
          - macos-latest
          - ubuntu-latest
        llvm: [19]
        go: ["1.24.2", "1.26.5"]
        # In-command package parallelism lets Ubuntu use two shards while
        # retaining headroom for the serial std build-mode checks.
        shard: ["0", "1"]
        include:
          - go: "1.24.2"
            lane: compatibility
          - go: "1.26.5"
            lane: primary
        exclude:
          # The full demo lane above exercises Go 1.24 user-project/runtime
          # compatibility on macOS. Keep the much larger per-package
          # compatibility matrix on Ubuntu and use one parallel primary shard
          # on macOS.
          - os: macos-latest
            go: "1.24.2"
          - os: macos-latest
            shard: "1"
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
      - name: Install further optional dependencies for demos
        run: |
          py_deps=(
            numpy # for github.com/goplus/lib/py/numpy
            torch # for github.com/goplus/lib/py/torch
          )
          pip3.12 install --break-system-packages "${py_deps[@]}"

      - name: Set up Go for build
        uses: ./.github/actions/setup-go

      - name: Install
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Set up Go for testing
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{matrix.go}}
      - name: run llgo test
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ startsWith(matrix.os, 'macos') && '1' || '2' }}
          TEST_JOBS: ${{ startsWith(matrix.os, 'macos') && '3' || '4' }}
        run: |
          set -euo pipefail

          pkgs=()
          while IFS= read -r pkg; do
            pkgs+=("${pkg}")
          done < <(go list -tags=llgo ./test/... | sort)

          selected=()
          for i in "${!pkgs[@]}"; do
            if (( i % SHARD_TOTAL == SHARD_INDEX )); then
              selected+=("${pkgs[$i]}")
            fi
          done

          echo "Shard: ${SHARD_INDEX}/${SHARD_TOTAL}, selected: ${#selected[@]} package(s)"
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "No packages in this shard."
            exit 0
          fi
          printf '  %s\n' "${selected[@]}"

          std_pkgs=()
          for pkg in "${selected[@]}"; do
            if [[ "${{ matrix.os }}" == ubuntu-latest && "${{ matrix.go }}" == 1.26.5 && "${pkg}" == */test/std/* ]]; then
              std_pkgs+=("${pkg}")
            fi
          done

          echo "==> llgo test -p=${TEST_JOBS} (${#selected[@]} packages)"
          SECONDS=0
          llgo test -p="${TEST_JOBS}" -timeout=20m -bench='^BenchmarkGo126' -benchtime=1x "${selected[@]}"
          echo "==> llgo test done (${SECONDS}s)"

          if [[ "${#std_pkgs[@]}" -ne 0 ]]; then
            dev/test_std_buildmodes.sh "${std_pkgs[@]}"
          fi

  hello:
    name: hello (${{ matrix.lane }}, ${{ matrix.os }}, LLVM ${{ matrix.llvm }}, Go ${{ matrix.go }})
    continue-on-error: ${{ matrix.lane == 'compatibility' }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            llvm: 19
            go: "1.24.2"
            lane: compatibility
          - os: ubuntu-latest
            llvm: 19
            go: "1.26.5"
            lane: primary
          # Keep the Go 1.26 user-module compatibility matrix on both host
          # platforms; release artifact smoke tests alone only cover go 1.26.
          - os: macos-latest
            llvm: 19
            go: "1.26.5"
            lane: primary
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Install llgo
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Set up Go for testing
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{matrix.go}}

      - name: Test Hello World with go.mod 1.21
        if: startsWith(matrix.go, '1.24') || startsWith(matrix.go, '1.26')
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{matrix.go}}
          mod-version: "1.21"

      - name: Test Hello World with go.mod 1.22
        if: startsWith(matrix.go, '1.24') || startsWith(matrix.go, '1.26')
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{matrix.go}}
          mod-version: "1.22"

      - name: Test Hello World with go.mod 1.24
        if: startsWith(matrix.go, '1.24') || startsWith(matrix.go, '1.26')
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{matrix.go}}
          mod-version: "1.24"

      - name: Test Hello World with go.mod 1.26
        if: startsWith(matrix.go, '1.26')
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{matrix.go}}
          mod-version: "1.26"

  cross-compile:
    timeout-minutes: 30
    strategy:
      matrix:
        # WASI output is host-independent; keep this expensive WAMR build on
        # Ubuntu. Native Darwin coverage remains in the primary LLGo lanes and
        # release artifact smoke tests.
        os: [ubuntu-latest]
        llvm: [19]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Install wamr
        run: |
          git clone --branch WAMR-2.4.4 --depth 1 https://github.com/bytecodealliance/wasm-micro-runtime.git
          mkdir wasm-micro-runtime/product-mini/platforms/linux/build
          cd wasm-micro-runtime/product-mini/platforms/linux/build
          cmake -D WAMR_BUILD_EXCE_HANDLING=1 -D WAMR_BUILD_FAST_INTERP=0 -DWAMR_BUILD_SHARED_MEMORY=1 -DWAMR_BUILD_LIB_WASI_THREADS=1 -DWAMR_BUILD_LIB_PTHREAD=1 -DCMAKE_BUILD_TYPE=Debug -DWAMR_BUILD_DEBUG_INTERP=1 ..
          make -j8
          echo "$PWD" >> $GITHUB_PATH

      - name: Install llgo
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Test Cross Compilation (wasm)
        shell: bash
        working-directory: _demo/c
        run: |
          echo "Testing cross-compilation wasm with $(go env GOVERSION)"

          # Compile for wasm architecture
          GOOS=wasip1 GOARCH=wasm llgo build -o hello -tags=nogc -v ./helloc

          # Check file type
          file hello.wasm

          # Run the wasm binary using llgo_wasm
          iwasm --stack-size=819200000 --heap-size=800000000 hello.wasm

  wasm-runtime:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.2", "1.26.5"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 19

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "4.0.21"

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Install llgo
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Set up Go for testing
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{matrix.go}}

      - name: Build standard runtime for wasm
        shell: bash
        run: |
          GOOS=js GOARCH=wasm llgo build -o "$RUNNER_TEMP/runtime-js.wasm" ./internal/build/testdata/wasm-runtime
          GOOS=wasip1 GOARCH=wasm llgo build -o "$RUNNER_TEMP/runtime-wasip1.wasm" ./internal/build/testdata/wasm-runtime
          file "$RUNNER_TEMP/runtime-js.wasm" "$RUNNER_TEMP/runtime-wasip1.wasm"
