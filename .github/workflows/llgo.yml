# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: LLGo

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  llgo:
    name: llgo (${{ matrix.os }}, LLVM ${{ matrix.llvm }})
    timeout-minutes: 60
    strategy:
      matrix:
        # The compiler and all repository tooling are built only with Go 1.26.
        # The runtime and demos keep their own module language versions.
        include:
          - os: ubuntu-latest
            llvm: 19
          - os: macos-latest
            llvm: 19
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
      - name: Install embedded dependencies
        uses: ./.github/actions/setup-embed-deps
      - name: Setup demo dependencies
        uses: ./.github/actions/setup-demo-deps

      - name: Set up Go for build
        uses: ./.github/actions/setup-go

      - name: Install
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Test runtime module compatibility
        if: matrix.os == 'ubuntu-latest'
        run: dev/test_runtime_go_versions.sh

      - name: Test demo without RPATH (expect failure)
        run: |
          echo "Testing demo without RPATH (should fail)..."
          export LLGO_FULL_RPATH=false
          pkg-config --libs cargs
          if (cd ./_demo/c/cargs && llgo run .); then
            echo "ERROR: cargs demo should have failed without RPATH!"
            exit 1
          else
            echo "✓ cargs demo correctly failed without RPATH"
          fi

      - name: Test demos
        run: bash .github/workflows/test_demo.sh

      - name: Test demos (embedded target)
        run: bash .github/workflows/test_demo.sh --embedded

      - name: Test C header generation
        run: |
          echo "Testing C header generation in different build modes..."
          cd _demo/go/export
          chmod +x test.sh
          ./test.sh

      - name: Test export with different symbol names on embedded targets
        run: |
          echo "Testing //export with different symbol names on embedded targets..."
          cd _demo/embed/export
          chmod +x verify_export.sh
          ./verify_export.sh

      - name: Test ESP serial smoke (build + emulator)
        run: |
          echo "Testing ESP32/ESP32-C3 build + emulator smoke..."
          cd _demo/embed
          chmod +x test-esp-serial-startup.sh
          ./test-esp-serial-startup.sh

      - name: Test ESP32-C3 startup regression
        run: |
          echo "Testing ESP32-C3 startup regressions..."
          pip3 install --break-system-packages esptool==5.1.0
          cd _demo/embed
          chmod +x test_esp32c3_startup.sh
          ./test_esp32c3_startup.sh

      - name: _xtool build tests
        run: |
          cd _xtool
          llgo build -v ./...

      - name: Show test result
        run: cat result.md

      - name: Install LLDB for integration tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get install -y lldb-${{matrix.llvm}}

      - name: LLDB integration tests
        run: |
          echo "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash cmd/llgo/lldbtest/runtest.sh -v

      - name: DWARF standard tests
        if: ${{ startsWith(matrix.os, 'macos') && matrix.os != 'macos-15-intel' }}
        run: go test -timeout 15m ./internal/build -run '^TestStandardDWARF$' -count=1 -v

  test:
    name: test (${{ matrix.lane }}, ${{ matrix.os }}, Go ${{ matrix.go_version }}, shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    timeout-minutes: ${{ matrix.lane == 'full' && (startsWith(matrix.os, 'macos') && 45 || 40) || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # LLGo and the checker are always built with .go-version. Tests then
        # switch to the exact target toolchain and a matching alternate
        # modfile, so release tags and standard-library APIs are genuine.
        include:
          - os: ubuntu-latest
            llvm: 19
            go_version: "1.20"
            lane: compatibility
            shard_index: "0"
            shard_total: "1"
            check_symbols: true
          - os: macos-latest
            llvm: 19
            go_version: "1.21"
            lane: compatibility
            shard_index: "0"
            shard_total: "1"
            check_symbols: true
          - os: ubuntu-latest
            llvm: 19
            go_version: "1.22"
            lane: compatibility
            shard_index: "0"
            shard_total: "1"
            check_symbols: true
          - os: macos-latest
            llvm: 19
            go_version: "1.23"
            lane: compatibility
            shard_index: "0"
            shard_total: "1"
            check_symbols: true
          - os: ubuntu-latest
            llvm: 19
            go_version: "1.24"
            lane: compatibility
            shard_index: "0"
            shard_total: "1"
            check_symbols: true
          - os: ubuntu-latest
            llvm: 19
            go_version: "1.25"
            lane: full
            shard_index: "0"
            shard_total: "2"
            check_symbols: true
          - os: ubuntu-latest
            llvm: 19
            go_version: "1.25"
            lane: full
            shard_index: "1"
            shard_total: "2"
            check_symbols: true
          - os: macos-latest
            llvm: 19
            go_version: "1.25"
            lane: full
            shard_index: "0"
            shard_total: "1"
          - os: ubuntu-latest
            llvm: 19
            go_version: "1.26"
            lane: full
            shard_index: "0"
            shard_total: "2"
            check_symbols: true
            std_buildmodes: true
          - os: ubuntu-latest
            llvm: 19
            go_version: "1.26"
            lane: full
            shard_index: "1"
            shard_total: "2"
            check_symbols: true
            std_buildmodes: true
          - os: macos-latest
            llvm: 19
            go_version: "1.26"
            lane: full
            shard_index: "0"
            shard_total: "1"
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
      - name: Install further optional dependencies for demos
        if: matrix.lane == 'full'
        run: |
          py_deps=(
            numpy # for github.com/goplus/lib/py/numpy
            torch # for github.com/goplus/lib/py/torch
          )
          pip3.12 install --break-system-packages "${py_deps[@]}"

      - name: Set up Go for build
        uses: ./.github/actions/setup-go

      - name: Build and install llgo
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run versioned llgo tests
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          CHECK_STD_SYMBOLS: ${{ runner.temp }}/llgo-bin/check_std_symbols
          LLGO_BUILD_CACHE: "1"
          LLGO_TEST_BENCH_GO126: "1"
          LLGO_TEST_CHECK_SYMBOLS: ${{ matrix.check_symbols && '1' || '0' }}
          LLGO_TEST_JOBS: ${{ startsWith(matrix.os, 'macos') && '3' || '4' }}
          LLGO_TEST_STD_BUILDMODES: ${{ matrix.std_buildmodes && '1' || '0' }}
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
        run: |
          dev/test_go_version.sh "${{ matrix.go_version }}"

  hello:
    name: hello (${{ matrix.lane }}, ${{ matrix.os }}, LLVM ${{ matrix.llvm }}, Go ${{ matrix.go_version }})
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            llvm: 19
            go_version: "1.20"
            lane: compatibility
          - os: ubuntu-latest
            llvm: 19
            go_version: "1.26"
            lane: primary
          # Keep the Go 1.26 user-module compatibility matrix on both host
          # platforms; release artifact smoke tests alone only cover go 1.26.
          - os: macos-latest
            llvm: 19
            go_version: "1.26"
            lane: primary
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Install llgo
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "$RUNNER_TEMP/llgo-bin" >> $GITHUB_PATH
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV


      - name: Test Hello World with go.mod 1.20
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{ matrix.go_version }}
          embedded: "false"
          mod-version: "1.20"

      - name: Test Hello World with go.mod 1.21
        if: matrix.go_version == '1.26'
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{ matrix.go_version }}
          embedded: "false"
          mod-version: "1.21"

      - name: Test Hello World with go.mod 1.22
        if: matrix.go_version == '1.26'
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{ matrix.go_version }}
          embedded: "false"
          mod-version: "1.22"

      - name: Test Hello World with go.mod 1.24
        if: matrix.go_version == '1.26'
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{ matrix.go_version }}
          embedded: "false"
          mod-version: "1.24"

      - name: Test Hello World with go.mod 1.26
        if: matrix.go_version == '1.26'
        uses: ./.github/actions/test-helloworld
        with:
          go-version: ${{ matrix.go_version }}
          mod-version: "1.26"

  cross-compile:
    timeout-minutes: 30
    strategy:
      matrix:
        # WASI output is host-independent; keep this expensive WAMR build on
        # Ubuntu. Native Darwin coverage remains in the primary LLGo lanes and
        # release artifact smoke tests.
        os: [ubuntu-latest]
        llvm: [19]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Install wamr
        run: |
          git clone --branch WAMR-2.4.4 --depth 1 https://github.com/bytecodealliance/wasm-micro-runtime.git
          mkdir wasm-micro-runtime/product-mini/platforms/linux/build
          cd wasm-micro-runtime/product-mini/platforms/linux/build
          cmake -D WAMR_BUILD_EXCE_HANDLING=1 -D WAMR_BUILD_FAST_INTERP=0 -DWAMR_BUILD_SHARED_MEMORY=1 -DWAMR_BUILD_LIB_WASI_THREADS=1 -DWAMR_BUILD_LIB_PTHREAD=1 -DCMAKE_BUILD_TYPE=Debug -DWAMR_BUILD_DEBUG_INTERP=1 ..
          make -j8
          echo "$PWD" >> $GITHUB_PATH

      - name: Install llgo
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Test Cross Compilation (wasm)
        shell: bash
        working-directory: _demo/c
        run: |
          echo "Testing cross-compilation wasm with $(go env GOVERSION)"

          # Compile for wasm architecture
          GOOS=wasip1 GOARCH=wasm llgo build -o hello -tags=nogc -v ./helloc

          # Check file type
          file hello.wasm

          # Run the wasm binary using llgo_wasm
          iwasm --stack-size=819200000 --heap-size=800000000 hello.wasm

  wasm-runtime:
    name: wasm-runtime (Go ${{ matrix.go_version }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - go_version: "1.24"
          - go_version: "1.26"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 19

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "4.0.21"

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Install llgo
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Build standard runtime for wasm
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "1"
        run: dev/test_wasm_runtime_go_version.sh "${{ matrix.go_version }}"
