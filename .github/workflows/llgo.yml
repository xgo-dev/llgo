# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: LLGo

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  llgo:
    name: llgo (${{ matrix.os }}${{ matrix.windows_abi && format(', {0}', matrix.windows_abi) || '' }}${{ matrix.windows_arch && format(', {0}', matrix.windows_arch) || '' }}, LLVM ${{ matrix.llvm }}, Go current)
    timeout-minutes: ${{ matrix.windows_arch == 'arm64' && 120 || matrix.windows_arch == '386' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        # Build the compiler and run compiler-owned integration checks once per
        # native toolchain profile, always with .go-version.
        include:
          - os: ubuntu-latest
            runner: [qiniu, ubuntu-24.04]
            llvm: 22
          - os: macos-latest
            llvm: 22
          - os: windows-2022
            llvm: 22
            windows_abi: msvc
            windows_arch: amd64
            host_go_arch: x64
          - os: windows-2022
            llvm: 22
            windows_abi: mingw
            windows_arch: amd64
            host_go_arch: x64
          - os: windows-11-arm
            llvm: 22
            windows_abi: msvc
            windows_arch: arm64
            host_go_arch: x64
          - os: windows-11-arm
            llvm: 22
            windows_abi: mingw
            windows_arch: arm64
            host_go_arch: arm64
          - os: windows-2022
            llvm: 22
            windows_abi: msvc
            windows_arch: "386"
            host_go_arch: x64
          - os: windows-2022
            llvm: 22
            windows_abi: mingw
            windows_arch: "386"
            host_go_arch: x64
    runs-on: ${{ matrix.runner || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}
          windows-arch: ${{ matrix.windows_arch || 'amd64' }}
      - name: Install embedded dependencies
        uses: ./.github/actions/setup-embed-deps
      - name: Setup demo dependencies
        uses: ./.github/actions/setup-demo-deps
        with:
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}
          windows-arch: ${{ matrix.windows_arch || 'amd64' }}
          # Only this compiler lane executes the LLDB integration suite. Test
          # lanes still install the Python 3.12 demo ABI but skip the unrelated
          # target-native debugger runtime.
          install-lldb-python: "true"

      - name: Set up Go for build
        uses: ./.github/actions/setup-go
        with:
          architecture: ${{ matrix.host_go_arch || '' }}

      - name: Restore LLGo cache
        uses: ./.github/actions/setup-llgo-cache

      - name: Install
        shell: bash
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Activate native Windows target
        if: runner.os == 'Windows'
        uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Test Hello World with go.mod 1.21 through 1.26
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for mod_version in 1.21 1.22 1.23 1.24 1.25 1.26; do
            LLGO_HELLO_EMBED=false \
              dev/with_go_version.sh 1.27 dev/test_helloworld.sh "$mod_version"
          done

      - name: Test Hello World with go.mod 1.27
        shell: bash
        run: dev/with_go_version.sh 1.27 dev/test_helloworld.sh 1.27

      - name: Test runtime module compatibility
        if: matrix.os == 'ubuntu-latest'
        run: dev/test_runtime_go_versions.sh

      - name: Validate the native Windows toolchain profile
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          .\.github\workflows\test_windows_toolchain_profile.ps1
          -Profile "${{ matrix.windows_abi }}"
          -GoArch "${{ matrix.windows_arch || 'amd64' }}"

      - name: Test Windows CPU profiler context
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.github\workflows\test_windows_cpuprof.ps1

      - name: Test demo without RPATH (expect failure)
        if: runner.os != 'Windows'
        run: |
          echo "Testing demo without RPATH (should fail)..."
          export LLGO_FULL_RPATH=false
          pkg-config --libs cargs
          if (cd ./_demo/c/cargs && llgo run .); then
            echo "ERROR: cargs demo should have failed without RPATH!"
            exit 1
          else
            echo "✓ cargs demo correctly failed without RPATH"
          fi

      - name: Test static cargs without a runtime search path
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export LLGO_FULL_RPATH=false
          pkg-config --libs cargs
          (cd ./_demo/c/cargs && llgo run .)

      - name: Test demos
        run: bash .github/workflows/test_demo.sh

      - name: Test demos (embedded target)
        if: runner.os != 'Windows' || matrix.windows_arch != 'arm64'
        run: bash .github/workflows/test_demo.sh --embedded

      # Espressif only publishes an x86-64 Windows QEMU. Its runtime coverage
      # stays on the x64 Windows lanes; the ARM64 runner still compiles every
      # applicable firmware case with the same LLGo host toolchain.
      - name: Test demos (embedded target, build only)
        if: runner.os == 'Windows' && matrix.windows_arch == 'arm64'
        run: bash .github/workflows/test_demo.sh --embedded-build-only

      - name: Test C header generation
        shell: bash
        run: |
          echo "Testing C header generation in different build modes..."
          cd _demo/go/export
          chmod +x test.sh
          ./test.sh

      - name: Test export with different symbol names on embedded targets
        shell: bash
        run: |
          echo "Testing //export with different symbol names on embedded targets..."
          cd _demo/embed/export
          chmod +x verify_export.sh
          ./verify_export.sh

      - name: Test ESP serial smoke
        shell: bash
        run: |
          echo "Testing ESP32/ESP32-C3 build + emulator smoke..."
          cd _demo/embed
          chmod +x test-esp-serial-startup.sh
          args=()
          if [[ "$RUNNER_OS" == "Windows" && "${{ matrix.windows_arch }}" == "arm64" ]]; then
            args+=(--build-only)
          fi
          ./test-esp-serial-startup.sh "${args[@]}"

      - name: Test ESP32-C3 startup regression
        shell: bash
        run: |
          echo "Testing ESP32-C3 startup regressions..."
          if [[ "$RUNNER_OS" == "Windows" && "${{ matrix.windows_abi }}" == "mingw" ]]; then
            # Native target activation can put an architecture-limited
            # llvm-mingw bundle first on PATH. Inspect the RISC-V firmware
            # with the architecture-native host LLVM tools instead; this does
            # not change the compiler/linker profile selected by LLGo.
            host_llvm_bin="$(cygpath -u "$LLGO_MINGW_HOST_ROOT")/bin"
            export LLVM_OBJDUMP="$host_llvm_bin/llvm-objdump.exe"
            export LLVM_NM="$host_llvm_bin/llvm-nm.exe"
            export LLVM_READELF="$host_llvm_bin/llvm-readelf.exe"
            for llvm_tool in "$LLVM_OBJDUMP" "$LLVM_NM" "$LLVM_READELF"; do
              if [[ ! -x "$llvm_tool" ]]; then
                echo "required host LLVM inspection tool not found: $llvm_tool" >&2
                exit 1
              fi
            done
          fi
          # esptool inspects target firmware but runs on the CI host. For a
          # cross-architecture Windows lane, use the x64 host Python so pip
          # can install its native dependencies without cross-building them.
          if [[ "$RUNNER_OS" == "Windows" && -n "${LLGO_WINDOWS_PYTHON_HOME:-}" ]]; then
            host_python_home="$(cygpath -u "$LLGO_WINDOWS_PYTHON_HOME")"
            export PATH="$host_python_home:$PATH"
          fi
          python -m pip install esptool==5.1.0
          cd _demo/embed
          chmod +x test_esp32c3_startup.sh
          args=()
          if [[ "$RUNNER_OS" == "Windows" && "${{ matrix.windows_arch }}" == "arm64" ]]; then
            args+=(--build-only)
          fi
          ./test_esp32c3_startup.sh "${args[@]}"

      - name: _xtool build tests
        # _xtool contains host developer utilities that link the host LLVM and
        # Python libraries. Windows amd64 already covers that build; the 386
        # and ARM64 lanes qualify target programs and cannot link those x64
        # host libraries into target-native tools.
        if: runner.os != 'Windows' || matrix.windows_arch == 'amd64'
        run: |
          cd _xtool
          llgo build -v ./...

      - name: Show test result
        run: cat result.md

      - name: Install LLDB for integration tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get install -y lldb-${{matrix.llvm}}

      - name: Install MinGW LLDB for integration tests
        # R12 qualifies debugger behavior for the new GNU architectures. Keep
        # R11 focused on their language/runtime and C interoperability gates.
        if: ${{ matrix.os == 'windows-2022' && matrix.windows_abi == 'mingw' && matrix.windows_arch == 'amd64' }}
        shell: msys2 {0}
        env:
          MSYS2_LLDB_PACKAGE_VERSION: "22.1.8-1"
          MSYS2_PYTHON_PACKAGE_VERSION: "3.14.6-2"
        run: |
          set -euo pipefail
          repo=https://repo.msys2.org/mingw/clang64
          prefix=mingw-w64-clang-x86_64
          pacman_args=(--noconfirm -U)
          for dependency in cc-libs expat bzip2 mpdecimal ncurses openssl sqlite3 tcl tk tzdata; do
            pacman_args+=(--assume-installed "$prefix-$dependency")
          done
          pacman "${pacman_args[@]}" \
            "$repo/$prefix-python-$MSYS2_PYTHON_PACKAGE_VERSION-any.pkg.tar.zst" \
            "$repo/$prefix-lldb-$MSYS2_LLDB_PACKAGE_VERSION-any.pkg.tar.zst"

          lldb_path=/clang64/bin/lldb.exe
          "$lldb_path" --version
          echo "LLGO_LLDB=$(cygpath -m "$lldb_path")" >> "$GITHUB_ENV"

      - name: LLDB integration tests
        if: runner.os != 'Windows'
        run: |
          echo "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash cmd/llgo/lldbtest/runtest.sh -v

      - name: LLDB integration tests (MSVC)
        if: ${{ matrix.windows_abi == 'msvc' }}
        shell: pwsh
        run: |
          $env:PYTHONHOME = $env:LLGO_WINDOWS_LLDB_PYTHON_HOME
          $env:PYTHONPATH = $env:LLGO_WINDOWS_LLDB_PYTHONPATH
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PATH = "$env:LLGO_WINDOWS_LLDB_PYTHON_HOME;$env:PATH"
          Write-Host "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash cmd/llgo/lldbtest/runtest.sh -v
          if ($LASTEXITCODE -ne 0) {
            throw "LLDB integration tests failed with exit code $LASTEXITCODE"
          }

      - name: LLDB integration tests (MinGW)
        if: ${{ matrix.windows_abi == 'mingw' && matrix.windows_arch == 'amd64' }}
        shell: msys2 {0}
        run: |
          # Git Bash prepends its own MinGW runtime DLLs to PATH. Use the
          # CLANG64 shell so the debuggee loads its ABI-matching dependencies.
          echo "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash cmd/llgo/lldbtest/runtest.sh -v

      - name: LLDB integration tests (MinGW cross-architecture)
        if: ${{ matrix.windows_abi == 'mingw' && matrix.windows_arch != 'amd64' }}
        shell: pwsh
        run: |
          $env:PYTHONHOME = $env:LLGO_WINDOWS_LLDB_PYTHON_HOME
          $env:PYTHONPATH = $env:LLGO_WINDOWS_LLDB_PYTHONPATH
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PATH = "$env:LLGO_WINDOWS_LLDB_PYTHON_HOME;$env:PATH"
          Write-Host "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash cmd/llgo/lldbtest/runtest.sh -v
          if ($LASTEXITCODE -ne 0) {
            throw "LLDB integration tests failed with exit code $LASTEXITCODE"
          }

      - name: Native debug metadata tests
        if: ${{ startsWith(matrix.os, 'macos') && matrix.os != 'macos-15-intel' }}
        run: go test -timeout 15m ./internal/build -run '^(TestStandardDWARF|TestWindowsPDBLinkPath)$' -count=1 -v

      - name: Native debug metadata tests (Windows)
        # This Go test binary links the x64 host LLVM libraries, so it cannot
        # be cross-linked as 386 or ARM64. The target-native LLDB steps above
        # cover those architectures.
        if: ${{ runner.os == 'Windows' && matrix.windows_arch == 'amd64' }}
        shell: pwsh
        run: |
          if ("${{ matrix.windows_abi }}" -eq "msvc") {
            # Target activation selects /MD for generated programs, while the
            # upstream host LLVM libraries use /MT. Match the host libraries
            # when cgo links this host-only test executable.
            $env:CC = $env:LLGO_WINDOWS_HOST_CC
            $env:CXX = $env:LLGO_WINDOWS_HOST_CXX
          }
          go test -timeout 15m ./internal/build -run '^(TestStandardDWARF|TestWindowsPDBLinkPath)$' -count=1 -v
          if ($LASTEXITCODE -ne 0) {
            throw "Native debug metadata tests failed with exit code $LASTEXITCODE"
          }

      # Keep shell setup last so its POSIX compatibility tools cannot affect
      # the native compiler, runtime, demo, or debugger qualification above.
      - name: Set up the MSYS2 host shell for MSVC
        if: ${{ matrix.windows_abi == 'msvc' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: false

      - name: Test from the MSYS2 host shell
        if: ${{ runner.os == 'Windows' }}
        shell: msys2 {0}
        run: bash .github/workflows/test_windows_host_shell.sh

      - name: Install Cygwin for host-shell qualification
        if: ${{ matrix.os == 'windows-2022' && matrix.windows_arch == 'amd64' }}
        id: cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          add-to-path: false

      - name: Test from the Cygwin host shell
        if: ${{ matrix.os == 'windows-2022' && matrix.windows_arch == 'amd64' }}
        shell: pwsh
        env:
          CYGWIN_ROOT: ${{ steps.cygwin.outputs.root }}
        run: |
          $bash = Join-Path $env:CYGWIN_ROOT "bin\bash.exe"
          if (-not (Test-Path $bash)) {
            throw "Cygwin bash was not found at $bash"
          }
          # The earlier MSYS2 setup remains on the inherited Windows PATH. Use
          # Cygwin's own path converter and shell explicitly so an MSYS
          # cygpath cannot turn D:\ into the invalid Cygwin path /d/.
          & $bash --noprofile --norc -c 'export PATH=/usr/bin:/bin:$PATH; cd "$(/usr/bin/cygpath -u "$GITHUB_WORKSPACE")" && /usr/bin/bash .github/workflows/test_windows_host_shell.sh'
          if ($LASTEXITCODE -ne 0) {
            throw "Cygwin host-shell qualification failed with exit code $LASTEXITCODE"
          }

  test:
    name: test (${{ matrix.lane }}, ${{ matrix.os }}${{ matrix.windows_abi && format(', {0}', matrix.windows_abi) || '' }}${{ matrix.windows_arch && format(', {0}', matrix.windows_arch) || '' }}, Go ${{ matrix.go_version }}, shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    # The macOS full test phase alone can normally exceed 41 minutes; leave
    # enough headroom for setup and cleanup instead of racing a 45-minute cap.
    timeout-minutes: ${{ matrix.windows_arch == 'arm64' && 120 || matrix.windows_arch == '386' && 90 || startsWith(matrix.os, 'windows') && 60 || startsWith(matrix.os, 'macos') && 60 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        # LLGo and its checker are always built with .go-version. Each job then
        # selects a real target toolchain and matching alternate module file.
        # Go 1.20-1.26 share one focused compatibility lane. Go 1.27 is the
        # primary release and runs the complete test tree on every native
        # toolchain profile. Ubuntu remains split because its LLVM 22 cold
        # setup plus each shard can exceed 40 minutes. Four recent full runs
        # put Windows ARM64 MSVC at 45-48 minutes, so it is the only other
        # profile split here; the next slowest profiles stay below 35 minutes
        # and avoid duplicate setup.
        include:
          - os: ubuntu-latest
            llvm: 22
            go_version: "1.20-1.26"
            lane: compatibility
            shard_index: "0"
            shard_total: "1"
            check_symbols: true
          - os: ubuntu-latest
            llvm: 22
            go_version: "1.27"
            lane: full
            shard_index: "0"
            shard_total: "2"
            check_symbols: true
            std_buildmodes: true
          - os: ubuntu-latest
            llvm: 22
            go_version: "1.27"
            lane: full
            shard_index: "1"
            shard_total: "2"
            check_symbols: true
            std_buildmodes: true
          - os: macos-latest
            llvm: 22
            go_version: "1.27"
            lane: full
            shard_index: "0"
            shard_total: "1"
          # Each Windows ABI profile runs the latest complete set with -p=2.
          - os: windows-2022
            llvm: 22
            go_version: "1.27"
            lane: full
            shard_index: "0"
            shard_total: "1"
            windows_abi: msvc
            windows_arch: amd64
            host_go_arch: x64
          - os: windows-2022
            llvm: 22
            go_version: "1.27"
            lane: full
            shard_index: "0"
            shard_total: "1"
            windows_abi: mingw
            windows_arch: amd64
            host_go_arch: x64
          - os: windows-11-arm
            llvm: 22
            go_version: "1.27"
            lane: full
            shard_index: "0"
            shard_total: "2"
            windows_abi: msvc
            windows_arch: arm64
            host_go_arch: x64
          - os: windows-11-arm
            llvm: 22
            go_version: "1.27"
            lane: full
            shard_index: "1"
            shard_total: "2"
            windows_abi: msvc
            windows_arch: arm64
            host_go_arch: x64
          - os: windows-11-arm
            llvm: 22
            go_version: "1.27"
            lane: full
            shard_index: "0"
            shard_total: "1"
            windows_abi: mingw
            windows_arch: arm64
            host_go_arch: arm64
          - os: windows-2022
            llvm: 22
            go_version: "1.27"
            lane: full
            shard_index: "0"
            shard_total: "1"
            windows_abi: msvc
            windows_arch: "386"
            host_go_arch: x64
          - os: windows-2022
            llvm: 22
            go_version: "1.27"
            lane: full
            shard_index: "0"
            shard_total: "1"
            windows_abi: mingw
            windows_arch: "386"
            host_go_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}
          windows-arch: ${{ matrix.windows_arch || 'amd64' }}
      - name: Install further optional dependencies for demos
        if: matrix.lane == 'full'
        uses: ./.github/actions/setup-demo-deps
        with:
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}
          windows-arch: ${{ matrix.windows_arch || 'amd64' }}

      - name: Set up Go for build
        uses: ./.github/actions/setup-go
        with:
          architecture: ${{ matrix.host_go_arch || '' }}

      - name: Build LLGo and test tools
        shell: bash
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Activate native Windows target
        if: runner.os == 'Windows'
        uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Check Windows native runtime and FFI
        # This check is profile-wide rather than package-specific. Run it once
        # on the first shard instead of duplicating it in every shard.
        if: runner.os == 'Windows' && matrix.shard_index == '0'
        shell: pwsh
        run: |
          $llgo = Join-Path $env:RUNNER_TEMP 'llgo-bin\llgo.exe'
          .\.github\workflows\test_windows_runtime.ps1 `
            -LLGo $llgo `
            -Profile "${{ matrix.windows_abi }}" `
            -GoArch "${{ matrix.windows_arch || 'amd64' }}"

      - name: Run versioned LLGo tests
        env:
          # The compatibility driver gives every target release an isolated
          # XDG cache. Full lanes run one target release per runner job.
          LLGO_BUILD_CACHE: "1"
          LLGO_TEST_BENCH_GO126: "1"
          LLGO_TEST_CHECK_SYMBOLS: ${{ matrix.check_symbols && '1' || '0' }}
          LLGO_TEST_STD_BUILDMODES: ${{ matrix.std_buildmodes && '1' || '0' }}
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
        shell: bash
        run: |
          set -euo pipefail

          tool_suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then
            tool_suffix=.exe
            export LLGO_STDIO_NOBUF=1
          fi
          export LLGO="$RUNNER_TEMP/llgo-bin/llgo${tool_suffix}"
          export LLGO_TEST_LLGEN="$RUNNER_TEMP/llgo-bin/llgen${tool_suffix}"
          export CHECK_STD_SYMBOLS="$RUNNER_TEMP/llgo-bin/check_std_symbols${tool_suffix}"
          if [[ "${{ matrix.lane }}" == compatibility ]]; then
            dev/test_go_versions.sh 1.20 1.21 1.22 1.23 1.24 1.25 1.26
          else
            dev/test_go_version.sh "${{ matrix.go_version }}"
          fi

      - name: Check std symbol coverage
        # Balance the other profile-wide check onto shard 1 when the profile
        # is split; unsharded profiles retain their existing coverage.
        if: runner.os == 'Windows' && matrix.windows_arch != 'amd64' && (matrix.shard_total == '1' || matrix.shard_index == '1')
        shell: bash
        run: bash doc/_readme/scripts/check_std_cover.sh

      - name: Test Hello World with Go 1.20
        if: matrix.lane == 'compatibility'
        uses: ./.github/actions/test-helloworld
        with:
          go-version: "1.20"
          embedded: "false"
          mod-version: "1.20"

  cross-compile:
    timeout-minutes: 30
    strategy:
      matrix:
        # WASI output is host-independent; keep this source build on Ubuntu.
        # Native Darwin coverage remains in the primary LLGo lanes and release
        # artifact smoke tests.
        os: [ubuntu-latest]
        llvm: [22]
    runs-on: [qiniu, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Set up Binaryen
        uses: ./.github/actions/setup-binaryen

      - name: Restore LLGo and cache WAMR
        uses: ./.github/actions/setup-llgo-cache
        with:
          wamr-cache-mode: readwrite

      - name: Install WAMR
        shell: bash
        run: bash dev/build_iwasm.sh

      - name: Install llgo
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Test Cross Compilation (wasm)
        shell: bash
        working-directory: _demo/c
        run: |
          echo "Testing cross-compilation wasm with $(go env GOVERSION)"

          # Compile for wasm architecture
          GOOS=wasip1 GOARCH=wasm llgo build -o hello.wasm -tags=nogc -v ./helloc

          # Check file type
          file hello.wasm

          iwasm --stack-size=819200000 --heap-size=800000000 hello.wasm

  windows-gnu-cross:
    name: windows GNU cross (${{ matrix.os }}, ${{ matrix.windows_arch }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        windows_arch: [amd64, arm64, "386"]
        include:
          - os: ubuntu-24.04
            runner: [qiniu, ubuntu-24.04]
    runs-on: ${{ matrix.runner || matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install host dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.27.0"

      - name: Build Unix host compiler
        shell: bash
        run: |
          go build -p=2 -o "$RUNNER_TEMP/llgo-host" ./cmd/llgo
          # This development binary lives outside LLGO_ROOT/bin. Point it at
          # the checkout explicitly so standard-library source patches are
          # available to the following cross-host builds.
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Test cross-host windows/${{ matrix.windows_arch }}
        uses: ./.github/actions/test-windows-cross
        with:
          llgo: ${{ runner.temp }}/llgo-host
          windows-arch: ${{ matrix.windows_arch }}

  wasm-runtime:
    name: wasm-runtime (Go 1.24 and 1.27)
    timeout-minutes: 30
    runs-on: [qiniu, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "4.0.21"

      - name: Set up Node for Emscripten Memory64
        # Emscripten 4.0.21's Memory64 glue rejects Node versions older than
        # 23. setup-emsdk currently bundles Node 22, so select an active LTS
        # runtime explicitly for execution without changing emcc itself.
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Binaryen
        uses: ./.github/actions/setup-binaryen

      - name: Set up Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "39.0.1"

      - name: Set up wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: "1.243.0"

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Install llgo
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Test WebAssembly target profiles
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "off"
        run: dev/test_wasm_target_profiles.sh

      - name: Build standard runtime for wasm
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "off"
        run: dev/test_wasm_runtime_go_versions.sh 1.24 1.27

      - name: Test single-worker wasm schedulers
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "off"
        run: dev/test_wasm_single_worker.sh
