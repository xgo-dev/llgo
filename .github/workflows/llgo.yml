# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: LLGo

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  ci-gate:
    name: CI gate (LLGo)
    needs: prepare
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify CI preparation succeeded
        run: test "${{ needs.prepare.result }}" = "success"

  self-host:
    needs: prepare
    if: needs.prepare.outputs.run_code_ci == 'true'
    name: self-host (${{ matrix.os }}, LLVM ${{ matrix.llvm }}, Go 1.27)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        llvm: [22]
    runs-on: ${{ startsWith(matrix.os, 'ubuntu') && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{ matrix.llvm }}

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set LLGO_ROOT
        run: echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Build stage 1 with Go
        run: |
          set -euo pipefail

          stage1_dir="$RUNNER_TEMP/llgo-stage1"
          mkdir -p "$stage1_dir"
          go build -o "$stage1_dir/llgo" ./cmd/llgo
          "$stage1_dir/llgo" version

      - name: Build stage 2 with LLGo
        run: |
          set -euo pipefail

          stage1="$RUNNER_TEMP/llgo-stage1/llgo"
          stage2_dir="$RUNNER_TEMP/llgo-stage2"
          mkdir -p "$stage2_dir"
          "$stage1" build -o "$stage2_dir/llgo" ./cmd/llgo
          "$stage2_dir/llgo" version
          file "$stage2_dir/llgo"
          echo "$stage2_dir" >> "$GITHUB_PATH"

      - name: Test with stage 2
        run: |
          set -euo pipefail

          test "$(command -v llgo)" = "$RUNNER_TEMP/llgo-stage2/llgo"
          LLGO_BUILD_CACHE=off llgo test -timeout=10m ./test/std/io/ioutil
          LLGO_BUILD_CACHE=off llgo test -timeout=10m -run '^TestRuntimeGMPLinks$' ./test/llgoext

      - name: Run demos with stage 2
        run: |
          set -euo pipefail

          test "$(command -v llgo)" = "$RUNNER_TEMP/llgo-stage2/llgo"
          (cd _demo/go && LLGO_BUILD_CACHE=off llgo run ./stdlib)
          (cd _demo/c && LLGO_BUILD_CACHE=off llgo run ./hello)

  llgo:
    permissions:
      contents: read
      id-token: write
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: llgo + test (${{ matrix.os }}${{ matrix.windows_abi && format(', {0}', matrix.windows_abi) || '' }}${{ matrix.windows_arch && format(', {0}', matrix.windows_arch) || '' }}, LLVM ${{ matrix.llvm }}, Go 1.27)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            llvm: 22
          - os: macos-latest
            llvm: 22
          - os: macos-15-intel
            llvm: 22
          - os: windows-2022
            llvm: 22
            windows_abi: msvc
            windows_arch: amd64
            host_go_arch: x64
          - os: windows-2022
            llvm: 22
            windows_abi: mingw
            windows_arch: amd64
            host_go_arch: x64
          - os: windows-11-arm
            llvm: 22
            windows_abi: msvc
            windows_arch: arm64
            host_go_arch: arm64
          - os: windows-11-arm
            llvm: 22
            windows_abi: mingw
            windows_arch: arm64
            host_go_arch: arm64
          - os: windows-2022
            llvm: 22
            windows_abi: msvc
            windows_arch: "386"
            host_go_arch: x64
          - os: windows-2022
            llvm: 22
            windows_abi: mingw
            windows_arch: "386"
            host_go_arch: x64
    runs-on: ${{ startsWith(matrix.os, 'ubuntu') && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}
          windows-arch: ${{ matrix.windows_arch || 'amd64' }}
      - name: Install embedded dependencies
        uses: ./.github/actions/setup-embed-deps
      - name: Setup demo dependencies
        uses: ./.github/actions/setup-demo-deps
        with:
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}
          windows-arch: ${{ matrix.windows_arch || 'amd64' }}
          # Only this compiler lane executes the LLDB integration suite. Test
          # lanes still install the Python 3.12 demo ABI but skip the unrelated
          # target-native debugger runtime.
          install-lldb-python: "true"

      - name: Set up Go for build
        uses: ./.github/actions/setup-go
        with:
          architecture: ${{ matrix.host_go_arch || '' }}

      - name: Restore LLGo cache
        uses: ./.github/actions/setup-llgo-cache

      - name: Build LLGo and test tools
        shell: bash
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          compiler_test="$RUNNER_TEMP/llgo-bin/build.test"
          if [[ "$RUNNER_OS" == Windows ]]; then
            compiler_test+=.exe
          fi
          go test -c -o "$compiler_test" ./internal/build
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Activate native Windows target
        if: runner.os == 'Windows'
        uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Run C ABI and foreign-thread regressions through the build API
        working-directory: internal/build
        shell: bash
        run: |
          compiler_test="$RUNNER_TEMP/llgo-bin/build.test"
          if [[ "$RUNNER_OS" == Windows ]]; then
            compiler_test+=.exe
          fi
          "$compiler_test" -test.v -test.count=1 -test.timeout=5m \
            -test.run='^(TestNarrowCABI|TestCExportForeignThreadsFromExecutableAndDependency)$'

      - name: Check Windows native runtime and FFI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llgo = Join-Path $env:RUNNER_TEMP 'llgo-bin\llgo.exe'
          .\.github\workflows\test_windows_runtime.ps1 `
            -LLGo $llgo `
            -Profile "${{ matrix.windows_abi }}" `
            -GoArch "${{ matrix.windows_arch || 'amd64' }}"

      - name: Run Go 1.27 LLGo core tests
        env:
          LLGO_BUILD_CACHE: "1"
          LLGO_TEST_BENCH_GO126: "1"
          LLGO_TEST_SUITE: "core"
          LLGO_TEST_COVERPROFILE: "coverage-llgo.txt"
          LLGO_TEST_COVERPKG: "github.com/xgo-dev/llgo/test/..."
        shell: bash
        run: |
          set -euo pipefail

          tool_suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then
            tool_suffix=.exe
            export LLGO_STDIO_NOBUF=1
          fi
          export LLGO="$RUNNER_TEMP/llgo-bin/llgo${tool_suffix}"
          export LLGO_TEST_LLGEN="$RUNNER_TEMP/llgo-bin/llgen${tool_suffix}"
          dev/test_go_version.sh 1.27

          python .github/scripts/check_llgo_coverage.py coverage-llgo.txt

          if [[ "$RUNNER_OS" == Windows ]]; then
            # The TLS regression lives in the runtime submodule, outside test/.
            (cd runtime && "$LLGO" test -v -run '^TestSlotGCAllocation$' -count=20 -timeout=2m ./internal/clite/tls)
          fi

      - name: Install Codecov CLI with Windows host Python
        if: ${{ runner.os == 'Windows' && !cancelled() && hashFiles('coverage-llgo.txt') != '' }}
        id: windows_codecov
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pythonRoot = $env:LLGO_WINDOWS_PYTHON_HOME
          & (Join-Path $pythonRoot 'python.exe') -m pip install --only-binary=:all: codecov-cli==11.3.1
          if ($LASTEXITCODE -ne 0) { throw "Installing Codecov CLI failed: $LASTEXITCODE" }
          $binary = Join-Path $pythonRoot 'Scripts/codecovcli.exe'
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "Codecov CLI version probe failed: $LASTEXITCODE" }
          "binary=$binary" >> $env:GITHUB_OUTPUT

      - name: Upload LLGo test coverage to Codecov
        # Preserve any profile emitted by failing tests, without uploading
        # unrelated profiles produced by child compiler integration tests.
        if: ${{ !cancelled() && hashFiles('coverage-llgo.txt') != '' }}
        uses: codecov/codecov-action@v7
        with:
          binary: ${{ steps.windows_codecov.outputs.binary }}
          use_pypi: true
          version: "11.3.1"
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: coverage-llgo.txt
          flags: llgo-tests
          disable_search: true
          fail_ci_if_error: true

      - name: Test Hello World with Go 1.20
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/test-helloworld
        with:
          go-version: "1.20"
          embedded: "false"
          mod-version: "1.20"

      - name: Test Hello World with go.mod 1.21 through 1.26
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for mod_version in 1.21 1.22 1.23 1.24 1.25 1.26; do
            LLGO_HELLO_EMBED=false \
              dev/with_go_version.sh 1.27 dev/test_helloworld.sh "$mod_version"
          done

      - name: Test Hello World with go.mod 1.27
        shell: bash
        run: dev/with_go_version.sh 1.27 dev/test_helloworld.sh 1.27

      - name: Test runtime module compatibility
        if: matrix.os == 'ubuntu-latest'
        run: dev/test_runtime_go_versions.sh

      - name: Run caller regressions in C shared libraries and archives
        if: runner.os != 'Windows'
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
        run: dev/test_std_buildmodes.sh ./test/std/runtime

      - name: Validate the native Windows toolchain profile
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          .\.github\workflows\test_windows_toolchain_profile.ps1
          -Profile "${{ matrix.windows_abi }}"
          -GoArch "${{ matrix.windows_arch || 'amd64' }}"

      - name: Test Windows CPU profiler context
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.github\workflows\test_windows_cpuprof.ps1

      - name: Test demo without RPATH (expect failure)
        if: runner.os != 'Windows'
        run: |
          echo "Testing demo without RPATH (should fail)..."
          export LLGO_FULL_RPATH=false
          pkg-config --libs cargs
          if (cd ./_demo/c/cargs && llgo run .); then
            echo "ERROR: cargs demo should have failed without RPATH!"
            exit 1
          else
            echo "✓ cargs demo correctly failed without RPATH"
          fi

      - name: Test static cargs without a runtime search path
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export LLGO_FULL_RPATH=false
          pkg-config --libs cargs
          (cd ./_demo/c/cargs && llgo run .)

      - name: Test SIMD behavior with Go and LLGo
        if: matrix.windows_arch != '386'
        shell: bash
        env:
          GOEXPERIMENT: simd
        run: |
          go test -count=1 -timeout=2m ./test/simd/...
          llgo test -O0 -count=1 -timeout=2m ./test/simd/...
          llgo test -O2 -count=1 -timeout=2m ./test/simd/...

      - name: Test demos
        run: bash .github/workflows/test_demo.sh

      - name: Test demos (embedded target)
        if: runner.os != 'Windows' || matrix.windows_arch != 'arm64'
        run: bash .github/workflows/test_demo.sh --embedded

      # Espressif only publishes an x86-64 Windows QEMU. Its runtime coverage
      # stays on the x64 Windows lanes; the ARM64 runner still compiles every
      # applicable firmware case with the same LLGo host toolchain.
      - name: Test demos (embedded target, build only)
        if: runner.os == 'Windows' && matrix.windows_arch == 'arm64'
        run: bash .github/workflows/test_demo.sh --embedded-build-only

      - name: Test C header generation
        shell: bash
        run: |
          echo "Testing C header generation in different build modes..."
          cd _demo/go/export
          chmod +x test.sh
          ./test.sh

      - name: Test export with different symbol names on embedded targets
        shell: bash
        run: |
          echo "Testing //export with different symbol names on embedded targets..."
          cd _demo/embed/export
          chmod +x verify_export.sh
          ./verify_export.sh

      - name: Test ESP serial smoke
        shell: bash
        run: |
          echo "Testing ESP32/ESP32-C3 build + emulator smoke..."
          cd _demo/embed
          chmod +x test-esp-serial-startup.sh
          args=()
          if [[ "$RUNNER_OS" == "Windows" && "${{ matrix.windows_arch }}" == "arm64" ]]; then
            args+=(--build-only)
          fi
          ./test-esp-serial-startup.sh "${args[@]}"

      - name: Test ESP32-C3 startup regression
        shell: bash
        run: |
          echo "Testing ESP32-C3 startup regressions..."
          if [[ "$RUNNER_OS" == "Windows" && "${{ matrix.windows_abi }}" == "mingw" ]]; then
            # Native target activation can put an architecture-limited
            # llvm-mingw bundle first on PATH. Inspect the RISC-V firmware
            # with the architecture-native host LLVM tools instead; this does
            # not change the compiler/linker profile selected by LLGo.
            host_llvm_bin="$(cygpath -u "$LLGO_MINGW_HOST_ROOT")/bin"
            export LLVM_OBJDUMP="$host_llvm_bin/llvm-objdump.exe"
            export LLVM_NM="$host_llvm_bin/llvm-nm.exe"
            export LLVM_READELF="$host_llvm_bin/llvm-readelf.exe"
            for llvm_tool in "$LLVM_OBJDUMP" "$LLVM_NM" "$LLVM_READELF"; do
              if [[ ! -x "$llvm_tool" ]]; then
                echo "required host LLVM inspection tool not found: $llvm_tool" >&2
                exit 1
              fi
            done
          fi
          # esptool inspects target firmware but runs on the CI host. For a
          # cross-architecture Windows lane, use the x64 host Python so pip
          # can install its native dependencies without cross-building them.
          if [[ "$RUNNER_OS" == "Windows" && -n "${LLGO_WINDOWS_PYTHON_HOME:-}" ]]; then
            host_python_home="$(cygpath -u "$LLGO_WINDOWS_PYTHON_HOME")"
            export PATH="$host_python_home:$PATH"
          fi
          python -m pip install esptool==5.1.0
          cd _demo/embed
          chmod +x test_esp32c3_startup.sh
          args=()
          if [[ "$RUNNER_OS" == "Windows" && "${{ matrix.windows_arch }}" == "arm64" ]]; then
            args+=(--build-only)
          fi
          ./test_esp32c3_startup.sh "${args[@]}"

      - name: _xtool build tests
        # _xtool contains host developer utilities that link the host LLVM and
        # Python libraries. Windows amd64 already covers that build; the 386
        # and ARM64 lanes qualify target programs and cannot link those x64
        # host libraries into target-native tools.
        if: runner.os != 'Windows' || matrix.windows_arch == 'amd64'
        run: |
          cd _xtool
          llgo build -v ./...

      - name: Show test result
        run: cat result.md

      - name: Install LLDB for integration tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get install -y lldb-${{matrix.llvm}} gdb

      - name: GDB values, registry and complete worker unwind (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        timeout-minutes: 15
        env:
          LLGO_GDB_INTEGRATION: "1"
        run: go test ./cmd/internal/gdb -run '^TestGDB(Integration|CompleteWorkerUnwind)$' -count=1 -v

      - name: Install MinGW LLDB for integration tests
        # R12 qualifies debugger behavior for the new GNU architectures. Keep
        # R11 focused on their language/runtime and C interoperability gates.
        if: ${{ matrix.os == 'windows-2022' && matrix.windows_abi == 'mingw' && matrix.windows_arch == 'amd64' }}
        shell: msys2 {0}
        env:
          MSYS2_LLDB_PACKAGE_VERSION: "22.1.8-1"
          MSYS2_PYTHON_PACKAGE_VERSION: "3.14.6-2"
        run: |
          set -euo pipefail
          source .github/actions/setup-deps/pacman_retry.sh
          repo=https://repo.msys2.org/mingw/clang64
          prefix=mingw-w64-clang-x86_64
          pacman_args=(--noconfirm -U)
          for dependency in cc-libs expat bzip2 mpdecimal ncurses openssl sqlite3 tcl tk tzdata; do
            pacman_args+=(--assume-installed "$prefix-$dependency")
          done
          pacman_with_retry "${pacman_args[@]}" \
            "$repo/$prefix-python-$MSYS2_PYTHON_PACKAGE_VERSION-any.pkg.tar.zst" \
            "$repo/$prefix-lldb-$MSYS2_LLDB_PACKAGE_VERSION-any.pkg.tar.zst"

          lldb_path=/clang64/bin/lldb.exe
          "$lldb_path" --version
          echo "LLGO_LLDB=$(cygpath -m "$lldb_path")" >> "$GITHUB_ENV"

      - name: LLDB integration tests
        if: runner.os != 'Windows'
        run: |
          echo "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash test/debug/runtime/runtest.sh -v

      - name: LLDB integration tests (MSVC)
        if: ${{ matrix.windows_abi == 'msvc' }}
        shell: pwsh
        run: |
          Write-Host "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash test/debug/runtime/runtest.sh -v
          if ($LASTEXITCODE -ne 0) {
            throw "LLDB integration tests failed with exit code $LASTEXITCODE"
          }

      - name: LLDB integration tests (MinGW)
        if: ${{ matrix.windows_abi == 'mingw' && matrix.windows_arch == 'amd64' }}
        shell: msys2 {0}
        run: |
          # Git Bash prepends its own MinGW runtime DLLs to PATH. Use the
          # CLANG64 shell so the debuggee loads its ABI-matching dependencies.
          echo "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash test/debug/runtime/runtest.sh -v

      - name: LLDB integration tests (MinGW cross-architecture)
        if: ${{ matrix.windows_abi == 'mingw' && matrix.windows_arch != 'amd64' }}
        shell: pwsh
        run: |
          Write-Host "Test lldb with llgo plugin on ${{matrix.os}} with LLVM ${{matrix.llvm}}"
          bash test/debug/runtime/runtest.sh -v
          if ($LASTEXITCODE -ne 0) {
            throw "LLDB integration tests failed with exit code $LASTEXITCODE"
          }

      - name: Native source-debug acceptance tests
        if: runner.os != 'Windows'
        run: bash test/debug/native/runtest.sh

      - name: Native debug metadata tests
        if: ${{ startsWith(matrix.os, 'macos') && matrix.os != 'macos-15-intel' }}
        run: go test -timeout 15m ./internal/build -run '^(TestStandardDWARF|TestWindowsPDBLinkPath)$' -count=1 -v

      - name: Native debug metadata tests (Windows)
        # This Go test binary links the x64 host LLVM libraries, so it cannot
        # be cross-linked as 386 or ARM64. The target-native LLDB steps above
        # cover those architectures.
        if: ${{ runner.os == 'Windows' && matrix.windows_arch == 'amd64' }}
        shell: pwsh
        run: |
          if ("${{ matrix.windows_abi }}" -eq "msvc") {
            # Target activation selects /MD for generated programs, while the
            # upstream host LLVM libraries use /MT. Match the host libraries
            # when cgo links this host-only test executable.
            $env:CC = $env:LLGO_WINDOWS_HOST_CC
            $env:CXX = $env:LLGO_WINDOWS_HOST_CXX
          }
          go test -timeout 15m ./internal/build -run '^(TestStandardDWARF|TestWindowsPDBLinkPath)$' -count=1 -v
          if ($LASTEXITCODE -ne 0) {
            throw "Native debug metadata tests failed with exit code $LASTEXITCODE"
          }

      # Keep shell setup last so its POSIX compatibility tools cannot affect
      # the native compiler, runtime, demo, or debugger qualification above.
      - name: Set up the MSYS2 host shell for MSVC
        if: ${{ matrix.windows_abi == 'msvc' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          cache: false

      - name: Test from the MSYS2 host shell
        if: ${{ runner.os == 'Windows' }}
        shell: msys2 {0}
        run: bash .github/workflows/test_windows_host_shell.sh

      - name: Install Cygwin for host-shell qualification
        if: ${{ matrix.os == 'windows-2022' && matrix.windows_arch == 'amd64' }}
        id: cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          add-to-path: false

      - name: Test from the Cygwin host shell
        if: ${{ matrix.os == 'windows-2022' && matrix.windows_arch == 'amd64' }}
        shell: pwsh
        env:
          CYGWIN_ROOT: ${{ steps.cygwin.outputs.root }}
        run: |
          $bash = Join-Path $env:CYGWIN_ROOT "bin\bash.exe"
          if (-not (Test-Path $bash)) {
            throw "Cygwin bash was not found at $bash"
          }
          # The earlier MSYS2 setup remains on the inherited Windows PATH. Use
          # Cygwin's own path converter and shell explicitly so an MSYS
          # cygpath cannot turn D:\ into the invalid Cygwin path /d/.
          & $bash --noprofile --norc -c 'export PATH=/usr/bin:/bin:$PATH; cd "$(/usr/bin/cygpath -u "$GITHUB_WORKSPACE")" && /usr/bin/bash .github/workflows/test_windows_host_shell.sh'
          if ($LASTEXITCODE -ne 0) {
            throw "Cygwin host-shell qualification failed with exit code $LASTEXITCODE"
          }

      # Install the debugger in an isolated MSYS2 tree after shell/LLDB
      # qualification: rolling GDB dependencies must not update pinned LLVM
      # packages or replace the compiler lane's shell configuration early.
      - name: Install Windows GDB
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-gdb

      - name: GDB native values and registry (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        env:
          LLGO_GDB_INTEGRATION: "1"
        run: |
          Remove-Item Env:PYTHONHOME, Env:PYTHONPATH -ErrorAction SilentlyContinue
          # This package is pure Go. Its target-native driver can run on 386
          # without linking the x64 host LLVM libraries; CC retains the
          # selected target ABI, architecture and CRT for C fallback fixtures.
          go test ./cmd/internal/gdb -run '^TestGDBIntegration$' -count=1 -v
          if ($LASTEXITCODE -ne 0) {
            throw "GDB integration tests failed with exit code $LASTEXITCODE"
          }

      - name: GDB complete worker unwind (Windows amd64 and 386)
        # ARM64 native GDB 18 lacks PAC masks. Its values/registry gate above
        # remains required; blocked-worker unwind is an explicit limitation.
        if: runner.os == 'Windows' && matrix.windows_arch != 'arm64'
        timeout-minutes: 15
        shell: pwsh
        env:
          LLGO_GDB_INTEGRATION: "1"
        run: |
          Remove-Item Env:PYTHONHOME, Env:PYTHONPATH -ErrorAction SilentlyContinue
          go test ./cmd/internal/gdb -run '^TestGDBCompleteWorkerUnwind$' -count=1 -v
          if ($LASTEXITCODE -ne 0) {
            throw "Complete GDB worker unwind failed with exit code $LASTEXITCODE"
          }

  runtime-arm64:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: runtime regressions (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      LLGO_ROOT: ${{ github.workspace }}
      LLGO_BUILD_CACHE: "1"
      LLGO_DYNUNWIND: "1"
      LLGO_DYNUNWIND_DEBUG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-llgo-cache
      - name: Install GNU libunwind for the changed fault-unwind path
        run: sudo timeout 5m apt-get install -y libunwind8
      - name: Build LLGo
        run: |
          go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
          echo "LLGO=$RUNNER_TEMP/llgo" >> "$GITHUB_ENV"
      - name: Run captured closures, hardware faults and synchronization
        run: |
          set -euo pipefail
          "$LLGO" test -v -count=1 -timeout=2m \
            -run '^(TestReflectCallCapturedClosure|TestRuntimeCallersDeepFault)$' ./test/go \
            2>&1 | tee "$RUNNER_TEMP/arm64-faults.log"
          # Ensure the changed GNU libunwind path actually ran.
          grep -Eq '\[dynunwind\] flavor=linux-nongnu frames=[1-9]' "$RUNNER_TEMP/arm64-faults.log"
          "$LLGO" test -v -count=1 -timeout=2m ./test/std/runtime ./test/std/sync
      - name: Run C ABI and foreign-thread regressions through the build API
        run: |
          go test -v -count=1 -timeout=5m \
            -run '^(TestNarrowCABI|TestCExportForeignThreadsFromExecutableAndDependency)$' ./internal/build
      - name: Run caller regressions in C shared libraries and archives
        run: dev/test_std_buildmodes.sh ./test/std/runtime

  native-debuggers-intel:
    name: Native debuggers (macOS Intel, GDB values and registry)
    needs: prepare
    if: needs.prepare.outputs.run_code_ci == 'true'
    permissions:
      contents: read
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install compiler dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: "22"
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Build LLGo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/llgo-bin"
          go build -o "$RUNNER_TEMP/llgo-bin/llgo" ./cmd/llgo
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Install GDB
        uses: ./.github/actions/setup-gdb
      - name: Enable native GDB on the ephemeral Intel runner
        shell: bash
        run: |
          set -euo pipefail
          # GDB's Darwin fork/exec can block in wait4 at _dyld_start. Spawn
          # suspended, then use native attach with the same test assertions.
          # Elevate only GDB to obtain task ports on the ephemeral runner.
          wrapper="$RUNNER_TEMP/llgo-gdb-native"
          printf '#!/bin/bash\nexec python3 %q %q "$@"\n' \
            "$GITHUB_WORKSPACE/test/debug/runtime/gdb_darwin.py" "$LLGO_GDB" > "$wrapper"
          chmod +x "$wrapper"
          "$wrapper" --batch --nx -ex 'python import gdb; print(gdb.VERSION)'
          echo "LLGO_GDB=$wrapper" >> "$GITHUB_ENV"
      - name: LLDB runtime adapter integration tests
        env:
          LLGO_LLDB: /usr/bin/lldb
        run: bash test/debug/runtime/runtest.sh -v
      # GDB 17/18 cannot load dyld 17 shared libraries or unwind blocked
      # system frames here; a plain pthread C control reproduces the failure.
      # Keep TestGDBCompleteWorkerUnwind strict and separately runnable.
      - name: GDB native values and registry (Intel, worker unwind unavailable)
        timeout-minutes: 15
        env:
          LLGO_GDB_INTEGRATION: "1"
        run: go test ./cmd/internal/gdb -run '^TestGDBIntegration$' -count=1 -v

  cross-compile:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    timeout-minutes: 30
    strategy:
      matrix:
        # WASI output is host-independent; keep this qualification on Ubuntu.
        # Native Darwin coverage remains in the primary LLGo lanes and release
        # artifact smoke tests.
        os: [ubuntu-latest]
        llvm: [22]
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_large_runner) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Set up Binaryen
        uses: ./.github/actions/setup-binaryen

      - name: Restore LLGo and cache Wasmer
        uses: ./.github/actions/setup-llgo-cache
        with:
          wasmer-cache-mode: readwrite

      - name: Install Wasmer
        shell: bash
        run: bash dev/install_wasmer.sh

      - name: Install llgo
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Test Cross Compilation (wasm)
        shell: bash
        working-directory: _demo/c
        run: |
          echo "Testing cross-compilation wasm with $(go env GOVERSION)"

          # Compile for wasm architecture
          GOOS=wasip1 GOARCH=wasm llgo build -o hello.wasm -v ./helloc

          # Check file type
          file hello.wasm

          RUST_LOG=off wasmer run --enable-exceptions --enable-simd --stack-size=1048576 hello.wasm

      - name: Set up wasm-tools for EH fixtures
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: "1.243.0"

      - name: Test WASI pthread backend and threaded GC (Wasmer)
        shell: bash
        run: python3 dev/test_wasm_wasi_threads.py

      - name: Test dev WASI Thin and Full LTO (Wasmer)
        shell: bash
        run: |
          set -euo pipefail
          go build -tags=dev -o "$RUNNER_TEMP/llgo-dev" ./cmd/llgo
          LLGO="$RUNNER_TEMP/llgo-dev" python3 dev/test_wasm_wasi_lto.py

      - name: Test WASI size-build LTO regressions (Wasmer)
        shell: bash
        run: |
          python3 -m unittest discover -s test/sizebuild -p '*_test.py'
          python3 test/sizebuild/runtest.py --target=wasi

  windows-gnu-cross:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: windows GNU cross (${{ matrix.os }}, ${{ matrix.windows_arch }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        windows_arch: [amd64, arm64, "386"]
    runs-on: ${{ startsWith(matrix.os, 'ubuntu') && fromJSON(needs.prepare.outputs.linux_large_runner) || matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install host dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.27.0"

      - name: Build Unix host compiler
        shell: bash
        run: |
          go build -p=2 -o "$RUNNER_TEMP/llgo-host" ./cmd/llgo
          # This development binary lives outside LLGO_ROOT/bin. Point it at
          # the checkout explicitly so standard-library source patches are
          # available to the following cross-host builds.
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Test cross-host windows/${{ matrix.windows_arch }}
        uses: ./.github/actions/test-windows-cross
        with:
          llgo: ${{ runner.temp }}/llgo-host
          windows-arch: ${{ matrix.windows_arch }}

  wasm-browser-debug:
    permissions:
      contents: read
      id-token: write
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: wasm-browser-debug
    timeout-minutes: 20
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_large_runner) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "6.0.8"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Set up Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "152.0.7977.54"
          install-dependencies: true
      - uses: ./.github/actions/setup-binaryen
      - uses: ./.github/actions/setup-go
      - name: Install llgo
        run: dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
      - name: Test real browser source breakpoints and paused variables
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "1"
          LLGO_BROWSER_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          LLGO_BROWSER_CHROME_NO_SANDBOX: "1"
          LLGO_BROWSER_COVERAGE_DIR: coverage-browser
        run: python3 dev/test_wasm_browser_debug.py
      - name: Upload browser debugger coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage-browser/*.out') != '' }}
        uses: codecov/codecov-action@v7
        with:
          use_pypi: true
          version: "11.3.1"
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: coverage-browser/j32-embedded.out,coverage-browser/j32-external.out,coverage-browser/j64-embedded.out,coverage-browser/j64-external.out
          flags: go-tests
          disable_search: true
          fail_ci_if_error: true

  wasm-runtime:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    name: wasm-runtime (${{ matrix.suite }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [runtime, test-command]
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_large_runner) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "6.0.8"

      - name: Set up Node for Emscripten Memory64
        # Keep memory64 JavaScript execution on the pinned Node LTS runtime.
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Chrome for browser acceptance
        if: matrix.suite == 'runtime'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Set up Binaryen
        uses: ./.github/actions/setup-binaryen

      - name: Set up Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "39.0.1"

      - name: Restore Wasmer cache
        uses: ./.github/actions/setup-llgo-cache
        with:
          wasmer-cache-mode: readwrite

      - name: Install Wasmer for W32
        run: bash dev/install_wasmer.sh

      - name: Set up wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: "1.243.0"

      - name: Set up Go for building llgo
        uses: ./.github/actions/setup-go

      - name: Install llgo
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Test reflected method calls and large initializers
        if: matrix.suite == 'runtime'
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "1"
        run: |
          for fixture in reflect-method-value reflect-method-alias; do
            for target in wasi emscripten emscripten-memory64; do
              "$LLGO" run -O2 -target "$target" -emulator "./test/wasm/$fixture"
            done
          done
          for profile in J32-GoJS J32-Emscripten J64-Emscripten W32-WASI; do
            go test ./test/goroot -run '^TestGoRootRunCases$' -count=1 -timeout=4m -v -args \
              -llgo "$LLGO" -goroot "$(go env GOROOT)" -directive-mode ci \
              -case '^cmplxdivide\.go$' -wasm-profile "$profile"
          done

      - name: Compare WebAssembly EH encodings and Go/C++ boundary
        if: matrix.suite == 'runtime'
        timeout-minutes: 10
        shell: bash
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
        run: python3 dev/compare_wasm_eh.py --browser

      - name: Test WebAssembly target profiles
        if: matrix.suite == 'runtime'
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "1"
        run: dev/test_wasm_target_profiles.sh

      - name: Verify final WebAssembly DWARF
        if: matrix.suite == 'runtime'
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "1"
        run: |
          python3 -m unittest discover -s dev -p test_wasm_debug_info_test.py
          python3 dev/test_wasm_debug_info.py --profile j32 --profile j64 --profile w32 --artifact embedded --artifact external

      - name: Test optimized Emscripten runtime boundaries
        if: matrix.suite == 'runtime'
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "1"
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          node --test test/wasm/optimization/asyncify-exports.test.mjs
          python3 test/wasm/optimization/test.py --browser

      - name: Build standard runtime for wasm
        if: matrix.suite == 'runtime'
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "1"
        run: dev/test_wasm_runtime_go_versions.sh 1.24 1.27

      - name: Test wasm coverage reporting
        if: matrix.suite == 'runtime'
        shell: bash
        run: dev/wasm_ci_report_test.sh

      - name: Test single-worker wasm schedulers
        shell: bash
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "1"
        run: dev/test_wasm_single_worker.sh "${{ matrix.suite }}"

      - name: Test bounded browser workers
        if: matrix.suite == 'runtime'
        shell: bash
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "1"
        run: dev/test_wasm_workers.sh

      - name: Test SIMD behavior on WebAssembly
        if: matrix.suite == 'test-command'
        shell: bash
        env:
          GOEXPERIMENT: simd
        run: |
          GOOS=wasip1 GOARCH=wasm go test -exec=wasmtime -count=1 -timeout=2m ./test/simd/...
          for opt in 0 2; do
            "$RUNNER_TEMP/llgo-bin/llgo" test "-O${opt}" -target wasi -emulator \
              -v -count=1 -timeout=2m ./test/simd/...
          done

      - name: Test SIMD on JavaScript targets with off, Thin and Full LTO
        if: matrix.suite == 'test-command'
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "1"
        run: dev/test_wasm_simd.sh

      - name: Compare JavaScript call semantics with Go
        if: matrix.suite == 'test-command'
        shell: bash
        run: |
          GOOS=js GOARCH=wasm go test \
            -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" \
            -run '^TestJS(Call|Host)' -count=1 -timeout=30s \
            ./internal/build/testdata/wasm-test

      - name: Test wasm standard-library packages
        if: matrix.suite == 'runtime'
        timeout-minutes: 20
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "off"
        run: |
          bash dev/test_wasm_stdlib_test.sh
          bash dev/test_wasm_stdlib.sh

      - name: Run caller and large-function regressions on browser targets
        if: matrix.suite == 'test-command'
        timeout-minutes: 15
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: "1"
        run: |
          set -euo pipefail
          for target in emscripten emscripten-memory64; do
            "$LLGO" test -target "$target" -emulator -v -count=1 -timeout=90s ./test/std/runtime
          done
          GOOS=js GOARCH=wasm "$LLGO" test -v -count=1 -timeout=90s ./test/std/runtime
          for profile in J32-Emscripten J64-Emscripten J32-GoJS; do
            go test ./test/goroot -v -run '^TestGoRootRunCases$' -count=1 -timeout=10m -args \
              -goroot "$(go env GOROOT)" -llgo "$LLGO" -wasm-profile "$profile" -directive-mode ci -dirs .,fixedbugs \
              -case '^(clearfat\.go|fixedbugs/issue(22662|5856)\.go)$' -min-swap-free-mib=0
          done
