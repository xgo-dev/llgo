name: Format Check

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  prepare:
    uses: ./.github/workflows/ci-prepare.yml

  ci-gate:
    name: CI gate (Format)
    needs: prepare
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify CI preparation succeeded
        run: test "${{ needs.prepare.result }}" = "success"

  fmt:
    if: needs.prepare.outputs.run_code_ci == 'true'
    needs: prepare
    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Check formatting
        run: |
          set -euo pipefail

          check_dir() {
            local dir="$1"
            pushd "$dir" >/dev/null
            # gofmt won't traverse directories that start with '_' or 'testdata',
            # so mirror dev/local_ci.sh and scan every Go file explicitly.
            fmt_output="$(
              find . -name '*.go' -type f ! -name 'xgo_autogen.go' -print0 \
                | xargs -0 gofmt -l \
                | sed 's|^\\./||' \
                || true
            )"
            popd >/dev/null

            if [ -n "$fmt_output" ]; then
              printf 'Detected gofmt differences in %s:\\n%s\\n' "$dir" "$fmt_output"
              return 1
            fi
          }

          for dir in . runtime; do
            check_dir "$dir"
          done

          echo "All files are properly formatted."
