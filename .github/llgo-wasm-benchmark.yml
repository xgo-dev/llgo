version: 1
id: llgo-wasm
title: LLGo WebAssembly build benchmarks
site-path: benchmark/wasm
include: "^BenchmarkWasm(Size|Build)/"
groups:
  wasm-size: "^WasmSize/"
  wasm-build: "^WasmBuild/"
views:
  wasm-size:
    title: WebAssembly output sizes
    select:
      groups: "^wasm-size$"
      metrics: "^(module-bytes|glue-bytes)$"
    table:
      rows: [benchmark]
      columns: [metric]
      missing: error
      empty: error
      dimensions:
        benchmark:
          title: Example, profile and compiler
          trim-prefix: BenchmarkWasmSize/
      metrics:
        module-bytes:
          title: Wasm module
          format: bytes
        glue-bytes:
          title: Generated JS glue
          format: bytes
  wasm-build:
    title: LLGo WebAssembly build measurements
    select:
      groups: "^wasm-build$"
      metrics: "^build-ns$"
    table:
      rows: [benchmark]
      columns: [metric]
      missing: error
      empty: error
      dimensions:
        benchmark:
          title: Example and profile
          trim-prefix: BenchmarkWasmBuild/
      metrics:
        build-ns:
          title: Build
          format: duration-ns
