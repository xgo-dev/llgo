name: "Setup Demo Dependencies"
description: "Install dependencies required by the LLGo demo suite"
inputs:
  windows-abi:
    description: "Native Windows toolchain profile: msvc or mingw"
    required: false
    default: "msvc"
  windows-arch:
    description: "Windows target GOARCH"
    required: false
    default: "amd64"

runs:
  using: "composite"
  steps:
    - name: Set up x64 host Python 3.12 on Windows
      if: runner.os == 'Windows' && inputs.windows-arch != 'arm64'
      id: windows_python
      uses: actions/setup-python@v6
      with:
        # Demo tools embed Python 3.12. Cross-architecture lanes install their
        # native target and LLDB interpreters below. Asking an ARM64 runner to
        # unpack the x64 hosted-tool-cache payload can crash PowerShell's ARM64
        # CLR before emulation is involved, so that native runner is the sole
        # exception.
        python-version: "3.12"
        architecture: x64
        # setup-python otherwise replaces PKG_CONFIG_PATH, hiding the native
        # vcpkg metadata installed by setup-deps from LLGo's runtime build.
        update-environment: false

    - name: Set up LLDB Python 3.10 on Windows amd64
      if: runner.os == 'Windows' && inputs.windows-abi == 'msvc' && inputs.windows-arch == 'amd64'
      id: windows_lldb_python_amd64
      uses: actions/setup-python@v6
      with:
        # LLVM's official 21.1.8 x64 release is built against Python 3.10;
        # installing Python 3.12 cannot satisfy its python310.dll import.
        python-version: "3.10"
        architecture: x64
        update-environment: false

    - name: Set up target Python 3.12 on Windows
      if: runner.os == 'Windows' && inputs.windows-arch != 'amd64'
      id: windows_target_python
      uses: actions/setup-python@v6
      with:
        # The target library ABI is stable across Python 3.12 patch releases.
        # Reuse the runner's native architecture build when available instead
        # of replacing it after the exact x64 LLDB dependency is installed.
        python-version: "3.12"
        architecture: ${{ inputs.windows-arch == 'arm64' && 'arm64' || 'x86' }}
        update-environment: false

    - name: Set up LLDB Python 3.10 on Windows 386
      if: runner.os == 'Windows' && inputs.windows-arch == '386'
      id: windows_lldb_python_386
      uses: actions/setup-python@v6
      with:
        # LLVM's official 21.1.8 Win32 LLDB links python310.dll. Keep this
        # debugger runtime separate from the target Python 3.12 demo library.
        python-version: "3.10"
        architecture: x86
        update-environment: false

    - name: Set up LLDB Python 3.11 on Windows ARM64
      if: runner.os == 'Windows' && inputs.windows-arch == 'arm64'
      id: windows_lldb_python
      uses: actions/setup-python@v6
      with:
        # LLVM's official 21.1.8 Windows-on-Arm LLDB links python311.dll.
        # 3.11.9 is the final ARM64 artifact in actions/python-versions.
        python-version: "3.11.9"
        architecture: arm64
        update-environment: false

    - name: Configure LLDB Python on Windows ARM64
      if: runner.os == 'Windows' && inputs.windows-arch == 'arm64'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $python = "${{ steps.windows_lldb_python.outputs.python-path }}"
        $prefix = (& $python -c "import sys; print(sys.base_prefix)").Trim()
        if (-not (Test-Path (Join-Path $prefix "python311.dll"))) {
          throw "The native ARM64 LLDB Python runtime is incomplete: $prefix"
        }
        Add-Content -Encoding utf8 $env:GITHUB_ENV "LLGO_WINDOWS_LLDB_PYTHON_HOME=$prefix"

    - name: Configure LLDB Python on Windows 386
      if: runner.os == 'Windows' && inputs.windows-arch == '386'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $python = "${{ steps.windows_lldb_python_386.outputs.python-path }}"
        $prefix = (& $python -c "import sys; print(sys.base_prefix)").Trim()
        if (-not (Test-Path (Join-Path $prefix "python310.dll"))) {
          throw "The native x86 LLDB Python runtime is incomplete: $prefix"
        }
        Add-Content -Encoding utf8 $env:GITHUB_ENV "LLGO_WINDOWS_LLDB_PYTHON_HOME=$prefix"

    - name: Configure LLDB Python on Windows amd64
      if: runner.os == 'Windows' && inputs.windows-abi == 'msvc' && inputs.windows-arch == 'amd64'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $python = "${{ steps.windows_lldb_python_amd64.outputs.python-path }}"
        $prefix = (& $python -c "import sys; print(sys.base_prefix)").Trim()
        if (-not (Test-Path (Join-Path $prefix "python310.dll"))) {
          throw "The native x64 LLDB Python runtime is incomplete: $prefix"
        }
        Add-Content -Encoding utf8 $env:GITHUB_ENV "LLGO_WINDOWS_LLDB_PYTHON_HOME=$prefix"

    - name: Install cargs demo library on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        case "${RUNNER_OS}" in
          Linux)
            demo_pkg="cargs_linux_amd64.zip"
            ;;
          macOS)
            case "$(uname -m)" in
              x86_64)
                demo_pkg="cargs_darwin_amd64.zip"
                ;;
              arm64)
                demo_pkg="cargs_darwin_arm64.zip"
                ;;
              *)
                echo "Unsupported macOS architecture: $(uname -m)" >&2
                exit 1
                ;;
            esac
            ;;
        esac

        libs_dir="${GITHUB_WORKSPACE}/_demo/c/cargs/libs"
        mkdir -p "${libs_dir}"
        wget -P "${libs_dir}" "https://github.com/xgo-dev/llpkg/releases/download/cargs/v1.0.0/${demo_pkg}"
        unzip -o "${libs_dir}/${demo_pkg}" -d "${libs_dir}"

        for tmpl in "${libs_dir}"/lib/pkgconfig/*.pc.tmpl; do
          pc_file="${tmpl%.tmpl}"
          sed "s|{{.Prefix}}|${libs_dir}|g" "${tmpl}" > "${pc_file}"
        done

        echo "PKG_CONFIG_PATH=${libs_dir}/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "${GITHUB_ENV}"

    - name: Build cargs demo library on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        # Pin the target of the upstream v1.2.0 annotated tag so source
        # downloads cannot change if that tag is moved.
        CARGS_COMMIT: 0fbac1a0c6ebb7ecd72f0d7ae89c2b79eb3a12eb
      run: |
        $ErrorActionPreference = "Stop"

        if ("${{ inputs.windows-abi }}" -notin @("msvc", "mingw")) {
          throw "Unsupported Windows ABI profile: ${{ inputs.windows-abi }}"
        }
        if ("${{ inputs.windows-abi }}" -eq "msvc") {
          # setup-deps intentionally leaves the x64 developer environment
          # active while the host LLGo compiler is built. Select the target
          # SDK only inside this process when producing the target cargs
          # archive; the shared target environment is activated afterwards.
          . (Join-Path $env:GITHUB_WORKSPACE ".github\windows\msvc-target.ps1")
          $null = Enter-LLGoVisualStudio2022 -GoArch "${{ inputs.windows-arch }}"
        }
        $compiler = (Get-Command clang.exe).Source
        if ("${{ inputs.windows-abi }}" -eq "mingw" -and "${{ inputs.windows-arch }}" -eq "386") {
          if (-not $env:LLGO_MINGW_TARGET_BIN) {
            throw "The standalone llvm-mingw target was not configured"
          }
          $compiler = Join-Path $env:LLGO_MINGW_TARGET_BIN "i686-w64-mingw32-clang.exe"
        }
        $compilerArgs = @()
        if ("${{ inputs.windows-abi }}" -eq "msvc") {
          $compilerArgs = @("--target=$env:LLGO_WINDOWS_TARGET_TRIPLE")
        }
        $compilerTarget = (& $compiler @compilerArgs -dumpmachine).Trim()
        if ("${{ inputs.windows-abi }}" -eq "msvc") {
          if ($compilerTarget -ne $env:LLGO_WINDOWS_TARGET_TRIPLE) {
            throw "The MSVC profile resolved Clang target $compilerTarget, want $env:LLGO_WINDOWS_TARGET_TRIPLE"
          }
          $runtimeArgs = @("-fms-runtime-lib=dll")
          $archive = "cargs.lib"
        } else {
          if ($compilerTarget -notmatch "-(windows-gnu|mingw32)$") {
            throw "The MinGW profile resolved Clang target $compilerTarget"
          }
          $targetArch = switch ("${{ inputs.windows-arch }}") {
            "386" { "i686" }
            "amd64" { "x86_64|amd64" }
            "arm64" { "aarch64" }
          }
          if ($compilerTarget -notmatch "^($targetArch)-") {
            throw "The MinGW profile resolved $compilerTarget for windows/${{ inputs.windows-arch }}"
          }
          $runtimeArgs = @()
          $archive = "libcargs.a"
        }

        $libsDir = Join-Path $env:GITHUB_WORKSPACE "_demo\c\cargs\libs"
        $includeDir = Join-Path $libsDir "include"
        $libDir = Join-Path $libsDir "lib"
        $pcDir = Join-Path $env:RUNNER_TEMP "llgo-pkgconfig"
        New-Item -ItemType Directory -Force $includeDir, $libDir, $pcDir | Out-Null

        $source = Join-Path $env:RUNNER_TEMP "cargs.c"
        $baseUrl = "https://raw.githubusercontent.com/likle/cargs/$env:CARGS_COMMIT"
        foreach ($download in @(
          @{ Url = "$baseUrl/include/cargs.h"; Path = (Join-Path $includeDir "cargs.h") },
          @{ Url = "$baseUrl/src/cargs.c"; Path = $source }
        )) {
          & curl.exe --fail --location --retry 5 --retry-all-errors `
            --output $download.Path $download.Url
          if ($LASTEXITCODE -ne 0) {
            throw "Downloading $($download.Url) failed with exit code $LASTEXITCODE"
          }
        }

        $object = Join-Path $env:RUNNER_TEMP "cargs.obj"
        & $compiler @compilerArgs @runtimeArgs -O2 -std=c11 `
          "-I$includeDir" -c $source -o $object
        if ($LASTEXITCODE -ne 0) {
          throw "Compiling cargs failed with exit code $LASTEXITCODE"
        }
        if ("${{ inputs.windows-abi }}" -eq "msvc") {
          & llvm-lib "/out:$(Join-Path $libDir $archive)" $object
        } else {
          & llvm-ar rcs (Join-Path $libDir $archive) $object
        }
        if ($LASTEXITCODE -ne 0) {
          throw "Archiving cargs failed with exit code $LASTEXITCODE"
        }

        # A static target-native library avoids a demo-only DLL search path.
        # Each profile's pkg-config resolves -lcargs to its own archive format.
        # Windows pkgconf relocates a variable named "prefix" relative to the
        # .pc file by default. Keep these installation paths absolute because
        # the metadata intentionally lives under RUNNER_TEMP, not the library.
        $pcIncludeDir = $includeDir.Replace('\', '/')
        $pcLibDir = $libDir.Replace('\', '/')
        @"
        libdir=$pcLibDir
        includedir=$pcIncludeDir

        Name: cargs
        Description: A simple argument parser library
        Version: 1.2.0
        Libs: -L"`${libdir}" -lcargs
        Cflags: -I"`${includedir}"
        "@ | Set-Content -Encoding ascii (Join-Path $pcDir "cargs.pc")

    - name: Install Python demo dependencies on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        pip3.12 install --break-system-packages numpy torch

        pcdir="${HOME}/pc"
        mkdir -p "${pcdir}"
        libdir="$(pkg-config --variable=libdir python-3.12-embed)"
        ln -sf "${libdir}/pkgconfig/python-3.12-embed.pc" "${pcdir}/python3-embed.pc"

        echo "PKG_CONFIG_PATH=${pcdir}:${PKG_CONFIG_PATH:-}" >> "${GITHUB_ENV}"
        echo "LLGO_FULL_RPATH=true" >> "${GITHUB_ENV}"

    - name: Install Python demo dependencies on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $hostPython = "${{ steps.windows_python.outputs.python-path || steps.windows_target_python.outputs.python-path }}"
        $python = "${{ steps.windows_target_python.outputs.python-path || steps.windows_python.outputs.python-path }}"
        $packages = @("numpy")
        if ("${{ inputs.windows-arch }}" -eq "amd64") {
          $packages += "torch"
        } else {
          Add-Content -Encoding utf8 $env:GITHUB_ENV "LLGO_WINDOWS_NO_TORCH=1"
        }
        & $python -m pip install @packages
        if ($LASTEXITCODE -ne 0) {
          throw "Installing Python demo dependencies failed with exit code $LASTEXITCODE"
        }

        $prefix = (& $python -c "import sys; print(sys.base_prefix)").Trim()
        $hostPrefix = (& $hostPython -c "import sys; print(sys.base_prefix)").Trim()
        $includeDir = (& $python -c "import sysconfig; print(sysconfig.get_path('include'))").Trim()
        $version = (& $python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')").Trim()
        $libDir = Join-Path $prefix "libs"
        $importLibrary = Join-Path $libDir "python$version.lib"
        if (-not (Test-Path $importLibrary)) {
          throw "Python import library was not found at $importLibrary"
        }
        if ("${{ inputs.windows-abi }}" -eq "mingw") {
          # LLVM's MinGW linker accepts the same COFF import-library contents
          # but its -l search uses the GNU filename. Keep the official Python
          # artifact untouched and expose only a profile-local spelling.
          Copy-Item -Force $importLibrary (Join-Path $libDir "libpython$version.a")
        }

        $pcDir = Join-Path $env:RUNNER_TEMP "llgo-pkgconfig"
        New-Item -ItemType Directory -Force $pcDir | Out-Null
        $pcIncludeDir = $includeDir.Replace('\', '/')
        $pcLibDir = $libDir.Replace('\', '/')
        @"
        libdir=$pcLibDir
        includedir=$pcIncludeDir

        Name: Python
        Description: Python library for LLGo embedding demos
        Version: 3.12
        Libs: -L"`${libdir}" -lpython$version
        Cflags: -I"`${includedir}"
        "@ | Set-Content -Encoding ascii (Join-Path $pcDir "python3-embed.pc")

        Add-Content -Encoding utf8 $env:GITHUB_PATH $prefix
        Add-Content -Encoding utf8 $env:GITHUB_ENV "LLGO_WINDOWS_PYTHON_HOME=$hostPrefix"
        Add-Content -Encoding utf8 $env:GITHUB_ENV "LLGO_WINDOWS_TARGET_PYTHON_HOME=$prefix"
