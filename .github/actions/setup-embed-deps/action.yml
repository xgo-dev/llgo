name: "Setup Embedded Dependencies"
description: "Install dependencies required for embedded emulator tests"

runs:
  using: "composite"
  steps:
    - name: Refresh Homebrew metadata on Apple Silicon
      if: runner.os == 'macOS' && runner.arch == 'ARM64'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
      run: brew update

    - name: Install macOS embedded dependencies
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      run: |
        # Preserve runner-provided packages on Intel, where Homebrew no longer
        # guarantees bottles. Apple Silicon refreshes metadata in the step above.
        brew list --versions sdl2 >/dev/null || brew install sdl2

    - name: Install Ubuntu embedded dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-2.0-0 libslirp0

    - name: Cache ESP QEMU toolchains
      id: esp_qemu_cache
      uses: actions/cache@v6
      with:
        path: .cache/qemu
        key: esp-qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/install-esp-qemu.sh') }}

    - name: Install ESP QEMU toolchains
      if: steps.esp_qemu_cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        chmod +x .github/workflows/install-esp-qemu.sh
        .github/workflows/install-esp-qemu.sh .cache/qemu

    - name: Add ESP QEMU to PATH
      shell: bash
      run: |
        qemu_bin="${PWD}/.cache/qemu/bin"
        if [[ "$RUNNER_OS" == Windows ]]; then
          # Git Bash understands /d/... paths, but LLGo launches QEMU through
          # Windows CreateProcess and therefore needs a native path.
          qemu_bin="$(cygpath -w "$qemu_bin")"
        fi
        echo "$qemu_bin" >> "$GITHUB_PATH"

    - name: Verify ESP QEMU installation on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        command -v qemu-system-riscv32
        command -v qemu-system-xtensa
        qemu-system-riscv32 --version
        qemu-system-xtensa --version

    - name: Verify ESP QEMU installation on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        Get-Command qemu-system-riscv32 | Select-Object -ExpandProperty Source
        Get-Command qemu-system-xtensa | Select-Object -ExpandProperty Source
        qemu-system-riscv32 --version
        qemu-system-xtensa --version

    - name: Install ESP32-C6 emulator on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        chmod +x .github/workflows/install-esp-emulator.sh
        EMULATOR_DIR=".cache/esp-emulator"
        .github/workflows/install-esp-emulator.sh "$EMULATOR_DIR"
        echo "${PWD}/${EMULATOR_DIR}/bin" >> "$GITHUB_PATH"

    - name: Verify ESP32-C6 emulator installation on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        command -v esp-emu
        esp-emu --version
