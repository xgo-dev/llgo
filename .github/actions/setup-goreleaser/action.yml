name: "Setup GoReleaser"
description: "Setup GoReleaser environment"
inputs:
  esp-clang-cache-path:
    description: "ESP Clang cache path (internal use)"
    required: false
    default: |
      .sysroot/darwin/amd64/crosscompile/clang
      .sysroot/darwin/arm64/crosscompile/clang
      .sysroot/linux/amd64/crosscompile/clang
      .sysroot/linux/arm64/crosscompile/clang
runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: ./.github/actions/setup-go
    - name: Populate Linux sysroot
      run: tar -xzvf .sysroot/linux.tar.gz -C .sysroot
      shell: bash
    - name: Cache ESP Clang
      id: cache-esp-clang
      uses: actions/cache@v6
      with:
        path: ${{ inputs.esp-clang-cache-path }}
        key: esp-clang-${{ hashFiles('.github/workflows/download_esp_clang.sh') }}
    - name: Download ESP Clang (if cache miss)
      if: steps.cache-esp-clang.outputs.cache-hit != 'true'
      run: bash .github/workflows/download_esp_clang.sh
      shell: bash
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Read Unix ESP archive digests
      id: esp-runtime-pins
      shell: bash
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import hashlib, json
        pins = json.load(open('internal/crosscompile/espressif.json'))
        digests = ''.join(pin['sha256'] for target, pin in sorted(pins['payloads'].items())
                          if not target.endswith('-w64-mingw32'))
        print('sha256=' + hashlib.sha256(digests.encode()).hexdigest())
        PY
    - name: Cache ESP runtime archives
      uses: actions/cache@v6
      with:
        path: .esp-runtime-downloads
        key: esp-runtime-v2-${{ steps.esp-runtime-pins.outputs.sha256 }}
        restore-keys: esp-runtime-v2-
    - name: Stage verified ESP runtimes and bundled archives
      run: python3 .github/esp-toolchain.py
      shell: bash
    - name: Check file
      run: tree .sysroot
      shell: bash
