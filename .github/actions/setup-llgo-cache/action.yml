name: "Set up LLGo CI cache"
description: "Restore LLGo package builds, cross-compilation toolchains, and Wasmer"
inputs:
  build-cache-mode:
    description: "LLGo package build cache mode: off, restore, or readwrite"
    required: false
    default: "restore"
  crosscompile-cache-mode:
    description: "Cross-compilation download cache mode: off, restore, or readwrite"
    required: false
    default: "restore"
  wasmer-cache-mode:
    description: "Wasmer cache mode: off, restore, or readwrite"
    required: false
    default: "off"

runs:
  using: "composite"
  steps:
    - name: Resolve LLGo cache profile
      id: llgo_cache
      shell: bash
      env:
        BUILD_CACHE_MODE: ${{ inputs.build-cache-mode }}
        CROSSCOMPILE_CACHE_MODE: ${{ inputs.crosscompile-cache-mode }}
        WASMER_CACHE_MODE: ${{ inputs.wasmer-cache-mode }}
      run: |
        set -euo pipefail

        case "$BUILD_CACHE_MODE" in
          off|restore|readwrite) ;;
          *)
            echo "Unsupported LLGo build cache mode: $BUILD_CACHE_MODE" >&2
            exit 1
            ;;
        esac
        case "$CROSSCOMPILE_CACHE_MODE" in
          off|restore|readwrite) ;;
          *)
            echo "Unsupported cross-compilation cache mode: $CROSSCOMPILE_CACHE_MODE" >&2
            exit 1
            ;;
        esac
        case "$WASMER_CACHE_MODE" in
          off|restore|readwrite) ;;
          *)
            echo "Unsupported Wasmer cache mode: $WASMER_CACHE_MODE" >&2
            exit 1
            ;;
        esac

        source dev/llgo_cache_dir.sh
        cache_root="$(llgo_cache_dir)"

        profile="${LLGO_WINDOWS_ABI:-native}-${LLGO_WINDOWS_ARCH:-native}"
        clang_version="$(clang --version | sed -nE '1s/.*version ([0-9]+([.][0-9]+)+).*/\1/p')"
        if [ -z "$clang_version" ]; then
          echo "Unable to determine the active Clang version" >&2
          exit 1
        fi
        echo "root=$cache_root" >> "$GITHUB_OUTPUT"
        echo "profile=$profile" >> "$GITHUB_OUTPUT"
        echo "go-version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
        echo "clang-version=$clang_version" >> "$GITHUB_OUTPUT"

    # Cross-compilation downloads are content-addressed by their implementation
    # and toolchain version. Pull-request caches are scoped to the PR merge ref,
    # so they can populate a miss without modifying caches visible to main.
    - name: Restore LLGo cross-compilation downloads
      if: inputs.crosscompile-cache-mode == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.llgo_cache.outputs.root }}/crosscompile
        key: llgo-crosscompile-v1-${{ runner.os }}-${{ runner.arch }}-clang-${{ steps.llgo_cache.outputs.clang-version }}-${{ hashFiles('internal/crosscompile/**/*.go') }}

    - name: Cache LLGo cross-compilation downloads
      if: inputs.crosscompile-cache-mode == 'readwrite'
      uses: actions/cache@v6
      with:
        path: ${{ steps.llgo_cache.outputs.root }}/crosscompile
        key: llgo-crosscompile-v1-${{ runner.os }}-${{ runner.arch }}-clang-${{ steps.llgo_cache.outputs.clang-version }}-${{ hashFiles('internal/crosscompile/**/*.go') }}

    # Cache the exact checked-out tree. For a pull request github.sha is its
    # synthetic merge commit, so a base update invalidates the primary key. A
    # miss first reuses the base (or previous main) snapshot, then actions/cache
    # publishes the completed snapshot under the current ref. GitHub isolates
    # pull-request caches from main, preventing an untrusted PR from poisoning
    # the base cache while still making retries useful.
    - name: Restore LLGo package build cache
      if: inputs.build-cache-mode == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.llgo_cache.outputs.root }}/build
        key: llgo-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.llgo_cache.outputs.profile }}-${{ steps.llgo_cache.outputs.go-version }}-clang-${{ steps.llgo_cache.outputs.clang-version }}-${{ github.sha }}
        restore-keys: |
          llgo-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.llgo_cache.outputs.profile }}-${{ steps.llgo_cache.outputs.go-version }}-clang-${{ steps.llgo_cache.outputs.clang-version }}-${{ github.event.pull_request.base.sha || github.event.before || github.sha }}

    - name: Cache LLGo package builds
      if: inputs.build-cache-mode == 'readwrite'
      uses: actions/cache@v6
      with:
        path: ${{ steps.llgo_cache.outputs.root }}/build
        key: llgo-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.llgo_cache.outputs.profile }}-${{ steps.llgo_cache.outputs.go-version }}-clang-${{ steps.llgo_cache.outputs.clang-version }}-${{ github.sha }}
        restore-keys: |
          llgo-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.llgo_cache.outputs.profile }}-${{ steps.llgo_cache.outputs.go-version }}-clang-${{ steps.llgo_cache.outputs.clang-version }}-${{ github.event.pull_request.base.sha || github.event.before || github.sha }}

    - name: Restore Wasmer
      if: inputs.wasmer-cache-mode == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.llgo_cache.outputs.root }}/bin
        key: llgo-wasmer-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.llgo_cache.outputs.profile }}-${{ hashFiles('dev/install_wasmer.sh') }}

    - name: Cache Wasmer
      if: inputs.wasmer-cache-mode == 'readwrite'
      uses: actions/cache@v6
      with:
        path: ${{ steps.llgo_cache.outputs.root }}/bin
        key: llgo-wasmer-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.llgo_cache.outputs.profile }}-${{ hashFiles('dev/install_wasmer.sh') }}
