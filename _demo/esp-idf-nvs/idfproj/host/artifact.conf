# What this firmware links, for the shared pipeline in _demo/common/make-artifact.sh.
GLUES="nvs"
# The probe's live set is small (strings, a 64-byte blob, key lists); the
# default 64 KiB static GC window covers it, and the collector grows into
# PSRAM from there on boards that have it.
GC_WIN_KB=64
# No raised stacks: every glue call is a shallow synchronous NVS access; the
# default goroutine stacks (and 8 KiB main-task stack) hold.
LLGO_EXTRA_ARGS=""
# The llgo_nvs_* bindings must appear in the undefined-symbol list below -
# NONE would mean the probe stopped importing the package (or the glue did
# not sync), and the firmware would build without an NVS layer at all.
DIAG_SYMBOLS="llgo_nvs"
