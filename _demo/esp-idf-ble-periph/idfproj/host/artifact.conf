# What this firmware links, for the shared pipeline in _demo/common/make-artifact.sh.
#
# This demo's sdkconfig selects Bluedroid (BLE only, no classic host), so the
# Bluedroid implementation of the llgo_ble_* ABI is the one that goes in - the
# backend whose peripheral (advertising + GATT server) half is implemented on
# both sides. The central demo (esp-idf-ble) links the NimBLE sibling with the
# identical Go-side contract.
GLUE_MAP="ble/glue/ble_glue_bluedroid.c:ble_glue.c"
GC_WIN_KB=64
