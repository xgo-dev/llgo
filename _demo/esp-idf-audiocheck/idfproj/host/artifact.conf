# What this firmware links, for the shared pipeline in _demo/common/make-artifact.sh.
#
# Glues: the codec (opus), the board pins (gpio/i2c/i2s) and the wakenet
# engine - the full audiocheck surface. post-sync.sh patches the synced
# wakenet glue with the board's MCLK pin and writes the model partition.
GLUES="opus gpio i2c i2s wakenet"
# 128 KiB: the static GC window must hold the main goroutine's fiber stack
# (4x goroutine-stack-size = 64 KiB below) plus the demo's short-lived
# objects; the opus states, the capture buffers and the wakenet weights
# ride the malloc wrap into PSRAM segments.
GC_WIN_KB=128
# opus_encode/opus_decode are deep C calls (alloca scratch in the tens of
# KiB, USE_ALLOCA build). The default 2048-byte goroutine stacks overflow
# them - the measured voice-loop configuration, carried over verbatim.
LLGO_EXTRA_ARGS="-goroutine-stack-size 16384"
# The llgo_opus_* / llgo_wakenet_* bindings and this demo's llgo_ac_* glue
# must appear in the undefined-symbol list below - a missing prefix would
# mean the Go side stopped importing the package (or the glue did not
# sync), and the firmware would build without a codec or an engine at all.
DIAG_SYMBOLS="llgo_opus llgo_wakenet llgo_ac"
