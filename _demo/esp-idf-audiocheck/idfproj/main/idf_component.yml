## The two components this firmware links:
##
## - espressif/esp-sr: the WakeNet engine (precompiled esp32s31 libraries),
##   the srmodel partition enumeration API and the build-time model
##   packaging (CONFIG_SR_WN_WN9_HILEXIN -> srmodels.bin, flashed into the
##   partition named "model"). Its transitive dependencies (dl_fft, esp-dl,
##   cjson) come with it. The pin is the one the esp-idf-wakenet demo
##   validated on this chip (emu: detections end to end).
## - 78/esp-opus: vanilla upstream Opus, compiled fixed-point
##   (-DFIXED_POINT=1 -DDISABLE_FLOAT_API) by the component itself. This is
##   the codec pkg/esp/opus binds; the registry has no "espressif/opus"
##   component.
dependencies:
  espressif/esp-sr: "^2.6.2"
  "78/esp-opus": "1.0.5"
