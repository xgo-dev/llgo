# What this firmware links, for the shared pipeline in _demo/common/make-artifact.sh.
GLUES="opus gpio i2c i2s"
# 128 KiB: the static GC window must hold the main goroutine's fiber stack
# (4x goroutine-stack-size = 64 KiB below) plus the demo's short-lived
# objects; the codec states ride the malloc wrap too.
GC_WIN_KB=128
# opus_encode/opus_decode are deep C calls (alloca scratch in the tens of
# KiB, USE_ALLOCA build). The default 2048-byte goroutine stacks overflow
# them - measurably, the main fiber (4x = 8 KiB floor 16 KiB) smashed the
# allocator globals below its floor. 16 KiB per goroutine gives the main
# fiber 64 KiB, which the measured paths fit inside.
LLGO_EXTRA_ARGS="-goroutine-stack-size 16384"
# The llgo_opus_* bindings and this demo's llgo_vloop_* glue must appear in
# the undefined-symbol list below - a missing prefix would mean the Go side
# stopped importing the package (or the glue did not sync), and the
# firmware would build without a codec or a VAD at all.
DIAG_SYMBOLS="llgo_opus llgo_vloop"
