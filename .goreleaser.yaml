version: 2

dist: .dist

env:
  - DOCKER_IMAGE_REPO={{ envOrDefault "DOCKER_IMAGE_REPO" "ghcr.io/xgo-dev/llgo" }}
  - SYSROOT_DARWIN_AMD64={{.Env.PWD}}/.sysroot/darwin/amd64
  - SYSROOT_DARWIN_ARM64={{.Env.PWD}}/.sysroot/darwin/arm64
  - SYSROOT_LINUX_AMD64={{.Env.PWD}}/.sysroot/linux/amd64
  - SYSROOT_LINUX_ARM64={{.Env.PWD}}/.sysroot/linux/arm64
  - CGO_ENABLED=1
  - CGO_CXXFLAGS=-std=c++17

before:
  hooks:
    - go mod download
    - bash .github/unix/stage-toolchains.sh

builds:
  - id: llgo-darwin-amd64
    main: ./cmd/llgo
    binary: bin/llgo
    flags:
      - -tags=darwin,amd64,byollvm
    ldflags:
      - -X github.com/xgo-dev/llgo/internal/env.buildVersion=v{{.Version}}
      - -X github.com/xgo-dev/llgo/internal/env.buildTime={{.Date}}
    env:
      - CC=o64-clang
      - CXX=o64-clang++
      - CGO_CPPFLAGS=-I{{.Env.SYSROOT_DARWIN_AMD64}}/crosscompile/clang/include -mmacosx-version-min=10.13 -D__STDC_CONSTANT_MACROS -D__STDC_FORMAT_MACROS -D__STDC_LIMIT_MACROS
      - CGO_LDFLAGS=-L{{.Env.SYSROOT_DARWIN_AMD64}}/crosscompile/clang/lib -mmacosx-version-min=10.13 -Wl,-search_paths_first -Wl,-headerpad_max_install_names -lLLVM-22 -lz -lm -Wl,-rpath,@executable_path/../crosscompile/clang/lib
    targets:
      - darwin_amd64
    mod_timestamp: "{{.CommitTimestamp}}"
  - id: llgo-darwin-arm64
    main: ./cmd/llgo
    binary: bin/llgo
    flags:
      - -tags=darwin,arm64,byollvm
    ldflags:
      - -X github.com/xgo-dev/llgo/internal/env.buildVersion=v{{.Version}}
      - -X github.com/xgo-dev/llgo/internal/env.buildTime={{.Date}}
    env:
      - CC=oa64-clang
      - CXX=oa64-clang++
      - CGO_CPPFLAGS=-I{{.Env.SYSROOT_DARWIN_ARM64}}/crosscompile/clang/include -mmacosx-version-min=10.13 -D__STDC_CONSTANT_MACROS -D__STDC_FORMAT_MACROS -D__STDC_LIMIT_MACROS
      - CGO_LDFLAGS=-L{{.Env.SYSROOT_DARWIN_ARM64}}/crosscompile/clang/lib -mmacosx-version-min=10.13 -Wl,-search_paths_first -Wl,-headerpad_max_install_names -lLLVM-22 -lz -lm -Wl,-rpath,@executable_path/../crosscompile/clang/lib
    targets:
      - darwin_arm64
    mod_timestamp: "{{.CommitTimestamp}}"
  - &linux-amd64
    id: llgo-linux-amd64
    main: ./cmd/llgo
    binary: bin/llgo
    flags:
      - -tags=linux,amd64,byollvm
    ldflags:
      - -X github.com/xgo-dev/llgo/internal/env.buildVersion=v{{.Version}}
      - -X github.com/xgo-dev/llgo/internal/env.buildTime={{.Date}}
      - -X github.com/xgo-dev/llgo/xtool/env/llvm.ldLLVMConfigBin=/usr/bin/llvm-config-22
      - "-extldflags=-Wl,-rpath,$ORIGIN/../crosscompile/clang/lib"
    env:
      # Use the packaged host Clang with the Debian 12 sysroot and GCC 12 headers.
      - CC={{.Env.SYSROOT_LINUX_AMD64}}/crosscompile/clang/bin/clang
      - CXX={{.Env.SYSROOT_LINUX_AMD64}}/crosscompile/clang/bin/clang++
      - CGO_CPPFLAGS=--target=x86_64-linux-gnu --gcc-toolchain={{.Env.SYSROOT_LINUX_AMD64}}/usr --sysroot={{.Env.SYSROOT_LINUX_AMD64}} -I{{.Env.SYSROOT_LINUX_AMD64}}/crosscompile/clang/include -D_GNU_SOURCE -D__STDC_CONSTANT_MACROS -D__STDC_FORMAT_MACROS -D__STDC_LIMIT_MACROS
      - CGO_CXXFLAGS=-std=c++17 -nostdinc++ -isystem {{.Env.SYSROOT_LINUX_AMD64}}/usr/include/c++/12 -isystem {{.Env.SYSROOT_LINUX_AMD64}}/usr/include/x86_64-linux-gnu/c++/12 -isystem {{.Env.SYSROOT_LINUX_AMD64}}/usr/include/c++/12/backward
      - CGO_LDFLAGS=--target=x86_64-linux-gnu --gcc-toolchain={{.Env.SYSROOT_LINUX_AMD64}}/usr --sysroot={{.Env.SYSROOT_LINUX_AMD64}} -L{{.Env.SYSROOT_LINUX_AMD64}}/crosscompile/clang/lib -L{{.Env.SYSROOT_LINUX_AMD64}}/usr/lib/gcc/x86_64-linux-gnu/12 -L{{.Env.SYSROOT_LINUX_AMD64}}/usr/lib/x86_64-linux-gnu -L{{.Env.SYSROOT_LINUX_AMD64}}/lib/x86_64-linux-gnu -lLLVM-22 -lz
      - CGO_LDFLAGS_ALLOW=(--target=.*|--gcc-toolchain=.*|--sysroot.*)
    targets:
      - linux_amd64
    mod_timestamp: "{{.CommitTimestamp}}"
  - &linux-arm64
    id: llgo-linux-arm64
    main: ./cmd/llgo
    binary: bin/llgo
    flags:
      - -tags=linux,arm64,byollvm
    ldflags:
      - -X github.com/xgo-dev/llgo/internal/env.buildVersion=v{{.Version}}
      - -X github.com/xgo-dev/llgo/internal/env.buildTime={{.Date}}
      - -X github.com/xgo-dev/llgo/xtool/env/llvm.ldLLVMConfigBin=/usr/bin/llvm-config-22
      - "-extldflags=-Wl,-rpath,$ORIGIN/../crosscompile/clang/lib"
    env:
      # The amd64 Clang driver is multi-target; libraries and headers stay arm64.
      - CC={{.Env.SYSROOT_LINUX_AMD64}}/crosscompile/clang/bin/clang
      - CXX={{.Env.SYSROOT_LINUX_AMD64}}/crosscompile/clang/bin/clang++
      - CGO_CPPFLAGS=--target=aarch64-linux-gnu --gcc-toolchain={{.Env.SYSROOT_LINUX_ARM64}}/usr --sysroot={{.Env.SYSROOT_LINUX_ARM64}} -I{{.Env.SYSROOT_LINUX_ARM64}}/crosscompile/clang/include -D_GNU_SOURCE -D__STDC_CONSTANT_MACROS -D__STDC_FORMAT_MACROS -D__STDC_LIMIT_MACROS
      - CGO_CXXFLAGS=-std=c++17 -nostdinc++ -isystem {{.Env.SYSROOT_LINUX_ARM64}}/usr/include/c++/12 -isystem {{.Env.SYSROOT_LINUX_ARM64}}/usr/include/aarch64-linux-gnu/c++/12 -isystem {{.Env.SYSROOT_LINUX_ARM64}}/usr/include/c++/12/backward
      - CGO_LDFLAGS=--target=aarch64-linux-gnu --gcc-toolchain={{.Env.SYSROOT_LINUX_ARM64}}/usr --sysroot={{.Env.SYSROOT_LINUX_ARM64}} -L{{.Env.SYSROOT_LINUX_ARM64}}/crosscompile/clang/lib -L{{.Env.SYSROOT_LINUX_ARM64}}/usr/lib/gcc/aarch64-linux-gnu/12 -L{{.Env.SYSROOT_LINUX_ARM64}}/usr/lib/aarch64-linux-gnu -L{{.Env.SYSROOT_LINUX_ARM64}}/lib/aarch64-linux-gnu -lLLVM-22 -lz
      - CGO_LDFLAGS_ALLOW=(--target=.*|--gcc-toolchain=.*|--sysroot.*)
    targets:
      - linux_arm64
    mod_timestamp: "{{.CommitTimestamp}}"

  # System packages use the standard LLVM target set. The ESP-enabled tarball
  # compilers above must not be reused: Fedora's LLVM lacks Xtensa initializers.
  - <<: *linux-amd64
    id: llgo-linux-amd64-system
    env:
      - CC={{.Env.SYSROOT_LINUX_AMD64}}/crosscompile/clang/bin/clang
      - CXX={{.Env.SYSROOT_LINUX_AMD64}}/crosscompile/clang/bin/clang++
      - CGO_CPPFLAGS=--target=x86_64-linux-gnu --gcc-toolchain={{.Env.SYSROOT_LINUX_AMD64}}/usr --sysroot={{.Env.SYSROOT_LINUX_AMD64}} -I{{.Env.PWD}}/.release-toolchains/system-linux/amd64/include -I{{.Env.SYSROOT_LINUX_AMD64}}/crosscompile/clang/include -D_GNU_SOURCE -D__STDC_CONSTANT_MACROS -D__STDC_FORMAT_MACROS -D__STDC_LIMIT_MACROS
      - CGO_CXXFLAGS=-std=c++17 -nostdinc++ -isystem {{.Env.SYSROOT_LINUX_AMD64}}/usr/include/c++/12 -isystem {{.Env.SYSROOT_LINUX_AMD64}}/usr/include/x86_64-linux-gnu/c++/12 -isystem {{.Env.SYSROOT_LINUX_AMD64}}/usr/include/c++/12/backward
      - CGO_LDFLAGS=--target=x86_64-linux-gnu --gcc-toolchain={{.Env.SYSROOT_LINUX_AMD64}}/usr --sysroot={{.Env.SYSROOT_LINUX_AMD64}} -L{{.Env.SYSROOT_LINUX_AMD64}}/crosscompile/clang/lib -L{{.Env.SYSROOT_LINUX_AMD64}}/usr/lib/gcc/x86_64-linux-gnu/12 -L{{.Env.SYSROOT_LINUX_AMD64}}/usr/lib/x86_64-linux-gnu -L{{.Env.SYSROOT_LINUX_AMD64}}/lib/x86_64-linux-gnu -lLLVM-22 -lz
      - CGO_LDFLAGS_ALLOW=(--target=.*|--gcc-toolchain=.*|--sysroot.*)
  - <<: *linux-arm64
    id: llgo-linux-arm64-system
    env:
      - CC={{.Env.SYSROOT_LINUX_AMD64}}/crosscompile/clang/bin/clang
      - CXX={{.Env.SYSROOT_LINUX_AMD64}}/crosscompile/clang/bin/clang++
      - CGO_CPPFLAGS=--target=aarch64-linux-gnu --gcc-toolchain={{.Env.SYSROOT_LINUX_ARM64}}/usr --sysroot={{.Env.SYSROOT_LINUX_ARM64}} -I{{.Env.PWD}}/.release-toolchains/system-linux/arm64/include -I{{.Env.SYSROOT_LINUX_ARM64}}/crosscompile/clang/include -D_GNU_SOURCE -D__STDC_CONSTANT_MACROS -D__STDC_FORMAT_MACROS -D__STDC_LIMIT_MACROS
      - CGO_CXXFLAGS=-std=c++17 -nostdinc++ -isystem {{.Env.SYSROOT_LINUX_ARM64}}/usr/include/c++/12 -isystem {{.Env.SYSROOT_LINUX_ARM64}}/usr/include/aarch64-linux-gnu/c++/12 -isystem {{.Env.SYSROOT_LINUX_ARM64}}/usr/include/c++/12/backward
      - CGO_LDFLAGS=--target=aarch64-linux-gnu --gcc-toolchain={{.Env.SYSROOT_LINUX_ARM64}}/usr --sysroot={{.Env.SYSROOT_LINUX_ARM64}} -L{{.Env.SYSROOT_LINUX_ARM64}}/crosscompile/clang/lib -L{{.Env.SYSROOT_LINUX_ARM64}}/usr/lib/gcc/aarch64-linux-gnu/12 -L{{.Env.SYSROOT_LINUX_ARM64}}/usr/lib/aarch64-linux-gnu -L{{.Env.SYSROOT_LINUX_ARM64}}/lib/aarch64-linux-gnu -lLLVM-22 -lz
      - CGO_LDFLAGS_ALLOW=(--target=.*|--gcc-toolchain=.*|--sysroot.*)

archives:
  - formats: [tar.gz]
    ids: [llgo-darwin-amd64, llgo-darwin-arm64, llgo-linux-amd64, llgo-linux-arm64]
    name_template: >-
      {{.ProjectName}}{{.Version}}.{{.Os}}-{{.Arch}}
      {{- if .Arm}}v{{.Arm}}{{end}}
    files:
      - LICENSE
      - LICENSES
      - README.md
      - THIRD_PARTY_NOTICES.md
      - runtime
      - targets
      - src: ".release-toolchains/{{.Os}}/{{.Arch}}"
        dst: crosscompile/clang
        info:
          mode: 0755
checksum:
  name_template: "{{.ProjectName}}{{.Version}}.checksums.txt"
  # Windows CGO builds run on native Windows runners and arrive as tested
  # compact archives. The snapshot pass produces the Unix build metadata
  # they consume; the tag pass includes all six compact Windows ZIPs in the common checksum file.
  extra_files:
    - glob: '{{ if not .IsSnapshot }}.windows-dist/llgo{{ .Version }}.windows-*.zip{{ end }}'

nfpms:
  - id: llgo
    package_name: llgo
    ids: [llgo-linux-amd64-system, llgo-linux-arm64-system]
    vendor: goplus
    homepage: https://github.com/xgo-dev/llgo
    maintainer: Aofei Sheng <aofei@aofeisheng.com>
    description: |
      LLGo is a Go compiler based on LLVM in order to better integrate Go with the C ecosystem including Python. It's a
      subproject of the XGo project.

      LLGo aims to expand the boundaries of Go/XGo, providing limitless possibilities such as:

      - Game development
      - AI and data science
      - WebAssembly
      - Embedded development
      - ...
    license: Apache-2.0
    formats:
      - deb
      - rpm
    file_name_template: >-
      {{.ProjectName}}{{.Version}}.{{.Os}}-{{.Arch}}
      {{- if .Arm}}v{{.Arm}}{{end}}
    bindir: /usr/lib/llgo
    overrides:
      deb:
        dependencies:
          - golang-go (>= 1.20)
          - ca-certificates
          - tar
          - xz-utils
          - libc6 (>= 2.36)
          - libllvm22 (>= 1:22.1)
          - llvm-22
          - clang-22
          - lld-22
          - libc++-22-dev
          - build-essential
          - pkg-config
          - libgc-dev
          - libssl-dev
          - zlib1g-dev
          - libffi-dev
          - libcjson-dev
          - libsqlite3-dev
          - libuv1-dev
      rpm:
        dependencies:
          - golang-bin >= 1.20
          - ca-certificates
          - tar
          - xz
          - glibc >= 2.36
          - llvm-libs >= 22.1
          - llvm-libs < 23
          - llvm >= 22.1
          - llvm < 23
          - llvm-devel >= 22.1
          - llvm-devel < 23
          - clang >= 22.1
          - clang < 23
          - lld >= 22.1
          - lld < 23
          - libcxx-devel
          - llvm-libunwind-devel
          - gcc
          - gcc-c++
          - make
          - pkgconf-pkg-config
          - gc-devel
          - openssl-devel
          - zlib-devel
          - libffi-devel
          - cjson-devel
          - sqlite-devel
          - libuv-devel
    contents:
      - src: LICENSE
        dst: /usr/share/doc/llgo/LICENSE
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/llgo/THIRD_PARTY_NOTICES.md
      - src: LICENSES/
        dst: /usr/share/doc/llgo/LICENSES
        type: tree
      - src: runtime/
        dst: /usr/lib/llgo/runtime
        type: tree
      - src: targets/
        dst: /usr/lib/llgo/targets
        type: tree
      - src: .release-toolchains/payloads/linux/{{.Arch}}/
        dst: /usr/lib/llgo/crosscompile
        type: tree
      - src: LICENSES/XGo-LLVM-Apache-2.0-WITH-LLVM-exception.txt
        dst: /usr/lib/llgo/LICENSES/XGo-LLVM-Apache-2.0-WITH-LLVM-exception.txt
      - src: /usr/lib/llgo/bin/llgo
        dst: /usr/bin/llgo
        type: symlink

dockers_v2:
  - id: llgo
    ids: [llgo]
    dockerfile: Dockerfile
    images:
      - "{{.Env.DOCKER_IMAGE_REPO}}"
    tags:
      - "{{.Version}}"
      - '{{ if not .Prerelease }}{{.Major}}.{{.Minor}}{{ end }}'
      - '{{ if not .Prerelease }}{{.Major}}{{ end }}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: "{{.GitURL}}"
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"

snapcrafts:
  - name: llgo
    title: A Go compiler based on LLVM
    summary: A Go compiler based on LLVM
    description: |
      LLGo is a Go compiler based on LLVM in order to better integrate Go with the C ecosystem including Python. It's a
      subproject of the XGo project.

      LLGo aims to expand the boundaries of Go/XGo, providing limitless possibilities such as:

      - Game development
      - AI and data science
      - WebAssembly
      - Embedded development
      - ...
    license: Apache-2.0
    confinement: classic
    extra_files:
      - source: LICENSE
        destination: usr/share/doc/llgo/LICENSE
      - source: THIRD_PARTY_NOTICES.md
        destination: usr/share/doc/llgo/THIRD_PARTY_NOTICES.md
      - source: LICENSES
        destination: usr/share/doc/llgo/LICENSES
    name_template: >-
      {{.ProjectName}}{{.Version}}.{{.Os}}-{{.Arch}}
      {{- if .Arm}}v{{.Arm}}{{end}}

snapshot:
  # Tagged CI builds supply versioned Windows ZIPs to the release job.
  # Untagged checkouts need a numeric version for DEB/RPM metadata.
  version_template: '{{ if eq .Summary .Tag }}{{ .Version }}{{ else }}0.0.0-{{ .ShortCommit }}{{ end }}'

release:
  prerelease: auto
  extra_files:
    - glob: '{{ if not .IsSnapshot }}.windows-dist/llgo{{ .Version }}.windows-*.zip{{ end }}'
