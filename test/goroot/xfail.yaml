# Windows platform selectors may use windows/ARCH for both ABIs or the more
# specific windows-msvc/ARCH and windows-mingw/ARCH forms.
host_skips:
  - directive: run
    case: fixedbugs/issue16016.go
    reason: the test intentionally creates enough goroutines to exhaust LLGo's one-thread-per-goroutine host limit
  - directive: run
    case: chan/goroutines.go
    reason: the test intentionally creates enough goroutines to exhaust LLGo's one-thread-per-goroutine host limit
  - directive: run
    case: chanlinear.go
    reason: the test repeatedly doubles a goroutine-per-channel workload and can exhaust LLGo's one-thread-per-goroutine host limit
  - version: go1.26
    platform: darwin/arm64
    directive: runoutput
    case: fixedbugs/bug449.go
    reason: go1.26 bug449 generated build exceeds the darwin/arm64 hosted runner resource budget
  - version: go1.26
    platform: linux/amd64
    directive: runoutput
    case: fixedbugs/bug449.go
    reason: go1.26 bug449 generated build exceeds the linux/amd64 hosted runner memory budget
timeouts:
  - platform: darwin/amd64
    directive: run
    case: recover.go
    timeout: 10m
    reason: the complete panic/recover compiler stress exceeded the 3m build budget on paired Intel macOS
  - platform: wasip1/wasm
    directive: run
    case: cmplxdivide.go
    timeout: 10m
    reason: the complete complex division table passed in 249s with time spent in LLVM WebAssembly register stackification
  - platform: darwin/amd64
    directive: run
    case: abi/uglyfib.go
    timeout: 90s
    reason: the full recursive ABI stress passed in 35-46s but exceeded 60s on a hosted Intel runner where adjacent cases also took twice as long
  - platform: js/wasm
    directive: run
    case: winbatch.go
    timeout: 6m
    reason: the full GOROOT filesystem walk took 195s on Emscripten32 locally and exceeded 240s on the paired hosted runner
  - platform: js/wasm
    directive: run
    case: fixedbugs/issue78081.go
    timeout: 6m
    reason: the 1.6 million-iteration stack and GC stress loop took 147s on a passing GoJS run and exceeded 180s on another runner
