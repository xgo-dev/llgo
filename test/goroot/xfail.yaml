    directive: run
    case: fixedbugs/issue39541.go
    timeout: 2m
    reason: the one-million reflect.MakeFunc loop passes isolated replays but exceeded 90s beside the paired Go-version compiler on Windows MSVC 386; retain a bounded run with all output and exit checks
  - platform: windows/amd64
    directive: run
    case: fixedbugs/issue39541.go
    timeout: 2m
    reason: the one-million reflect.MakeFunc concurrent call loop exceeded the default minute on a paired Windows MSVC/amd64 runner; retain a bounded run with all output and exit checks
  - platform: darwin/amd64
    directive: runoutput
    case: rangegen.go
    timeout: 10m
    reason: both paired Go versions exceeded the default 3m generated-build timeout for the 6.4 MB compiler torture test on Intel macOS
  - platform: js/wasm
    directive: runoutput
    case: rangegen.go
    timeout: 15m
    reason: the large generated range-over-func program exceeds the default 3m build timeout on Emscripten; retain the complete test with a bounded compiler budget
  - platform: wasip1/wasm
    directive: runoutput
    case: rangegen.go
    timeout: 15m
    reason: the full generated range-over-func program exceeded the default 3m build budget on the paired WASI runner
  - platform: darwin/arm64
    directive: runoutput
    case: rangegen.go
    timeout: 20m
    reason: rangegen generates a large compiler torture test; paired Go 1.26/1.27 builds exceeded the default 3m build timeout on darwin/arm64 CI
  - platform: linux/amd64
    directive: runoutput
    case: rangegen.go
    timeout: 10m
    reason: rangegen generates a 6.4 MB compiler torture test; allow bounded build time while its 3 GiB heap target stays under the 4 GiB host guard
  - platform: windows-mingw/amd64
    directive: runoutput
    case: rangegen.go
    timeout: 10m
    reason: both Go 1.26 and 1.27 generated builds exceeded the default 3m timeout on Windows MinGW/amd64, peaking at 3.3 GiB each; keep the case enabled with bounded build time
  - platform: windows/arm64
    directive: runoutput
    case: rangegen.go
    timeout: 10m
    reason: the generated build still reached the 4 GiB guard with a 2 GiB Go heap target on Windows MSVC/ARM64; allow bounded build time with a case-local 1 GiB target while retaining the host resource guard
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: nosplit.go
    timeout: 2m
    reason: nosplit run runs past the default timeout on linux/amd64
