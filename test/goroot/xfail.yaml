host_skips:
  - directive: run
    case: fixedbugs/issue16016.go
    reason: the test intentionally creates enough goroutines to exhaust LLGo's one-thread-per-goroutine host limit
  - version: go1.24
    platform: darwin/arm64
    directive: runoutput
    case: rangegen.go
    reason: go1.24 rangegen runoutput exceeds the darwin/arm64 CI timeout
  - directive: run
    case: chan/goroutines.go
    reason: the test intentionally creates enough goroutines to exhaust LLGo's one-thread-per-goroutine host limit
  - directive: run
    case: chanlinear.go
    reason: the test repeatedly doubles a goroutine-per-channel workload and can exhaust LLGo's one-thread-per-goroutine host limit
  - version: go1.24
    platform: darwin/arm64
    directive: runoutput
    case: fixedbugs/bug449.go
    reason: go1.24 bug449 generated build exceeds the darwin/arm64 hosted runner resource budget
  - version: go1.26
    platform: darwin/arm64
    directive: runoutput
    case: fixedbugs/bug449.go
    reason: go1.26 bug449 generated build exceeds the darwin/arm64 hosted runner resource budget
  - version: go1.24
    platform: linux/amd64
    directive: runoutput
    case: fixedbugs/bug449.go
    reason: go1.24 bug449 generated build exceeds the linux/amd64 hosted runner memory budget
  - version: go1.26
    platform: linux/amd64
    directive: runoutput
    case: fixedbugs/bug449.go
    reason: go1.26 bug449 generated build exceeds the linux/amd64 hosted runner memory budget
timeouts:
  - version: go1.26
    platform: darwin/arm64
    directive: run
    case: fixedbugs/issue79186.go
    timeout: 90s
    reason: the 51.2 million-operation RWMutex stress loop needs load-dependent runtime slack
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: fixedbugs/issue79186.go
    timeout: 90s
    reason: the 51.2 million-operation RWMutex stress loop needs load-dependent runtime slack
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: abi/uglyfib.go
    timeout: 1m
    reason: uglyfib runs close to the default timeout on loaded linux/amd64 runners
  - version: go1.26
    platform: darwin/arm64
    directive: runoutput
    case: rangegen.go
    timeout: 20m
    reason: rangegen runoutput compiles the generated stress test past 10m on darwin/arm64 CI
  - version: go1.24
    platform: linux/amd64
    directive: run
    case: nosplit.go
    timeout: 2m
    reason: nosplit run runs past the default timeout on linux/amd64
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: nosplit.go
    timeout: 2m
    reason: nosplit run runs past the default timeout on linux/amd64
flakes:
  - version: go1.26
    platform: darwin/arm64
    directive: run
    case: fixedbugs/issue79186.go
    reason: the RWMutex stress test passes when the host is idle but can exceed its timeout under sustained CPU contention
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: fixedbugs/issue79186.go
    reason: the RWMutex stress test passes when the host is idle but can exceed its timeout under sustained CPU contention
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: fixedbugs/issue13160.go
    reason: go1.26 goroot run can either pass or panic in GC_call_with_stack_base on linux/amd64
  - version: go1.24
    platform: darwin/arm64
    directive: runoutput
    case: rotate0.go
    reason: rotate0 runoutput can either pass or time out on darwin/arm64
  - version: go1.26
    platform: darwin/arm64
    directive: runoutput
    case: rotate0.go
    reason: rotate0 runoutput can either pass or time out on darwin/arm64
  - platform: linux/amd64
    directive: run
    case: goprint.go
    reason: linux/amd64 goroot run can either pass or mismatch stderr
  - platform: darwin/arm64
    directive: run
    case: goprint.go
    reason: darwin/arm64 goroot run can either pass or fail
  - platform: linux/amd64
    directive: run
    case: fixedbugs/issue5493.go
    reason: linux/amd64 goroot run can either pass or expose incomplete goroutine stack growth
  - platform: linux/amd64
    directive: run
    case: fixedbugs/issue25897a.go
    reason: reflect-generated goroutines under a single-P continuous-GC loop can complete or exceed the 1m run timeout on linux/amd64
  - version: go1.24
    platform: linux/amd64
    directive: run
    case: fixedbugs/issue27695.go
    reason: concurrent GC can either preserve reflect-call results or expose incomplete result scanning on linux/amd64
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: fixedbugs/issue27695.go
    reason: concurrent GC can either preserve reflect-call results or expose incomplete result scanning on linux/amd64
  - version: go1.26
    platform: darwin/arm64
    directive: run
    case: fixedbugs/issue27695.go
    reason: concurrent GC can either preserve reflect-call results or expose incomplete result scanning on darwin/arm64
  - directive: run
    case: typeparam/chans.go
    reason: select over the unbuffered channel can either complete or miss the final receive and time out
  - platform: darwin/arm64
    directive: run
    case: fixedbugs/issue25897a.go
    reason: reflect-generated goroutines under a single-P continuous-GC loop can complete or exceed the 1m run timeout on darwin/arm64
xfails:
  - directive: runoutput
    case: index0.go
    reason: LLVM 19 crashes in target object emission while compiling the generated index stress program
  - directive: run
    case: fixedbugs/issue34123.go
    reason: LLGo reports the deferred recovery frame two source lines earlier than cmd/compile
  - version: go1.26
    platform: linux/amd64
    directive: run
    case: convert5.go
    reason: LLGo does not match Go 1.26 linux/amd64 saturation results for out-of-range floating-point conversions
  - directive: run
    case: fixedbugs/issue52612.go
    reason: LLGo can panic while sync/atomic.Value pins the current goroutine without shared core-runtime procPin hooks
  - version: go1.26
    directive: errorcheck
    case: fixedbugs/issue4776.go
    reason: llgo parser uses a different missing-package-clause diagnostic
  - version: go1.26
    directive: errorcheck
    case: fixedbugs/issue4405.go
    reason: llgo parser recovery emits additional malformed-statement diagnostics
  - version: go1.26
    directive: errorcheck
    case: fixedbugs/issue13266.go
    reason: llgo parser uses a different malformed-package-clause diagnostic
  - version: go1.26
    directive: errorcheck
    case: fixedbugs/issue20789.go
    reason: llgo parser does not emit the expected malformed-name diagnostic
  - version: go1.26
    directive: errorcheck
    case: fixedbugs/bug050.go
    reason: llgo parser emits an additional malformed-declaration diagnostic
  - version: go1.26
    directive: errorcheck
    case: bombad.go
    reason: llgo parser recovery emits additional byte-order-mark diagnostics

  - directive: run
    case: heapsampling.go
    reason: LLGo does not currently report the heap-profile samples required by this runtime test
