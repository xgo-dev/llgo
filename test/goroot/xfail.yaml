# Windows platform selectors may use windows/ARCH for both ABIs or the more
# specific windows-msvc/ARCH and windows-mingw/ARCH forms.
host_skips:
  - version: go1.27
    platform: linux/amd64
    directive: runoutput
    case: rangegen.go
    reason: the Go 1.27 generator exceeds the hosted runner's 4 GiB process-group limit before LLGo is invoked
  - directive: run
    case: fixedbugs/issue16016.go
    reason: the test intentionally creates enough goroutines to exhaust LLGo's one-thread-per-goroutine host limit
  - directive: run
    case: chan/goroutines.go
    reason: the test intentionally creates enough goroutines to exhaust LLGo's one-thread-per-goroutine host limit
  - directive: run
    case: chanlinear.go
    reason: the test repeatedly doubles a goroutine-per-channel workload and can exhaust LLGo's one-thread-per-goroutine host limit
  - version: go1.26
    platform: darwin/arm64
    directive: runoutput
    case: fixedbugs/bug449.go
    reason: go1.26 bug449 generated build exceeds the darwin/arm64 hosted runner resource budget
  - version: go1.26
    platform: linux/amd64
    directive: runoutput
    case: fixedbugs/bug449.go
    reason: go1.26 bug449 generated build exceeds the linux/amd64 hosted runner memory budget
